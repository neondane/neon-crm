<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon CRM v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Audiowide&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --pink:#FF1493; --pink2:#FF4FB6; --cyan:#22BFE7; --cyan2:#00E5FF;
  --grad:linear-gradient(110deg,#FF1493,#FF4FB6 38%,#22BFE7 78%,#00E5FF);
  --radius:14px; --radius-sm:10px; --shadow:0 10px 30px rgba(20,30,60,.10);
  --font:'Outfit',system-ui,-apple-system,Arial,sans-serif;
  --display:'Audiowide','Outfit',sans-serif;
}
:root[data-theme="light"]{
  --bg:#eef1f8; --bg2:#f7f9fd; --surface:#ffffff; --surface2:#f3f6fc;
  --text:#101830; --text-muted:#5f6b85; --border:rgba(20,30,60,.10);
  --row-hover:rgba(34,191,231,.08); --row-active:rgba(255,20,147,.08); --nav:#0e1830;
}
:root[data-theme="dark"]{
  --bg:#070b16; --bg2:#0b1020; --surface:#101a30; --surface2:#152138;
  --text:#eef2ff; --text-muted:#9aa6c4; --border:rgba(140,170,230,.14);
  --row-hover:rgba(34,191,231,.10); --row-active:rgba(255,20,147,.12); --nav:#070b16;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex:none;z-index:5}
.brandwrap{display:flex;align-items:center;gap:14px}
.logo{width:58px;height:58px;flex:none;border-radius:14px;padding:5px;background:var(--surface2);border:1px solid var(--border);filter:drop-shadow(0 0 7px rgba(255,20,147,.5)) drop-shadow(0 0 16px rgba(34,191,231,.35))}
.brand{font-family:var(--display);font-weight:400;letter-spacing:1.5px;font-size:23px;text-transform:uppercase;line-height:1.05}
.brand .n{color:var(--pink)}.brand .g{color:var(--cyan)}
.brand .sub{display:block;font-family:var(--font);font-size:9.5px;letter-spacing:3.5px;color:var(--text-muted);font-weight:700;margin-top:5px}
.search{flex:1;max-width:520px;margin:0 auto}
.search input{width:100%;height:40px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);color:var(--text);padding:0 18px;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,191,231,.18)}
.search input::placeholder{color:var(--text-muted)}
.toggle{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:18px;cursor:pointer;display:grid;place-items:center;transition:background .15s}
.topicons{display:flex;align-items:center;gap:7px;flex:none}
.ticon{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:17px;cursor:pointer;display:grid;place-items:center;transition:background .15s}
.ticon:hover{background:var(--row-hover)}
.ticon .gi{width:21px;height:21px}.paedit .gi{width:17px;height:17px}
.tbadge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--pink);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid var(--surface);font-family:var(--font)}
.tdrop{position:fixed;z-index:9998;background:var(--surface);border:1px solid var(--border);border-radius:13px;box-shadow:0 16px 40px rgba(0,0,0,.28);padding:8px;min-width:272px}
.tdh{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);font-weight:700;padding:6px 10px 8px}
.tdrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;font-family:inherit;font-size:13px;color:var(--text);background:none;border:none;padding:10px 11px;border-radius:9px;cursor:pointer}
.tdrow:hover{background:var(--surface2)}
.tdrow .ti{font-size:16px;flex:none;display:inline-flex}
.tdrow .ti .gi{width:18px;height:18px;color:var(--pink)}
.tdrow b{color:var(--pink)}
.tdhrow{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 2px 10px}
.tdclear{font-family:inherit;font-size:11px;font-weight:700;color:var(--cyan);background:none;border:none;cursor:pointer;padding:6px 9px;border-radius:7px}
.tdclear:hover{background:var(--surface2)}
.tdrow2{display:flex;align-items:center}
.tdrow2 .tdrow{flex:1}
.tddis{flex:none;width:26px;height:26px;border:none;background:none;color:var(--text-muted);cursor:pointer;border-radius:7px;font-size:11px;margin-right:4px}
.tddis:hover{background:var(--surface2);color:var(--pink)}
@media(max-width:680px){.topicons{display:none}}
.toggle:hover{background:var(--row-hover)}
.shell{flex:1;display:flex;min-height:0}
.sidebar{width:212px;flex:none;background:var(--surface);border-right:1px solid var(--border);padding:14px 10px;overflow-y:auto}
.navitem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--text-muted);font-weight:600;font-size:14px;cursor:pointer;margin-bottom:3px;transition:background .12s,color .12s}
.navitem .ic{width:22px;height:22px;flex:none;display:grid;place-items:center;color:inherit}
.navitem .ic svg{width:21px;height:21px;display:block}
.navitem:hover{background:var(--row-hover);color:var(--text)}
.navitem.active{background:linear-gradient(90deg,rgba(255,20,147,.13),rgba(34,191,231,.10));color:var(--text);font-weight:700;box-shadow:inset 3px 0 0 var(--pink)}
.navitem.active .ic{color:var(--pink)}
.view{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
/* contacts two-pane */
.cwrap{flex:1;display:flex;min-height:0}
.list{width:360px;flex:none;border-right:1px solid var(--border);background:var(--bg2);overflow-y:auto}
.count{padding:10px 18px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);font-weight:700;position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);z-index:1}
.row{display:flex;align-items:center;gap:12px;padding:11px 18px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .12s}
.row:hover{background:var(--row-hover)}
.row.active{background:var(--row-active);box-shadow:inset 3px 0 0 var(--pink)}
.avatar{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;background:var(--grad);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.row .info{min-width:0;flex:1}
.row .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .bz{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:6px;flex:none;color:var(--cyan);background:rgba(34,191,231,.12);border:1px solid rgba(34,191,231,.35)}
.tag.realtor{color:var(--pink);background:rgba(255,20,147,.10);border-color:rgba(255,20,147,.35)}
.detail{flex:1;overflow-y:auto}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-top:4px}
.ccard{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,box-shadow .15s,border-color .15s}
.ccard:hover{transform:translateY(-2px);border-color:var(--cyan);box-shadow:0 12px 28px rgba(20,30,60,.12)}
.ccard .info{min-width:0;flex:1}
.ccard .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard .bz{font-size:12.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pback{padding:14px 30px 0}
.clist{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.crow2{display:flex;align-items:center;gap:15px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 20px;cursor:pointer;box-shadow:var(--shadow);transition:transform .1s,border-color .15s,box-shadow .15s}
.crow2:hover{border-color:var(--cyan);box-shadow:0 10px 26px rgba(20,30,60,.10);transform:translateY(-1px)}
.crow2 .av{width:50px;height:50px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;background:var(--grad)}
.crow2 .av img{width:100%;height:100%;object-fit:cover}
.crow2 .meta{flex:1;min-width:0}
.crow2 .nm{font-weight:700;font-size:16px;display:flex;align-items:center;gap:9px}
.crow2 .sub{font-size:13px;color:var(--text-muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow2 .right{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px;min-width:46px}
.crow2 .days{font-family:var(--display);font-size:17px;color:var(--cyan)}
.crow2 .days.stale{color:var(--pink)}
.crow2 .cnt{font-size:11px;font-weight:700;background:rgba(255,20,147,.10);color:var(--pink);border:1px solid rgba(255,20,147,.3);border-radius:999px;padding:1px 8px;min-width:22px;text-align:center}
.temp{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:2px 8px;border-radius:5px}
.temp.hot{color:var(--pink);background:rgba(255,20,147,.12)}
.temp.warm{color:#e08600;background:rgba(224,134,0,.12)}
.temp.cool{color:var(--cyan);background:rgba(34,191,231,.12)}
.temp.new{color:var(--text-muted);background:var(--surface2)}
.empty{height:100%;display:grid;place-items:center;color:var(--text-muted);text-align:center;padding:40px}
.phero{position:relative;padding:36px 44px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:34px;min-height:188px}
.pawrap{position:relative;flex:none}
.phero .pa{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:400;font-size:44px;color:#fff;background:var(--grad);box-shadow:0 0 0 4px var(--surface),0 0 0 7px var(--cyan),0 10px 30px rgba(34,191,231,.32);overflow:hidden}
.phero .pa img{width:100%;height:100%;object-fit:cover}
.paedit{position:absolute;right:4px;bottom:6px;width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);background:var(--grad);color:#fff;cursor:pointer;display:grid;place-items:center;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.25);transition:transform .1s}
.paedit:hover{transform:scale(1.08)}
.phero h1{font-family:var(--display);font-weight:400;font-size:50px;line-height:1.02;letter-spacing:.5px;background:linear-gradient(120deg,var(--pink),var(--pink2) 55%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.phero .pbiz{color:var(--text-muted);font-size:18px;margin-top:10px;font-weight:600}
.phero .pbiz b{color:var(--pink)}
.phero .pmeta{margin-top:15px;display:flex;gap:8px;flex-wrap:wrap}
.phero .pmeta .pill{font-size:12.5px;padding:6px 14px}
.tierhead{display:flex;align-items:center;justify-content:space-between;padding:11px 18px;border-radius:11px;margin:20px 0 9px;font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.5px;color:#fff;box-shadow:var(--shadow)}
.tierhead .tc{font-size:12.5px;font-weight:700;font-family:var(--font);background:rgba(255,255,255,.28);padding:2px 12px;border-radius:999px}
.tierhead.tier1{background:linear-gradient(120deg,#FFB300,#FF8A00)}
.tierhead.tier2{background:linear-gradient(120deg,#FF1493,#FF5FB0)}
.tierhead.tier3{background:linear-gradient(120deg,#22BFE7,#00B4D8)}
.tierhead.tier4{background:linear-gradient(120deg,#9B5DE5,#C77DFF)}
.tierhead.tier5{background:linear-gradient(120deg,#00C2A8,#28E0B0)}
.tierhead.tier0{background:linear-gradient(120deg,#8a94a6,#aab2c0)}
.tierdot{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;color:#fff;font-size:10px;font-weight:800;margin-right:8px;vertical-align:middle;flex:none}
.efield select.esel{width:100%;font-family:inherit;font-size:14px;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;outline:none;cursor:pointer}
.efield select.esel:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,191,231,.16)}
.dcharts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.chartcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.chartcard.wide{grid-column:1/-1}
.chartcard h4{font-family:var(--display);font-weight:400;font-size:14px;margin:0 0 13px;color:var(--text);display:flex;align-items:center;gap:8px}
.chartcard h4 .sm{margin-left:auto;font-family:var(--font);font-size:11px;color:var(--text-muted);font-weight:600;letter-spacing:.3px}
.lbrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.lbn{width:118px;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.lbbar{flex:1;height:9px;background:var(--surface2);border-radius:999px;overflow:hidden}
.lbfill{height:100%;background:linear-gradient(90deg,var(--pink),var(--cyan));border-radius:999px}
.lbv{font-size:11.5px;color:var(--text-muted);white-space:nowrap;min-width:70px;text-align:right;flex:none}
.pipebar{display:flex;height:26px;border-radius:8px;overflow:hidden;background:var(--surface2)}
.pipelegs{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}
.pipeleg{font-size:11.5px;color:var(--text-muted);display:flex;align-items:center;gap:6px;font-weight:600}
.pipeleg i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.owed{display:flex;gap:14px;margin-top:15px}
.owed .ob{flex:1;background:var(--surface2);border-radius:10px;padding:11px 14px}
.owed .ob .v{font-family:var(--display);font-size:20px}
.owed .ob .l{font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--text-muted);font-weight:700;margin-top:3px}
@media(max-width:900px){.dcharts{grid-template-columns:1fr}}
.avmodal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9999}
.avbox{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;width:360px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.avbox h3{font-family:var(--display);font-weight:400;font-size:18px;margin:0 0 4px;color:var(--text)}
.avbox .sub{font-size:12.5px;color:var(--text-muted);margin-bottom:14px}
.avstage{position:relative;width:300px;height:300px;max-width:100%;margin:0 auto;border-radius:50%;overflow:hidden;background:var(--surface2);cursor:grab;touch-action:none;box-shadow:inset 0 0 0 2px var(--border)}
.avstage.drag{cursor:grabbing}
.avstage img{position:absolute;left:0;top:0;user-select:none;-webkit-user-drag:none;pointer-events:none}
.avzoom{width:100%;margin:16px 0 4px;accent-color:var(--pink)}
.avact{display:flex;gap:10px;margin-top:12px}
.avact .btn{flex:1;margin-left:0}
.avmenu{position:fixed;z-index:9998;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.28);padding:6px;min-width:210px}
.avmenu button{display:block;width:100%;text-align:left;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--text);background:none;border:none;padding:10px 12px;border-radius:8px;cursor:pointer}
.avmenu button:hover{background:var(--surface2)}
.pill{font-size:11px;font-weight:700;padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);color:var(--text-muted)}
.pill.hot{color:var(--pink);background:rgba(255,20,147,.10);border-color:rgba(255,20,147,.3)}
.pill.tier{color:var(--cyan);background:rgba(34,191,231,.10);border-color:rgba(34,191,231,.3)}
.pill.star{color:#e08600;background:rgba(224,134,0,.10);border-color:rgba(224,134,0,.3)}
.pcontact{margin-left:auto;display:flex;flex-direction:column;gap:8px;flex:none}
.cbtn{display:flex;align-items:center;justify-content:center;min-width:108px;font-family:inherit;font-size:13px;font-weight:700;padding:9px 16px;border-radius:11px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;text-decoration:none;transition:background .15s,box-shadow .15s}
.cbtn:hover{background:var(--row-hover);box-shadow:var(--shadow)}
.cbtn.call{color:#1d9e75}.cbtn.text{color:var(--cyan)}.cbtn.email{color:var(--pink)}
.pbody{display:flex;gap:18px;padding:20px 30px;align-items:flex-start}
.pleft{width:296px;flex:none;display:flex;flex-direction:column;gap:14px}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.pcard h3{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-muted);margin-bottom:12px}
.pcard .ln{display:flex;align-items:center;gap:9px;font-size:14px;padding:5px 0}
.pcard .ln a{color:var(--text);text-decoration:none}
.portalcard{background:linear-gradient(135deg,rgba(255,20,147,.07),rgba(34,191,231,.07));border-color:rgba(255,20,147,.25)}
.portalcard .url{font-family:var(--font);font-size:11px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;word-break:break-all;color:var(--text-muted);margin-bottom:10px}
.prow{display:flex;gap:8px}.prow .btn{flex:1;text-align:center;padding:8px 6px}
.actbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px;transition:background .12s}
.actbtn:hover{background:var(--row-hover)}
.ptabs{display:flex;gap:2px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.ptab{padding:11px 16px;font-weight:700;font-size:14px;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent}
.ptab.active{color:var(--text);border-bottom-color:var(--pink)}
.composer{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.csub{display:flex;border-bottom:1px solid var(--border)}
.csub div{flex:1;text-align:center;padding:12px;font-weight:700;font-size:13px;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent}
.csub div.active{color:var(--text);border-bottom-color:var(--cyan)}
.cbody{padding:14px}
.cbody .cto{font-size:12px;color:var(--text-muted);margin-bottom:8px}
.cbody textarea{width:100%;min-height:88px;font-family:inherit;font-size:14px;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px;outline:none;resize:vertical}
.crow{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px}
.actlog .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.actlog .hd h3{font-family:var(--display);font-weight:400;font-size:16px}
.actlog .filt{display:flex;gap:13px;font-size:12px;color:var(--text-muted);flex-wrap:wrap}
.actlog .filt span{cursor:pointer}.actlog .filt span.on{color:var(--pink);font-weight:700}
.actitem{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 14px;margin-bottom:8px;font-size:13px}
.actitem .k{font-weight:700;color:var(--cyan);text-transform:uppercase;font-size:10px;letter-spacing:.5px}
.noact{text-align:center;color:var(--text-muted);padding:34px}
.dwrap{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
@media(max-width:1000px){.dwrap{grid-template-columns:1fr}}
.dsection{margin-top:6px;margin-bottom:18px}
.dsection h3{font-family:var(--display);font-weight:400;font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.caldow{font-size:11px;font-weight:700;color:var(--text-muted);text-align:center;text-transform:uppercase;letter-spacing:.5px;padding:4px}

var cTab="all";
function daysSince(c){
  var ds=[]; if(c.lastVisit)ds.push(String(c.lastVisit).slice(0,10)); if(LASTSEEN[c.id])ds.push(String(LASTSEEN[c.id]).slice(0,10));
  if(!ds.length) return null; var latest=ds.sort().pop();
  var d=Math.floor((Date.now()-new Date(latest+"T00:00:00").getTime())/86400000); return d<0?0:d;
}
function tempOf(d){ if(d===null)return["new","New"]; if(d<=3)return["hot","Hot"]; if(d<=14)return["warm","Warm"]; if(d<=45)return["cool","Cool"]; return["new","Cold"]; }
function rowHtml(c){
  var d=daysSince(c), tp=tempOf(d), cnt=ICOUNT[c.id]||0;
  var sub=[c.business,c.role,c.territory].filter(Boolean).map(esc).join(" · ");
  var tc=tierColor(c.tier), tn=tierNum(c.tier);
  var tstyle=tc?(' style="border-left:5px solid '+tc+'"'):'';
  var tdot=(tn>=1&&tn<=5)?'<span class="tierdot" style="background:'+tc+'" title="Tier '+tn+'">'+tn+'</span>':'';
  return '<div class="crow2" data-id="'+c.id+'"'+tstyle+'><div class="av">'+(PHOTOS[c.id]?'<img src="'+esc(PHOTOS[c.id])+'" alt="">':esc(initials(c.name).toUpperCase()))+'</div>'
    +'<div class="meta"><div class="nm">'+tdot+esc(c.name||"Unnamed")+'<span class="temp '+tp[0]+'">'+tp[1]+'</span></div><div class="sub">'+(sub||"—")+'</div></div>'
    +'<div class="right"><div class="days'+(d!==null&&d>14?" stale":"")+'">'+(d===null?"—":d+"d")+'</div>'+(cnt?'<div class="cnt">'+cnt+'</div>':"")+'</div></div>';
}
function rowList(rows){ return rows.length?('<div class="clist">'+rows.map(rowHtml).join("")+'</div>'):'<div class="noact">No contacts.</div>'; }
var TIER_COLORS={1:"#FFB300",2:"#FF1493",3:"#22BFE7",4:"#9B5DE5",5:"#00C2A8"};
function tierNum(t){var m=/(\d+)/.exec(String(t||""));return m?+m[1]:99;}
function tierColor(t){return TIER_COLORS[tierNum(t)]||"";}
function tierView(rows){

function referralBoard(rows){

  rs.sort(function(a,b){return metric(b)-metric(a)||String(a.name||"").localeCompare(String(b.name||""));});
  var sel='<div class="cfilters"><select id="rbSortSel">'+[["referrals","Total referrals"],["revenue","Revenue referred"],["booked","Booked jobs"]].map(function(o){return '<option value="'+o[0]+'"'+(rbSortMode===o[0]?" selected":"")+'>'+o[1]+'</option>';}).join("")+'</select></div>';
  if(!rs.length) return sel+'<div class="noact">No realtors.</div>';
  return sel+'<div class="clist">'+rs.map(function(c){
    var sub=[c.business,c.territory].filter(Boolean).map(esc).join(" · ");
    var val=rbSortMode==="revenue"?money(REFREV[c.id]||0):metric(c);
    var lbl=rbSortMode==="revenue"?"referred":rbSortMode==="booked"?"booked":"referrals";
    return '<div class="crow2" data-id="'+c.id+'"><div class="av">'+(PHOTOS[c.id]?'<img src="'+esc(PHOTOS[c.id])+'" alt="">':esc(initials(c.name).toUpperCase()))+'</div>'
      +'<div class="meta"><div class="nm">'+esc(c.name||"Unnamed")+(c.portalActivatedAt?'<span class="temp cool">Active</span>':'<span class="temp new">Not active</span>')+'</div><div class="sub">'+(sub||"—")+'</div></div>'
      +'<div class="right"><div class="days" style="color:var(--pink)">'+val+'</div><div class="muted" style="font-size:10px">'+lbl+'</div></div></div>';
  }).join("")+'</div>';
}
var cSort="recent", cTypeF="", cTerrF="";
function applyCSF(rows){
  var rs=rows.slice();
  if(cTypeF) rs=rs.filter(function(c){return typeMatches(c.type,[cTypeF]);});
  if(cTerrF) rs=rs.filter(function(c){return (c.territory||"")===cTerrF;});
  rs.sort(function(a,b){
    if(cSort==="name") return String(a.name||"").localeCompare(String(b.name||""));
    if(cSort==="tier") return (tierNum(a.tier)-tierNum(b.tier))||String(a.name||"").localeCompare(String(b.name||""));
    if(cSort==="refs") return (REFCOUNT[b.id]||0)-(REFCOUNT[a.id]||0);
    var da=daysSince(a),db=daysSince(b),va=(da===null?1e9:da),vb=(db===null?1e9:db);
    return cSort==="stale"?(vb-va):(va-vb);
  });
  return rs;
}

function avPick(mode){

  inp.onchange=function(){var f=inp.files&&inp.files[0];if(!f)return;if(!/^image\//.test(f.type)){alert("Please choose an image file.");return;}var rd=new FileReader();rd.onload=function(){avCrop(rd.result,mode);};rd.onerror=function(){alert("Couldn't read that file — try another image.");};rd.readAsDataURL(f);};
  inp.click();
}
function avCrop(src,mode){
  var img=new Image();
  img.onload=function(){
    var ov=document.createElement("div");ov.className="avmodal";ov.id="avModal";
    ov.innerHTML='<div class="avbox"><h3>'+(mode==="card"?"Frame the headshot":"Position your photo")+'</h3>'
      +'<div class="sub">'+(mode==="card"?"Drag and zoom to frame the face on the card.":"Drag to reposition, slider to zoom.")+'</div>'
      +'<div class="avstage" id="avStage"><img id="avImg" src="'+src+'"></div>'
      +'<input type="range" class="avzoom" id="avZoom" min="1" max="3.5" step="0.01" value="1">'
      +'<div class="avact"><button class="btn grad" id="avSaveBtn">Save photo</button><button class="btn" id="avCancel">Cancel</button></div></div>';
    document.body.appendChild(ov);
    var S=300, nw=img.naturalWidth, nh=img.naturalHeight, cover=Math.max(S/nw,S/nh);
    var st={z:1,ox:0,oy:0};
    var el=document.getElementById("avImg"), stage=document.getElementById("avStage");
    function apply(){
      var ds=cover*st.z, dw=nw*ds, dh=nh*ds, maxX=(dw-S)/2, maxY=(dh-S)/2;
      st.ox=Math.max(-maxX,Math.min(maxX,st.ox)); st.oy=Math.max(-maxY,Math.min(maxY,st.oy));
      el.style.width=dw+"px"; el.style.height=dh+"px"; el.style.left=((S-dw)/2+st.ox)+"px"; el.style.top=((S-dh)/2+st.oy)+"px";
    }
    apply();
    el.onerror=function(){avCloseModal();alert("That image couldn't be displayed — try a different file.");};
    document.getElementById("avZoom").oninput=function(){st.z=+this.value;apply();};
    var drag=false,lx,ly;
    function pt(e){var t=e.touches&&e.touches[0];return t?{x:t.clientX,y:t.clientY}:{x:e.clientX,y:e.clientY};}
    function down(e){drag=true;var p=pt(e);lx=p.x;ly=p.y;stage.classList.add("drag");e.preventDefault();}
    function move(e){if(!drag)return;var p=pt(e);st.ox+=p.x-lx;st.oy+=p.y-ly;lx=p.x;ly=p.y;apply();if(e.touches)e.preventDefault();}
    function up(){drag=false;stage.classList.remove("drag");}
    stage.onmousedown=down; document.onmousemove=move; document.onmouseup=up;
    stage.ontouchstart=down; document.ontouchmove=move; document.ontouchend=up;
    document.getElementById("avCancel").onclick=avCloseModal;
    document.getElementById("avSaveBtn").onclick=function(){
      var out=320, cv=document.createElement("canvas");cv.width=out;cv.height=out;var ctx=cv.getContext("2d");
      var ds=cover*st.z, imgLeft=(S-nw*ds)/2+st.ox, imgTop=(S-nh*ds)/2+st.oy;
      var sx=(0-imgLeft)/ds, sy=(0-imgTop)/ds, sS=S/ds;
      ctx.drawImage(img,sx,sy,sS,sS,0,0,out,out);
      var avatar=cv.toDataURL("image/jpeg",0.85);
      var card=mode==="card"?avDownscale(img,1200):null;
      avSave(avatar,card);
    };
  };
  img.onerror=function(){alert("That image couldn't be loaded — try a different photo.");};
  img.src=src;
}
function avCloseModal(){var m=document.getElementById("avModal");if(m)m.remove();document.onmousemove=null;document.onmouseup=null;document.ontouchmove=null;document.ontouchend=null;}
function avDownscale(img,maxW){var w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,maxW/w);var cv=document.createElement("canvas");cv.width=Math.round(w*s);cv.height=Math.round(h*s);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);return cv.toDataURL("image/jpeg",0.82);}

}

  if(cSub==="email"){ if(!c.email){alert("No email on file.");return;} if(!msg.trim())return; if(!confirm("Send this email to "+c.name+"?"))return; try{var er=await fetch(NEON_API+"/api/sendEmail",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({to:c.email,subject:"Neon Giant Moving",body:msg,contactId:c.id})});var ej={};try{ej=await er.json();}catch(e){} if(er.ok&&ej.ok!==false){alert("Email sent.");loadActivity(c);}else{alert("Email not sent: "+(ej.message||ej.error||("HTTP "+er.status)));}}catch(e){alert("Send failed — check connection.");} return; }
  alert("Call logging comes next.");
}

var PORTAL=null, portalTab="payouts", portalFilter="";
var SBADGE={ "new":"#22aee4","contacted":"#ff9933","booked":"#33cc66","completed":"#e08600","lost":"#888" };
function sbadge(s){var k=String(s||"new").toLowerCase();var c=SBADGE[k]||"#22aee4";return '<span class="sbadge" style="color:'+c+';background:'+c+'22;border:1px solid '+c+'55">'+esc((s||"new").toUpperCase())+'</span>';}
async function renderPortal(){
  document.getElementById("view").innerHTML='<div class="page"><div class="ph"><h2>'+gi("portal")+' Referral Portal</h2></div><div class="stub" style="height:auto;padding:30px"><div class="spin"></div></div></div>';
  if(!PORTAL){
    try{
      var res=await Promise.all([
        sb("portal_leads?select=id,customerName,realtorName,realtorId,status,moveDate,customerPhone,fromAddress,toAddress,notes,submittedAt&order=id.desc"),
        sb("referrals?select=id,contactId,contactName,jobName,status,date&order=date.desc"),
        sb("contacts?type=eq.Realtor&select=id,name,business,portalActivatedAt,profilePic,cardImage&order=name.asc"),
        sb("paid_referrals?select=key,paid_at,partner")
      ]);
      PORTAL={leads:res[0]||[],refs:res[1]||[],realtors:res[2]||[],paid:res[3]||[]};
    }catch(e){ document.getElementById("view").innerHTML='<div class="stub"><div><div class="big">Couldn’t reach the database</div><div>Open this once it’s deployed (live data needs the server).</div></div></div>'; return; }
  }
  drawPortal();
}
function payoutItems(){
  var paidMap={}; PORTAL.paid.forEach(function(p){paidMap[p.key]=p.paid_at||"1";});
  var actMap={}; PORTAL.realtors.forEach(function(c){ if(c.portalActivatedAt) actMap[String(c.id)]=String(c.portalActivatedAt).slice(0,10); });
  var byId={}; PORTAL.realtors.forEach(function(c){ byId[String(c.id)]=c; });
  var items=[];
  PORTAL.leads.forEach(function(l){
    if(String(l.status||"").toLowerCase()!=="completed") return;
    var key="portal:"+l.id; var rt=byId[String(l.realtorId)]||{};
    items.push({key:key,partner:(l.realtorName||"").trim(),customer:l.customerName,source:"portal",amount:50,paid:!!paidMap[key],id:l.id,email:rt.email||""});
  });
  PORTAL.refs.forEach(function(r){
    if(String(r.status||"").toLowerCase()!=="completed") return;
    var act=actMap[String(r.contactId)]; if(!act) return;
    var d=String(r.date||"").slice(0,10); if(d && d<act) return;
    var key="manual:"+r.id; var rt=byId[String(r.contactId)]||{};
    items.push({key:key,partner:(r.contactName||"").trim(),customer:r.jobName,source:"referral",amount:50,paid:!!paidMap[key],id:r.id,email:rt.email||""});
  });
  return items;
}
function drawPortal(){
  var items=payoutItems();
  var due=items.filter(function(x){return !x.paid;});
  var dueTotal=due.reduce(function(s,x){return s+x.amount;},0);
  var paidTotal=items.filter(function(x){return x.paid;}).reduce(function(s,x){return s+x.amount;},0);
  var f=portalFilter.toLowerCase().trim();
  var html='<div class="page"><div class="ph"><h2>'+gi("portal")+' Referral Portal</h2></div>';
  html+='<div class="stats">'
    +'<div class="stat"><div class="big" style="color:#e08600">'+money(dueTotal)+'</div><div class="lbl">Payouts due</div></div>'
    +'<div class="stat"><div class="big" style="color:#1d9e75">'+money(paidTotal)+'</div><div class="lbl">Paid</div></div>'
    +'<div class="stat"><div class="big">'+PORTAL.leads.length+'</div><div class="lbl">Portal leads</div></div>'
    +'<div class="stat"><div class="big">'+PORTAL.realtors.filter(function(c){return c.portalActivatedAt;}).length+'</div><div class="lbl">Active partners</div></div></div>';
  html+='<div class="tabs">'
    +'<div class="tab'+(portalTab==="payouts"?" active":"")+'" data-t="payouts">Payouts Due ('+due.length+')</div>'
    +'<div class="tab'+(portalTab==="leads"?" active":"")+'" data-t="leads">Leads ('+PORTAL.leads.length+')</div>'
    +'<div class="tab'+(portalTab==="realtors"?" active":"")+'" data-t="realtors">Realtors ('+PORTAL.realtors.length+')</div></div>';
  html+='<div id="ptab">';
  if(portalTab==="payouts"){
    if(!due.length) html+='<div class="muted" style="padding:14px">Nothing due. When a completed job matches an active partner, it shows here.</div>';
    else due.forEach(function(it){
      html+='<div class="payrow"><div><div style="font-weight:800">'+esc(it.partner||"(unknown)")+'</div><div class="meta muted" style="font-size:12px">'+esc(it.customer||"")+' · '+esc(it.source)+'</div></div>'
        +'<div style="display:flex;align-items:center;gap:10px"><span class="due">'+money(it.amount)+' due</span>'
        +'<button class="btn grad" data-send="'+esc(it.key)+'" title="Send a Tremendous gift card now">Send $'+it.amount+'</button>'
        +'<button class="btn green" data-pay="'+esc(it.key)+'" data-partner="'+esc(it.partner||"")+'" title="Record as paid (if you paid outside the app)">Mark paid</button></div></div>';
    });
  }else if(portalTab==="leads"){
    var leads=PORTAL.leads.filter(function(l){ if(!f) return true; return ((l.customerName||"")+" "+(l.realtorName||"")).toLowerCase().indexOf(f)>=0; });
    if(!leads.length) html+='<div class="muted" style="padding:14px">No leads.</div>';
    leads.forEach(function(l){
      html+='<div class="lead"><div class="top"><div><div class="who">'+esc(l.customerName||"—")+'</div>'
        +'<div class="meta">From '+esc(l.realtorName||"—")+(l.moveDate?' · move '+esc(String(l.moveDate).slice(0,10)):"")+(l.customerPhone?' · '+esc(l.customerPhone):"")+'</div></div>'+sbadge(l.status)+'</div></div>';
    });
  }else{
    var rs=PORTAL.realtors.filter(function(c){ if(!f) return true; return ((c.name||"")+" "+(c.business||"")).toLowerCase().indexOf(f)>=0; });
    rs.forEach(function(c){
      var on=!!c.portalActivatedAt;
      html+='<div class="lead"><div class="top"><div><div class="who">'+esc(c.name||"—")+'</div><div class="meta">'+esc(c.business||"")+'</div></div>'
        +'<span class="sbadge" style="color:'+(on?"#1d9e75":"#888")+';background:'+(on?"#1d9e75":"#888")+'22;border:1px solid '+(on?"#1d9e75":"#888")+'55">'+(on?"ACTIVE":"NOT ACTIVE")+'</span></div></div>';
    });
  }
  html+='</div></div>';
  document.getElementById("view").innerHTML=html;
  [].forEach.call(document.querySelectorAll(".tab"),function(el){el.onclick=function(){portalTab=el.getAttribute("data-t");drawPortal();};});
  [].forEach.call(document.querySelectorAll("[data-pay]"),function(el){el.onclick=function(){markPaid(el.getAttribute("data-pay"),el.getAttribute("data-partner"));};});
  [].forEach.call(document.querySelectorAll("[data-send]"),function(el){el.onclick=function(){var k=el.getAttribute("data-send");var it=due.filter(function(x){return x.key===k;})[0];if(it)sendPayoutGo(it,el);};});
}
async function sendPayoutGo(it,btn){
  if(!it.email){ alert("No email on file for "+(it.partner||"this partner")+". Add their email on their profile first, then send."); return; }
  if(!confirm("Send a $"+it.amount+" Tremendous gift card to:\n\n"+(it.partner||"")+"  <"+it.email+">\nfor the "+(it.customer||"")+" referral.\n\nThis sends REAL money. Continue?")) return;
  if(btn){ btn.disabled=true; btn.textContent="Sending…"; }
  try{
    var res=await fetch(NEON_API+"/api/sendPayout",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({realtorEmail:it.email,realtorName:it.partner,amount:it.amount,leadId:it.id,customerName:it.customer,testMode:false})}).then(function(x){return x.json();});
    var okay = res && !res.error && (res.ok || res.order || res.status==="ok" || res.success);
    if(okay){ banner("Sent $"+it.amount+" to "+it.partner+"."); await markPaid(it.key,it.partner); }
    else { if(btn){btn.disabled=false;btn.textContent="Send $"+it.amount;} alert("Payout did NOT go through: "+(res&&(res.error||res.message)||"unknown error")+"\nNothing was charged. You can retry or Mark paid manually."); }
  }catch(e){ if(btn){btn.disabled=false;btn.textContent="Send $"+it.amount;} alert("Payout failed to reach the service (nothing charged): "+e.message); }
}
async function markPaid(key,partner){
  if(!confirm("Mark "+partner+" paid for this referral?\n\nThis only records it as paid (no money is sent here).")) return;
  var today=new Date().toISOString().slice(0,10);
  PORTAL.paid.push({key:key,paid_at:today,partner:partner});
  drawPortal();
  try{ await sbWrite("POST","paid_referrals",{key:key,partner:partner,amount:50,paid_at:today}); }
  catch(e){ alert("Couldn't save that — refresh and try again."); }
}

/* ---------------- Shared data for the other views ---------------- */
var DATA={refs:null,leads:null,paid:null,msgs:null};
function spinPage(title){ document.getElementById("view").innerHTML='<div class="page"><div class="ph"><h2><span class="hash">#</span> '+esc(title)+'</h2></div><div class="noact"><span class="spin"></span></div></div>'; }
function stat(big,lbl,color){ return '<div class="stat"><div class="big"'+(color?' style="color:'+color+'"':'')+'>'+big+'</div><div class="lbl">'+esc(lbl)+'</div></div>'; }
async function ensureData(cb){
  if(DATA.refs&&DATA.leads&&DATA.paid){ cb&&cb(); return; }
  try{DATA.refs=await sb("referrals?select=id,contactId,contactName,jobName,status,date,amount&order=date.desc");}catch(e){DATA.refs=DATA.refs||[];}
  try{DATA.leads=await sb("portal_leads?select=id,customerName,realtorName,realtorId,status,moveDate,submittedAt,fromAddress,toAddress&order=id.desc");}catch(e){DATA.leads=DATA.leads||[];}
  try{DATA.paid=await sb("paid_referrals?select=key,paid_at");}catch(e){DATA.paid=DATA.paid||[];}
  try{var sd=await sb("sms_messages?select=created_at");var ed=await sb("email_messages?select=created_at");DATA.msgDates=sd.map(function(m){return m.created_at;}).concat(ed.map(function(m){return m.created_at;})).filter(Boolean);}catch(e){DATA.msgDates=DATA.msgDates||[];}
  try{DATA.strikes=await sb("recruit_strikes?select=agent,count,summary,listed_at&order=listed_at.desc");}catch(e){DATA.strikes=DATA.strikes||[];}
  cb&&cb();
}
function strikeMap(){var m={};(DATA.strikes||[]).forEach(function(s){var k=String(s.agent||"").toLowerCase().trim();if(!m[k])m[k]=s;});return m;}
function strikeFor(name){var s=strikeMap()[String(name||"").toLowerCase().trim()];if(!s)return null;var days=(Date.now()-new Date(s.listed_at).getTime())/86400000;return days<=21?s:null;}
function activeStrikes(){return (DATA.strikes||[]).filter(function(s){return (Date.now()-new Date(s.listed_at).getTime())/86400000<=21&&(+s.count>0);});}
function kfmt(n){n=+n||0;return n>=1000?"$"+(n/1000).toFixed(n>=10000?0:1)+"k":"$"+Math.round(n);}
function svgBars(items,fmt,gid){
  var W=620,H=180,pad=22,n=items.length||1,gap=(W-pad*2)/n,bw=gap*0.58;
  var max=Math.max.apply(null,items.map(function(m){return m.v;}).concat([1]));
  var id="g_"+gid;
  var bars=items.map(function(m,i){var h=m.v/max*(H-48);var x=pad+i*gap+(gap-bw)/2;var y=H-28-h;return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(h,1).toFixed(1)+'" rx="3" fill="url(#'+id+')"/>'+(m.v?'<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle" font-size="9" fill="#94a0b3">'+esc(String(fmt(m.v)))+'</text>':'')+'<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle" font-size="9" fill="#94a0b3">'+esc(m.label)+'</text>';}).join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF1493"/><stop offset="1" stop-color="#22BFE7"/></linearGradient></defs>'+bars+'</svg>';
}
function chartTopPartners(refs){
  var by={};refs.forEach(function(r){var name=r.contactName||"—";if(!by[name])by[name]={n:0,amt:0};by[name].n++;by[name].amt+=(+r.amount||0);});
  var arr=Object.keys(by).map(function(k){return {name:k,n:by[k].n,amt:by[k].amt};}).sort(function(a,b){return b.n-a.n||b.amt-a.amt;}).slice(0,6);
  var max=Math.max.apply(null,arr.map(function(a){return a.n;}).concat([1]));
  return arr.length?arr.map(function(a){return '<div class="lbrow"><div class="lbn">'+esc(a.name)+'</div><div class="lbbar"><div class="lbfill" style="width:'+(a.n/max*100)+'%"></div></div><div class="lbv">'+a.n+' · '+kfmt(a.amt)+'</div></div>';}).join(""):'<div class="noact">No referrals yet.</div>';
}
function chartPipeline(refs){
  var s={referred:0,booked:0,completed:0};refs.forEach(function(r){var k=String(r.status||"").toLowerCase();if(s[k]!=null)s[k]++;});
  var tot=s.referred+s.booked+s.completed||1;
  var seg=[["Referred",s.referred,"#22BFE7"],["Booked",s.booked,"#9B5DE5"],["Completed",s.completed,"#FF1493"]];
  return '<div class="pipebar">'+seg.map(function(x){return x[1]?'<div style="width:'+(x[1]/tot*100)+'%;background:'+x[2]+'" title="'+x[0]+'"></div>':'';}).join("")+'</div><div class="pipelegs">'+seg.map(function(x){return '<span class="pipeleg"><i style="background:'+x[2]+'"></i>'+x[0]+' '+x[1]+'</span>';}).join("")+'</div>';
}
function chartTierDonut(){
  var counts={};ALL.forEach(function(c){var tn=tierNum(c.tier);var k=(tn>=1&&tn<=5)?tn:0;counts[k]=(counts[k]||0)+1;});
  var order=[1,2,3,4,5,0],tot=ALL.length||1,acc=0,R=54,C=2*Math.PI*R;
  var segs=order.filter(function(k){return counts[k];}).map(function(k){var frac=counts[k]/tot,col=(k===0?"#9aa3b2":TIER_COLORS[k]),dash=frac*C,off=acc*C;acc+=frac;return '<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="20" stroke-dasharray="'+dash.toFixed(1)+' '+(C-dash).toFixed(1)+'" stroke-dashoffset="'+(-off).toFixed(1)+'" transform="rotate(-90 70 70)"/>';}).join("");
  var legend=order.filter(function(k){return counts[k];}).map(function(k){var col=(k===0?"#9aa3b2":TIER_COLORS[k]);return '<span class="pipeleg"><i style="background:'+col+'"></i>'+(k===0?"No tier":"Tier "+k)+' '+counts[k]+'</span>';}).join("");
  return '<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap"><svg width="140" height="140" viewBox="0 0 140 140">'+segs+'<text x="70" y="67" text-anchor="middle" font-size="24" font-family="Audiowide" fill="#94a0b3">'+ALL.length+'</text><text x="70" y="86" text-anchor="middle" font-size="9" fill="#94a0b3">contacts</text></svg><div class="pipelegs" style="flex-direction:column;gap:6px;align-items:flex-start">'+legend+'</div></div>';
}
function dashCharts(due){
  var refs=DATA.refs||[], paidTot=(DATA.paid||[]).length*50, now=new Date(), months=[];
  for(var i=11;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({key:d.toISOString().slice(0,7),label:d.toLocaleString("en",{month:"short"}),v:0});}
  var mi={};months.forEach(function(m,idx){mi[m.key]=idx;});
  refs.forEach(function(r){var k=String(r.date||"").slice(0,7);if(mi[k]!=null)months[mi[k]].v+=(+r.amount||0);});
  var weeks=[];for(var j=7;j>=0;j--){var wd=new Date(now);wd.setHours(0,0,0,0);wd.setDate(wd.getDate()-j*7);weeks.push({start:wd.getTime(),label:(wd.getMonth()+1)+"/"+wd.getDate(),v:0});}
  (DATA.msgDates||[]).forEach(function(ds){var t=new Date(ds).getTime();for(var k=weeks.length-1;k>=0;k--){if(t>=weeks[k].start){weeks[k].v++;break;}}});
  var html='<div class="dcharts">';
  html+='<div class="chartcard wide"><h4>'+gi("cash")+' Referral revenue by month<span class="sm">last 12 months</span></h4>'+svgBars(months,function(v){return kfmt(v);},"rev")+'</div>';
  html+='<div class="chartcard"><h4>'+gi("trophy")+' Top referring partners</h4>'+chartTopPartners(refs.filter(function(r){return (+r.amount||0)>0;}))+'</div>';
  html+='<div class="chartcard"><h4>'+gi("funnel")+' Referral pipeline</h4>'+chartPipeline(refs)+'<div class="owed"><div class="ob"><div class="v" style="color:#e08600">'+money(due)+'</div><div class="l">Payouts owed</div></div><div class="ob"><div class="v" style="color:#1d9e75">'+money(paidTot)+'</div><div class="l">Paid to date</div></div></div></div>';
  html+='<div class="chartcard"><h4>'+gi("medal")+' Contacts by tier</h4>'+chartTierDonut()+'</div>';
  html+='<div class="chartcard"><h4>'+gi("megaphone")+' Outreach activity<span class="sm">texts + emails / week</span></h4>'+svgBars(weeks,function(v){return v;},"out")+'</div>';
  return html+'</div>';
}
function wireContactClicks(){ [].forEach.call(document.querySelectorAll(".crow2[data-id],.bcard[data-id],[data-cid]"),function(el){el.onclick=function(){openContact(+(el.getAttribute("data-id")||el.getAttribute("data-cid")));};}); paintAvatars(); }

/* ---------------- Dashboard ---------------- */
function renderDashboard(){ spinPage("Dashboard"); ensureData(function(){ if(view==="dashboard") drawDashboard(); }); }
function drawDashboard(){
  var realtors=ALL.filter(function(c){return /realtor/i.test(c.type||"");});
  var activeP=realtors.filter(function(c){return c.portalActivatedAt;}).length;
  var paidMap={};(DATA.paid||[]).forEach(function(p){paidMap[p.key]=1;});
  var actMap={};ALL.forEach(function(c){if(c.portalActivatedAt)actMap[String(c.id)]=String(c.portalActivatedAt).slice(0,10);});
  var due=0;
  (DATA.leads||[]).forEach(function(l){if(String(l.status||"").toLowerCase()==="completed"&&!paidMap["portal:"+l.id])due+=50;});
  (DATA.refs||[]).forEach(function(r){if(String(r.status||"").toLowerCase()!=="completed")return;var a=actMap[String(r.contactId)];if(!a)return;if(String(r.date||"").slice(0,10)<a)return;if(!paidMap["manual:"+r.id])due+=50;});
  var ym=new Date().toISOString().slice(0,7);
  var refsMonth=(DATA.refs||[]).filter(function(r){return String(r.date||"").slice(0,7)===ym;}).length;
  var stale=ALL.filter(function(c){var d=daysSince(c);return d!==null&&d>21;}).sort(function(a,b){return (daysSince(b)||0)-(daysSince(a)||0);}).slice(0,8);
  var pulse=[];
  (DATA.refs||[]).forEach(function(r){pulse.push({who:r.contactName,what:r.jobName,date:String(r.date||"").slice(0,10),status:r.status,amt:r.amount});});
  (DATA.leads||[]).forEach(function(l){pulse.push({who:l.realtorName,what:l.customerName,date:String(l.moveDate||l.submittedAt||"").slice(0,10),status:l.status});});
  pulse=pulse.filter(function(p){return p.date;}).sort(function(a,b){return a.date<b.date?1:-1;}).slice(0,12);
  var html='<div class="page"><div class="ph"><h2>'+gi("dashboard")+' Dashboard</h2></div>';
  html+='<div class="stats">'+stat(ALL.length,"Contacts")+stat(realtors.length,"Realtors")+stat(activeP,"Active partners")+stat(money(due),"Payouts due","#e08600")+stat((DATA.leads||[]).length,"Portal leads")+stat(refsMonth,"Referrals this month")+'</div>';
  html+=dashCharts(due);
  html+='<div class="dwrap"><div class="dsection"><h3>'+gi("bolt")+' Partner Pulse</h3>'+(pulse.length?pulse.map(function(p){return '<div class="actitem"><span class="k">'+esc(p.status||"")+'</span> · '+esc(p.date||"—")+'<div style="margin-top:3px"><b>'+esc(p.who||"—")+'</b> — '+esc(p.what||"")+(p.amt?' · '+money(p.amt):"")+'</div></div>';}).join(""):'<div class="noact">No recent activity.</div>')+'</div>';
  html+='<div class="dsection"><h3>'+gi("bell")+' Needs attention</h3>'+(stale.length?'<div class="clist">'+stale.map(rowHtml).join("")+'</div>':'<div class="noact">Everyone has been contacted recently.</div>')+'</div></div></div>';
  document.getElementById("view").innerHTML=html;
  wireContactClicks(); updateTopBadges();
}

/* ---------------- Inbox ---------------- */
function renderInbox(){ spinPage("Inbox"); loadMsgs(function(){ if(view==="inbox") drawInbox(); }); }
async function loadMsgs(cb){
  if(DATA.msgs){ cb&&cb(); return; }
  var m=[];
  try{var s=await sb("sms_messages?select=contact_id,direction,body,created_at&order=created_at.desc&limit=400");s.forEach(function(x){m.push({cid:x.contact_id,kind:"text",dir:x.direction,text:x.body||"",when:String(x.created_at||"").slice(0,16).replace("T"," ")});});}catch(e){}
  try{var e2=await sb("email_messages?select=contact_id,direction,subject,created_at&order=created_at.desc&limit=400");e2.forEach(function(x){m.push({cid:x.contact_id,kind:"email",dir:x.direction,text:x.subject||"(email)",when:String(x.created_at||"").slice(0,16).replace("T"," ")});});}catch(e){}
  m.sort(function(a,b){return a.when<b.when?1:-1;});
  DATA.msgs=m; cb&&cb();
}
var inboxChan="all", inboxDir="all";
function drawInbox(){
  var byC={}; DATA.msgs.forEach(function(m){if(m.cid==null)return;if(!byC[m.cid]){byC[m.cid]={cid:m.cid,latest:m,count:0};}byC[m.cid].count++;});
  var threads=Object.keys(byC).map(function(k){return byC[k];}).sort(function(a,b){return a.latest.when<b.latest.when?1:-1;});
  var nameOf=function(id){var c=ALL.filter(function(x){return +x.id===+id;})[0];return c?c.name:("Contact "+id);};
  var f=(document.getElementById("q").value||"").toLowerCase().trim();
  if(f) threads=threads.filter(function(t){return nameOf(t.cid).toLowerCase().indexOf(f)>=0||(t.latest.text||"").toLowerCase().indexOf(f)>=0;});
  if(inboxChan!=="all") threads=threads.filter(function(t){return t.latest.kind===inboxChan;});

function drawCalendar(){
  var y=calMonth.getFullYear(), m=calMonth.getMonth();
  var startDow=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();
  var mk=y+"-"+String(m+1).padStart(2,"0");
  var evs={};
  function add(dt,label,type){ if(!dt)return; var k=String(dt).slice(0,10); if(k.slice(0,7)!==mk)return; (evs[k]=evs[k]||[]).push({label:label,type:type}); }
  (DATA.leads||[]).forEach(function(l){ add(l.moveDate,l.customerName||"move","move"); });
  (DATA.refs||[]).forEach(function(r){ add(r.date,r.jobName||r.contactName||"job","job"); });
  var mname=calMonth.toLocaleString("en-US",{month:"long",year:"numeric"});
  var html='<div class="page"><div class="ph"><h2>'+gi("calendar")+' Calendar</h2><div class="calnav" style="margin-left:auto"><button class="btn" id="calPrev">‹</button><b style="min-width:160px;text-align:center">'+esc(mname)+'</b><button class="btn" id="calNext">›</button></div></div><div class="cal">';
  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(function(d){html+='<div class="caldow">'+d+'</div>';});
  var i; for(i=0;i<startDow;i++) html+='<div class="calcell empty"></div>';
  var todayK=new Date().toISOString().slice(0,10);
  var dn; for(dn=1;dn<=days;dn++){
    var k=mk+"-"+String(dn).padStart(2,"0"); var list=evs[k]||[];
    html+='<div class="calcell'+(k===todayK?" today":"")+'"><div class="dn">'+dn+'</div>'+list.slice(0,3).map(function(e){return '<div class="calev '+(e.type==="move"?"move":"")+'" title="'+esc(e.label)+'">'+esc(e.label)+'</div>';}).join("")+(list.length>3?'<div class="calev">+'+(list.length-3)+' more</div>':"")+'</div>';
  }
  html+='</div></div>';
  document.getElementById("view").innerHTML=html;
  document.getElementById("calPrev").onclick=function(){calMonth=new Date(y,m-1,1);drawCalendar();};

var tlTerr=[], tlType=[], tlLoaded=false, tlQueue={}, tlShowQ=false;

function tlChecked(name){ return [].slice.call(document.querySelectorAll('input[name='+name+']:checked')).map(function(x){return x.value;}); }
function tlScore(c){
  var tier=String(c.tier||"").replace(/[^0-9]/g,"");
  var tierW=tier==="1"?3:tier==="2"?2:tier==="3"?1.4:1;
  var cap=+(c.unitCount||c.bedCount||0); var capW=1+Math.min(cap,500)/120;
  var rating=+(c.googleRating||0), rev=+(c.reviewCount||0);
  var ratW=1+(rating?rating/5:0)*0.6+(rev>100?0.3:rev>30?0.15:0);
  return tierW*capW*ratW;
}
function tlUncaptured(c){
  if(c.portalActivatedAt) return false;   // already a partner
  if(c.lastVisit) return false;           // visited at some point
  if(LASTSEEN[c.id]) return false;        // texted/emailed
  if((ICOUNT[c.id]||0)>0) return false;   // any logged interaction
  return true;
}

  var dm="Hi "+firstName(r.name)+"! I run Neon Giant Moving — we make agents look great by handling their clients' moves and we reward referrals. Worth a quick connect?";
  var html='<div class="page"><div class="pback"><button class="btn" id="pbBack">'+gi("recruit")+' Recruit Board</button></div>';
  html+='<div class="pbhero"><div class="pbav">'+esc(initials(r.name).toUpperCase())+'</div><div style="flex:1;min-width:0"><h1>'+esc(r.name)+'</h1><div class="pbsub">'+esc(r.brokerage)+'</div><div class="pbpills"><span class="rbst '+st.cls+'">'+st.s+'</span><span class="pill">'+esc(String(r.txns))+' txns</span><span class="pill">$'+r.vol.toFixed(1)+'M volume</span></div></div></div>';
  html+='<div class="chartcard" style="margin-bottom:16px"><h4>'+gi("recruit")+' Recruit stage</h4><div class="pbstages">'+RB_STAGES.map(function(s){return '<button class="pbstage'+(s===stage?" on":"")+'" data-stage="'+s+'">'+s+'</button>';}).join("")+'</div></div>';

    +'<div class="hk"><div class="hkv">#'+prank+' of '+ptot+'</div><div class="hkl">where '+esc(firstName(r.name))+'\'s $'+r.vol.toFixed(1)+'M would rank among your active partners — top producers hate being left off a board</div></div>'
    +'<div class="hk"><div class="hkv">~'+money(estYr)+'/yr</div><div class="hkl">est. referral rewards if just ~30% of their '+r.txns+' deals refer their move</div></div>'
    +'<div class="hk"><div class="hkv">5★ reviews</div><div class="hkl">every client you move is prompted to credit '+esc(firstName(r.name))+' in their Google/Zillow review — you sell reviews, not $50</div></div>'
    +'</div></div>';
  html+='<div class="chartcard" style="margin-bottom:16px'+(strk?';border:1px solid var(--pink)':'')+'"><h4>'+gi("flame")+' Strike timing'+(strk?' — <span style="color:var(--pink)">strike now</span>':'')+'</h4>'
    +(strk?('<div style="font-size:13.5px;line-height:1.5"><b style="color:var(--pink)">'+esc(firstName(r.name))+' just listed '+strk.count+' home'+(strk.count>1?'s':'')+'</b> ('+esc(String(strk.listed_at).slice(0,10))+'). Every new listing is a future move — reach out today before a competitor does.'+(strk.summary?'<div class="muted" style="font-size:12px;margin-top:6px">'+esc(strk.summary)+'</div>':'')+'</div>'):'<div class="muted" style="font-size:12.5px">No fresh listings flagged. Check now to time your outreach to their live deal flow.</div>')
    +'<button class="btn'+(strk?'':' grad')+'" id="pbListings" style="margin-top:12px">'+gi("search")+' Check recent listings</button><div id="pbListOut" style="margin-top:10px"></div></div>';
  html+='<div class="dcharts">';
  html+='<div class="chartcard"><h4>'+gi("search")+' Research &amp; dossier</h4><div class="muted" style="font-size:12.5px;margin-bottom:10px">Pull up what\'s public on '+esc(firstName(r.name))+':</div><div class="pblinks">'+links.map(function(l){return '<button class="btn pblink" data-url="'+esc(l[2])+'">'+gi(l[0])+' '+l[1]+'</button>';}).join("")+'</div><button class="btn grad" id="pbAI" style="margin-top:12px;width:100%">'+gi("bolt")+' AI dossier — personality &amp; how to win them</button><div id="pbAIout" style="margin-top:10px"></div></div>';
  html+='<div class="chartcard"><h4>'+gi("portal")+' Warm-intro path</h4><div style="font-size:13px;line-height:1.5">'+esc(intro)+'</div>'+(sameBrok.length?'<div class="pbintros">'+sameBrok.slice(0,5).map(function(c){return '<div class="mrow" data-cid="'+c.id+'"><div class="avatar">'+(PHOTOS[c.id]?'<img src="'+esc(PHOTOS[c.id])+'" alt="">':esc(initials(c.name).toUpperCase()))+'</div><div style="flex:1;min-width:0"><div class="mn">'+esc(c.name)+(c.portalActivatedAt?' <span class="pill hot" style="padding:1px 8px;font-size:9px">Partner</span>':'')+'</div><div class="ms">'+esc(c.business||"")+'</div></div></div>';}).join("")+'</div>':'')+'</div>';
  html+='</div>';
  html+='<div class="chartcard"><h4>'+gi("chat")+' Outreach drafts</h4><div class="muted" style="font-size:12px;margin-bottom:10px">Review, tweak, then copy. Nothing sends automatically.</div>'+pbDraft("Email",email,7)+pbDraft("Text",text,3)+pbDraft("DM",dm,3)+'</div>';
  html+='<div class="pbactions">'+(inCrm?'<button class="btn" id="pbView">'+gi("contacts")+' Open contact</button>':'<button class="btn grad" id="pbAdd">'+gi("contacts")+' Add to CRM as prospect</button>')+'</div>';
  html+='</div>';
  document.getElementById("view").innerHTML=html;
  document.getElementById("pbBack").onclick=function(){go("recruit");};
  [].forEach.call(document.querySelectorAll(".pblink"),function(b){b.onclick=function(){window.open(b.getAttribute("data-url"),"_blank","noopener");};});
  [].forEach.call(document.querySelectorAll(".pbstage"),function(b){b.onclick=function(){rbStageSet(r.name,b.getAttribute("data-stage"));drawPlaybook();};});
  [].forEach.call(document.querySelectorAll(".pbcopy"),function(b){b.onclick=function(){try{navigator.clipboard.writeText(decodeURIComponent(b.getAttribute("data-copy")));}catch(e){}b.innerHTML=gi("check")+" Copied";setTimeout(function(){b.innerHTML=gi("note")+" Copy";},1400);};});
  var aiB=document.getElementById("pbAI");if(aiB)aiB.onclick=function(){pbResearch(r);};
  var lB=document.getElementById("pbListings");if(lB)lB.onclick=function(){pbCheckListings(r);};
  var addB=document.getElementById("pbAdd");if(addB)addB.onclick=function(){pbAddToCrm(r);};
  var vB=document.getElementById("pbView");if(vB)vB.onclick=function(){if(st.id)openContact(st.id);};
  wireContactClicks();
}
async function pbResearch(r){
  var out=document.getElementById("pbAIout"),btn=document.getElementById("pbAI");
  btn.disabled=true;btn.innerHTML=gi("bolt")+" Building dossier… (~20s)";out.innerHTML='<div class="noact"><span class="spin"></span> Researching '+esc(firstName(r.name))+' &amp; profiling how to win them…</div>';
  try{
    var res=await fetch(NEON_API+"/api/researchAgent",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"researchAgent",opts:{name:r.name,brokerage:r.brokerage,mode:"dossier"}})}).then(function(x){return x.json();});
    var d=res&&(res.dossier||res.summary||res.result||res);
    out.innerHTML='<div class="pbdossier">'+esc(typeof d==="string"?d:JSON.stringify(d,null,1))+'</div>';
  }catch(e){ out.innerHTML='<div class="muted" style="font-size:12.5px">The AI dossier (contact info + personality read + the exact angle, channel and tone to win them) connects once v2 is on your live domain — it can\'t reach the endpoint from a local file. Use the research links above in the meantime.</div>'; }
  btn.disabled=false;btn.innerHTML=gi("bolt")+" AI dossier — personality &amp; how to win them";
}
async function pbCheckListings(r){
  var out=document.getElementById("pbListOut"),btn=document.getElementById("pbListings");
  btn.disabled=true;btn.innerHTML=gi("search")+" Checking… (~20s)";out.innerHTML='<div class="noact"><span class="spin"></span> Searching for recent listings…</div>';
  try{
    var res=await fetch(NEON_API+"/api/checkListings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"checkListings",opts:{name:r.name,brokerage:r.brokerage}})}).then(function(x){return x.json();});
    var c=res&&(res.count!=null?res.count:(res.listings?res.listings.length:0));
    var sum=res&&(res.summary||(res.listings&&res.listings.join?res.listings.join("\n"):""));
    out.innerHTML='<div class="pbdossier">'+(c?('<b style="color:var(--pink)">'+c+' recent listing'+(c>1?'s':'')+' found — strike now.</b>\n'):'No recent listings found right now.\n')+esc(sum||"")+'</div>';
    if(c>0){ try{ await fetch(SB_URL+"/rest/v1/recruit_strikes",{method:"POST",headers:Object.assign({},H,{"Content-Type":"application/json","Prefer":"resolution=merge-duplicates"}),body:JSON.stringify({agent:r.name,count:c,summary:sum||"",listed_at:new Date().toISOString()})}); DATA.strikes=await sb("recruit_strikes?select=agent,count,summary,listed_at&order=listed_at.desc"); updateTopBadges(); }catch(e){} }
  }catch(e){ out.innerHTML='<div class="muted" style="font-size:12.5px">AI listing checks connect once the AI functions are deployed (deploy-ai). Once live, a found listing flags a 🔥 strike on the Recruit Board and in your alerts.</div>'; }
  btn.disabled=false;btn.innerHTML=gi("search")+" Check recent listings";
}
async function pbAddToCrm(r){
  if(!confirm("Add "+r.name+" to your CRM as a realtor prospect?"))return;
  var ids=ALL.map(function(c){return +c.id;}).filter(function(n){return !isNaN(n);});
  var nid=(ids.length?Math.max.apply(null,ids):0)+1;
  var rec={id:nid,name:r.name,business:r.brokerage,type:"Realtor",role:"Realtor",notes:"Added from Recruit Board — "+r.txns+" txns, $"+r.vol+"M volume."};
  ALL.push(rec); rbStageSet(r.name,"Added"); drawPlaybook();
  try{ await sbWrite("POST","contacts",rec); banner(r.name+" added to your CRM as a prospect."); }
  catch(e){ banner("Added on screen — couldn't reach the database (saves once you're online/deployed)."); }
}

/* ---------------- Theme + boot ---------------- */
window.addEventListener("error",function(ev){ if(ev&&ev.message&&!window.__ngErr){window.__ngErr=1;try{banner("A script error occurred: "+ev.message+". Please reload — your data is safe.");}catch(e){}} });
(function(){var saved;try{saved=localStorage.getItem("crmv2Theme");}catch(e){}var t=saved||"light";document.documentElement.setAttribute("data-theme",t);document.getElementById("themeBtn").textContent=(t==="dark"?"☀":"☾");})();
document.getElementById("themeBtn").onclick=function(){var cur=document.documentElement.getAttribute("data-theme");var t=cur==="light"?"dark":"light";document.documentElement.setAttribute("data-theme",t);this.textContent=(t==="dark"?"☀":"☾");try{localStorage.setItem("crmv2Theme",t);}catch(e){}if(view==="map")renderMap();};
/* ---- Top notification icons ---- */
function topAlerts(){
  var stale=ALL.filter(function(c){var d=daysSince(c);return d!==null&&d>21;}).length;
  var paidMap={};(DATA.paid||[]).forEach(function(p){paidMap[p.key]=1;});
  var actMap={};ALL.forEach(function(c){if(c.portalActivatedAt)actMap[String(c.id)]=String(c.portalActivatedAt).slice(0,10);});
  var due=0;
  (DATA.leads||[]).forEach(function(l){if(String(l.status||"").toLowerCase()==="completed"&&!paidMap["portal:"+l.id])due+=50;});
  (DATA.refs||[]).forEach(function(r){if(String(r.status||"").toLowerCase()!=="completed")return;var a=actMap[String(r.contactId)];if(!a)return;if(String(r.date||"").slice(0,10)<a)return;if(!paidMap["manual:"+r.id])due+=50;});
  var newLeads=(DATA.leads||[]).filter(function(l){var s=String(l.status||"").toLowerCase();return s==="new"||s==="";}).length;
  var recentMsgs=(DATA.msgDates||[]).filter(function(d){return (Date.now()-new Date(d).getTime())/86400000<=7;}).length;
  return {stale:stale,due:due,newLeads:newLeads,recentMsgs:recentMsgs};
}
function setBadge(id,n){var el=document.getElementById(id);if(!el)return;if(n>0){el.textContent=n>99?"99+":n;el.style.display="";}else el.style.display="none";}
function notifItems(){
  var a=topAlerts(),items=[];
  var strikes=activeStrikes().length;
  if(strikes)items.push({k:"strike",n:strikes,ic:"flame",txt:"<b>"+strikes+"</b> target"+(strikes>1?"s":"")+" just listed — strike now",go:"recruit"});
  if(a.stale)items.push({k:"stale",n:a.stale,ic:"bell",txt:"<b>"+a.stale+"</b> contacts need follow-up",go:"contacts"});
  if(a.due>0)items.push({k:"due",n:a.due,ic:"cash",txt:"<b>"+money(a.due)+"</b> in payouts due",go:"portal"});
  if(a.newLeads)items.push({k:"lead",n:a.newLeads,ic:"flag",txt:"<b>"+a.newLeads+"</b> new portal leads",go:"portal"});
  if(a.recentMsgs)items.push({k:"msg",n:a.recentMsgs,ic:"inbox",txt:"<b>"+a.recentMsgs+"</b> messages this week",go:"inbox"});
  return items;
}
function notifDis(){try{return JSON.parse(localStorage.getItem("crmNotifDismiss")||"{}");}catch(e){return {};}}
function notifSave(d){try{localStorage.setItem("crmNotifDismiss",JSON.stringify(d));}catch(e){}}
function notifActive(){var dis=notifDis();return notifItems().filter(function(it){return !(dis[it.k]!=null&&it.n<=dis[it.k]);});}
function updateTopBadges(){
  if(!ALL||!ALL.length)return;
  var a=topAlerts();
  setBadge("bFollow",a.newLeads);
  setBadge("bBell",notifActive().length);
  setBadge("bInbox",a.recentMsgs);
}
function toggleBell(){
  var ex=document.getElementById("bellDrop");if(ex){ex.remove();document.removeEventListener("mousedown",_bellOff);return;}
  var items=notifActive();
  var d=document.createElement("div");d.className="tdrop";d.id="bellDrop";
  var head='<div class="tdhrow"><span class="tdh">Alerts</span>'+(items.length?'<button class="tdclear" id="notifClear">Mark all read</button>':'')+'</div>';
  var body=items.length?items.map(function(it){return '<div class="tdrow2"><button class="tdrow" data-go="'+it.go+'"><span class="ti">'+gi(it.ic)+'</span><span>'+it.txt+'</span></button><button class="tddis" data-dis="'+it.k+'" data-n="'+it.n+'" title="Dismiss">✕</button></div>';}).join(""):'<div class="tdrow" style="cursor:default"><span class="ti">'+gi("check")+'</span><span>You\'re all caught up</span></div>';
  d.innerHTML=head+body;
  var bell=document.getElementById("tBell");document.body.appendChild(d);
  var r=bell.getBoundingClientRect();d.style.top=(r.bottom+8)+"px";d.style.right=Math.max(10,(window.innerWidth-r.right))+"px";
  [].forEach.call(d.querySelectorAll("[data-go]"),function(b){b.onclick=function(){var v=b.getAttribute("data-go");d.remove();document.removeEventListener("mousedown",_bellOff);if(v)go(v);};});
  [].forEach.call(d.querySelectorAll("[data-dis]"),function(b){b.onclick=function(e){e.stopPropagation();var dis=notifDis();dis[b.getAttribute("data-dis")]=+b.getAttribute("data-n");notifSave(dis);updateTopBadges();d.remove();document.removeEventListener("mousedown",_bellOff);toggleBell();};});
  var clr=document.getElementById("notifClear");if(clr)clr.onclick=function(){var dis=notifDis();notifItems().forEach(function(it){dis[it.k]=it.n;});notifSave(dis);updateTopBadges();d.remove();document.removeEventListener("mousedown",_bellOff);};
  setTimeout(function(){document.addEventListener("mousedown",_bellOff);},0);
}
function _bellOff(e){var d=document.getElementById("bellDrop");if(d&&!d.contains(e.target)&&e.target.id!=="tBell"){d.remove();document.removeEventListener("mousedown",_bellOff);}}
document.getElementById("tFollow").onclick=function(){go("portal");};
document.getElementById("tInbox").onclick=function(){go("inbox");};
document.getElementById("tBell").onclick=toggleBell;
document.addEventListener("keydown",function(e){if(e.key!=="Escape")return;var m=document.getElementById("avModal");if(m){avCloseModal();return;}var b=document.getElementById("bellDrop");if(b){b.remove();document.removeEventListener("mousedown",_bellOff);return;}closeAvMenu();});
document.getElementById("q").addEventListener("input",function(){
  if(view==="contacts") renderContacts(this.value);
  else if(view==="portal"){ portalFilter=this.value; if(PORTAL) drawPortal(); }
  else if(view==="inbox"&&DATA.msgs) drawInbox();
});
renderNav();
loadContacts().then(function(){
  var last=""; try{last=localStorage.getItem("crmNav")||"";}catch(e){}
  if(last.indexOf("c:")===0){ var id=+last.slice(2); if(id&&ALL.some(function(x){return x.id===id;})){ go("contacts"); openContact(id); } else go("contacts"); }
  else if(last){ go(last); } else go("contacts");
  setTimeout(function(){ ensureData(updateTopBadges); },400);
});
/* ---- Live refresh: keep notifications + dashboard current without a reload ---- */
async function refreshLive(){
  try{ DATA.refs=await sb("referrals?select=id,contactId,contactName,jobName,status,date,amount&order=date.desc"); }catch(e){}
  try{ DATA.leads=await sb("portal_leads?select=id,customerName,realtorName,realtorId,status,moveDate,submittedAt,fromAddress,toAddress&order=id.desc"); }catch(e){}
  try{ DATA.paid=await sb("paid_referrals?select=key,paid_at"); }catch(e){}
  try{ var sd=await sb("sms_messages?select=created_at");var ed=await sb("email_messages?select=created_at");DATA.msgDates=sd.map(function(m){return m.created_at;}).concat(ed.map(function(m){return m.created_at;})).filter(Boolean); }catch(e){}
  try{ DATA.strikes=await sb("recruit_strikes?select=agent,count,summary,listed_at&order=listed_at.desc"); }catch(e){}
  try{ updateTopBadges(); }catch(e){}
  // refresh the at-a-glance dashboard only when it's open and nothing is mid-interaction
  if(view==="dashboard" && !document.getElementById("bellDrop") && !document.getElementById("avModal")){ try{ drawDashboard(); }catch(e){} }
}
setInterval(refreshLive, 180000); // every 3 minutes
