<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Giant CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--p:#e33b93;--b:#22aee4;--d:#08080d;--d2:#10101a;--d3:#1a1a28;--d4:#24243a;--g:#8888aa;--w:#f0f0f5;--gn:#33cc66;--o:#ff9933;--r:#ff3366;--gold:#ffd700}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--d);color:var(--w);font-family:'Outfit',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}select,input,textarea{font-family:inherit}
a{color:var(--b);text-decoration:none}

/* Header */
.hdr{padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--d3);position:sticky;top:0;z-index:100;background:rgba(8,8,13,.92);backdrop-filter:blur(16px)}
.hdr-l{display:flex;align-items:center;gap:10px}.logo{height:40px;border-radius:5px}
.brd{font-size:17px;font-weight:800}.brd-s{font-size:9px;color:var(--g);letter-spacing:.1em;text-transform:uppercase}
.hdr-r{display:flex;gap:6px;align-items:center}
.btn-k{background:var(--d3);border:none;color:var(--g);padding:8px 10px;border-radius:8px;font-size:11px}
.btn-log{border:none;color:#fff;padding:11px 20px;border-radius:10px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--p),var(--b));box-shadow:0 3px 16px #e33b9333}

/* Tabs */
.tabs{display:flex;border-bottom:1px solid var(--d3);padding:0 16px;overflow-x:auto}
.tab{padding:11px 14px;font-size:12px;font-weight:600;color:var(--g);border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--p);border-bottom-color:var(--p)}.tab:hover{color:var(--w)}

/* Stats */
.sts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 16px}
.st{background:var(--d2);border-radius:10px;padding:12px;border:1px solid var(--d3)}
.st b{font-size:22px;font-weight:800;display:block}.st small{font-size:10px;color:var(--g);text-transform:uppercase}

/* Content */
.cnt{padding:0 16px 100px;max-width:1100px;margin:0 auto}
.flt{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.flt input,.flt select{background:var(--d2);border:1px solid var(--d3);color:var(--w);padding:9px 12px;border-radius:9px;font-size:12px;outline:none}
.flt input{flex:1 1 160px;min-width:120px}

/* Chips */
.cr{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
.ch{padding:6px 14px;border-radius:20px;font-size:11px;font-weight:600;background:var(--d2);color:var(--g);border:1px solid var(--d3);cursor:pointer;white-space:nowrap;flex-shrink:0}
.ch.on{background:#e33b9322;color:var(--p);border-color:#e33b9355}

/* Cards */
.cd{background:var(--d2);border-radius:11px;padding:13px 15px;border:1px solid var(--d3);margin-bottom:7px;cursor:pointer;border-left:3px solid var(--g)}
.cd:hover{border-color:#22aee433}
.cd-t{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.nm{font-size:14px;font-weight:700}.rl{color:var(--g);font-size:11px;margin-top:1px}.bz{color:#e33b93bb}
.mt{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}.mt span{font-size:10px;color:var(--g)}.rf{color:var(--p)!important}
.dy{text-align:right;flex-shrink:0}.dy b{font-size:17px;font-weight:800;display:block}.dy small{font-size:9px;color:var(--g)}
.bg{display:inline-block;font-size:9px;padding:2px 7px;border-radius:8px;font-weight:600;margin-left:5px}
.tb{display:inline-block;font-size:9px;padding:2px 7px;border-radius:8px;font-weight:700;margin-left:4px;background:#22aee422;color:var(--b);border:1px solid #22aee444}
.rb{display:inline-flex;align-items:center;gap:3px;font-size:9px;padding:2px 7px;border-radius:7px;background:#ff993322;color:var(--o);border:1px solid #ff993344;margin-top:3px}

/* Toast */
.tt{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--d2);border:1px solid var(--d3);color:var(--w);padding:10px 20px;border-radius:10px;font-size:13px;z-index:3000;display:none;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.tt.ok{border-color:var(--gn);color:var(--gn)}.tt.er{border-color:var(--r);color:var(--r)}

/* Loading */
.ld{text-align:center;padding:60px}.sp{width:40px;height:40px;margin:0 auto 14px;border:3px solid var(--d3);border-top-color:var(--b);border-radius:50%;animation:spin .8s linear infinite}

/* Profile panel */
.ov{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.75);display:none}.ov.op{display:flex;justify-content:flex-end}
.pn{width:min(520px,100%);background:var(--d);height:100%;overflow-y:auto;border-left:1px solid var(--d3)}
.ph{padding:16px 20px;border-bottom:1px solid var(--d3);display:flex;justify-content:space-between;align-items:flex-start}
.px{background:var(--d3);border:none;color:var(--g);font-size:15px;width:30px;height:30px;border-radius:7px}
.pb{padding:18px 20px}
.ps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.pst{background:var(--d2);border-radius:9px;padding:10px 8px;text-align:center}
.pst b{font-size:18px;font-weight:800;display:block}.pst small{font-size:9px;color:var(--g);display:block;margin-top:2px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px}
.act{background:var(--d2);border:1px solid var(--d3);border-radius:10px;padding:10px 6px;text-align:center;font-size:10px;font-weight:600;color:var(--g);display:flex;flex-direction:column;align-items:center;gap:4px}
.act:hover{border-color:var(--b);color:var(--w);background:var(--d3)}
.pi{background:var(--d2);border-radius:9px;padding:13px 15px;margin-bottom:12px}
.pi h5{font-size:12px;font-weight:600;color:var(--b);margin-bottom:8px}
.pr{display:flex;justify-content:space-between;margin-bottom:5px;font-size:12px}.pr .k{color:var(--g)}
.vi{background:var(--d2);border-radius:9px;padding:11px 13px;margin-bottom:7px;border-left:3px solid var(--b)}
.vi .vd{color:var(--b);font-size:11px;font-weight:600}.vi .vh{color:var(--g);font-size:11px}
.vi .vn{color:var(--w);font-size:12px;line-height:1.5;margin-top:4px}
.rs{background:var(--d2);border-radius:9px;padding:13px 15px;margin-bottom:12px;border:1px dashed var(--o)}
.rs h5{color:var(--o);font-size:12px;margin-bottom:7px}
.ri{display:flex;align-items:center;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid var(--d3)}.ri:last-child{border:none}
.ri-x{background:none;border:none;color:var(--r);font-size:10px;padding:2px 6px;border-radius:4px}
.qf{background:var(--d2);border-radius:9px;padding:14px;margin-bottom:12px;border:1px solid var(--b)}
.qf h5{color:var(--b);font-size:12px;margin-bottom:10px}
.ef{background:var(--d2);border-radius:9px;padding:14px;margin-bottom:12px;border:1px solid var(--p)}
.ef h5{color:var(--p);font-size:12px;margin-bottom:10px}

/* Forms */
.fg{margin-bottom:10px}.fg label{display:block;font-size:11px;color:var(--g);margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.fg input,.fg select,.fg textarea{width:100%;background:var(--d2);border:1px solid var(--d3);color:var(--w);padding:9px 11px;border-radius:8px;font-size:13px;outline:none}
.fg textarea{min-height:50px;resize:vertical}.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--b)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bs{width:100%;padding:11px;border:none;border-radius:10px;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--p),var(--b));margin-top:6px}
.bc{width:100%;padding:9px;border:1px solid var(--d3);border-radius:10px;font-size:13px;font-weight:600;color:var(--g);background:none;margin-top:4px}
.bsm{padding:7px 14px;border:none;border-radius:8px;font-size:12px;font-weight:600;color:#fff;background:var(--d3)}

/* Fullscreen overlay */
.fs{position:fixed;inset:0;z-index:1000;background:var(--d);flex-direction:column;overflow:auto}
.fsh{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--d3);flex-shrink:0}
.fsx{background:none;border:none;color:var(--g);font-size:13px}
.fsb{flex:1;overflow:auto;padding:18px}

/* Mic */
.mic{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--b));border:none;position:relative;box-shadow:0 0 25px #e33b9333;margin:0 auto;display:block}
.mic svg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.mic.rc{animation:mp 1.5s ease-in-out infinite}
@keyframes mp{0%,100%{box-shadow:0 0 25px #e33b9333}50%{box-shadow:0 0 50px #e33b9388}}
.lb{display:inline-flex;align-items:center;gap:7px;background:#e33b9322;padding:5px 14px;border-radius:14px;border:1px solid #e33b9344}
.ld2{width:8px;height:8px;border-radius:50%;background:var(--p);animation:pulse 1s infinite}
.mc{background:var(--d2);border:2px solid var(--b);border-radius:10px;padding:12px;margin:8px 0;cursor:pointer}.mc:hover{background:var(--d3)}.mc.sl{border-color:var(--p);background:#e33b9311}
.ca{width:100%;max-width:380px;margin:0 auto;border-radius:12px;overflow:hidden;background:var(--d2);border:2px dashed var(--d4)}
.ca video{width:100%;display:block}.ca canvas{display:none}

/* Tier tab */
.tier-sec{margin-bottom:20px}
.tier-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:8px 0;border-bottom:1px solid var(--d3)}

/* Map */
#mapBox{width:100%;height:420px;border-radius:11px;overflow:hidden;border:1px solid var(--d3);margin:12px 0}
.leaflet-container{background:var(--d)!important}
.map-lbl{background:transparent;border:none;font-family:'Outfit',sans-serif;white-space:nowrap}.map-lbl div{text-align:center}
.ml-n{font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.9)}.ml-c{font-size:10px;font-weight:800;color:#e33b93;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.ml-s{padding:1px 7px;background:var(--b);border-radius:5px;color:#fff}

/* Login */
#loginOv{position:fixed;inset:0;z-index:2000;background:var(--d);display:flex;justify-content:center;align-items:center}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){.sts{grid-template-columns:1fr 1fr}.brd{font-size:14px}#mapBox{height:320px}.ps{grid-template-columns:repeat(2,1fr)}.acts{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr"><div class="hdr-l"><div><div class="brd"><span style="color:var(--p)">NEON</span> <span style="color:var(--b)">CRM</span></div><div class="brd-s">Referral & Outreach Tracker</div></div></div>
<div class="hdr-r"><span id="userBadge" style="color:var(--gn);font-size:11px;font-weight:600;cursor:pointer;display:none"></span><button class="btn-k" onclick="setCK()">🔑</button><button class="btn-log" onclick="openLog()">+ Log It</button></div></div>

<!-- TABS -->
<div class="tabs">
<button class="tab on" onclick="sT('d',this)">Dashboard</button>
<button class="tab" onclick="sT('m',this)">Map</button>
<button class="tab" onclick="sT('t',this)">Tiers</button>
<button class="tab" onclick="sT('lb',this)">Referrals</button>
<button class="tab" onclick="sT('r',this)">Reminders</button>
</div>

<div class="sts" id="sR"></div>
<div class="cnt" id="mc"></div>

<!-- Profile overlay -->
<div class="ov" id="ov" onclick="cP()"><div class="pn" onclick="event.stopPropagation()" id="pc"></div></div>

<!-- Log It overlay (hidden by default) -->
<div class="fs" id="lO" style="display:none"><div class="fsh"><button class="fsx" onclick="cL()">✕ Cancel</button><span style="color:var(--w);font-weight:700">Log It</span><div style="width:60px"></div></div><div class="fsb" id="lB"></div></div>

<!-- Toast -->
<div class="tt" id="tt"></div>

<!-- LOGIN SCREEN -->
<div id="loginOv">
  <div style="text-align:center;max-width:320px;padding:20px">
    <div style="font-size:22px;font-weight:800;margin-bottom:4px"><span style="color:var(--p)">NEON</span> <span style="color:var(--b)">CRM</span></div>
    <div style="color:var(--g);font-size:11px;margin-bottom:24px;text-transform:uppercase;letter-spacing:.1em">Referral & Outreach Tracker</div>
    <div class="fg"><label>Who are you?</label><select id="loginName" style="text-align:center;font-size:15px;padding:12px">
      <option value="">Select your name...</option>
      <option value="Dane">Dane — Owner</option>
      <option value="Jeff">Jeff — Co-Owner</option>
      <option value="Tyler">Tyler — Sales</option>
      <option value="Valentina">Valentina — Sales</option>
    </select></div>
    <div class="fg"><label>PIN</label><input id="loginPin" type="password" maxlength="4" placeholder="4-digit PIN" style="text-align:center;font-size:20px;letter-spacing:8px;padding:12px"></div>
    <button class="bs" onclick="doLogin()" style="font-size:16px;padding:14px">Sign In</button>
    <div id="loginErr" style="color:var(--r);font-size:12px;margin-top:10px"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════
var API = 'https://script.google.com/macros/s/AKfycbwcMb_ZWBEsWa-lKci7aTkBdlfwAq6JcA2N9vTkLcI3OkwN1PW9dPdU3bPt8RJ1MkVrzw/exec';
var CK = sessionStorage.getItem('neon_ck') || '';

var TR = ["All","Anacortes","Burlington","Oak Harbor","Mt. Vernon","Sedro-Woolley","Bellingham","North of Bellingham","Snohomish","South Whidbey","Arlington","Stanwood","La Conner"];
var TY = ["Real Estate Agency","Self-Storage Facility","U-Haul Dealer","Assisted Living / Senior Care","Apartment Complex","Property Management","Estate Sale Company","Attorney / Law","Home Services","Other"];
var TM = ["Dane","Tyler","Valentina","Jeff","Luke","Carlos","Marshall","Samuel","Ryan","William","Charles","Michael"];
var SC = [{l:"Hot",c:"#ff3366",e:"\u{1F525}"},{l:"Warm",c:"#ff9933",e:"\u{2600}\u{FE0F}"},{l:"Cool",c:"#22aee4",e:"\u{2744}\u{FE0F}"},{l:"New",c:"#8888aa",e:"\u{1F195}"}];
var TI = ["\u2014","Tier 1","Tier 2","Tier 3","Tier 4"];
var TID = {"Tier 1":"Core Partners","Tier 2":"Active Referrers","Tier 3":"Warm Relationships","Tier 4":"Prospects"};
var TC = {"Anacortes":[48.5126,-122.6127],"Burlington":[48.4757,-122.3254],"Oak Harbor":[48.2932,-122.6433],"Mt. Vernon":[48.4201,-122.334],"Sedro-Woolley":[48.5037,-122.2366],"Bellingham":[48.7519,-122.4787],"North of Bellingham":[48.86,-122.51],"Snohomish":[48.166,-122.22],"South Whidbey":[48.12,-122.68],"Arlington":[48.1987,-122.1254],"Stanwood":[48.2404,-122.3706],"La Conner":[48.3921,-122.4932]};
var IC = {'Self-Storage':'\u{1F4E6}','Real Estate':'\u{1F3E0}','U-Haul':'\u{1F69B}','Assisted':'\u{1F3E5}','Apartment':'\u{1F3E2}','Attorney':'\u{2696}\u{FE0F}','Home Serv':'\u{1F527}','Estate Sale':'\u{1F3F7}\u{FE0F}','Property':'\u{1F3D8}\u{FE0F}','Other':'\u{1F4CB}'};

var D=[], V=[], R=[], JR=[], TEAM=[];
var CU = null;
var tb='d', fT='All', fY='All', fS='', sr='urgency';
var lm=null, mM=[], ok=false;

// ═══════════════════════════════════════
// API HELPERS
// ═══════════════════════════════════════
function aG(a) {
  return fetch(API + '?action=' + a).then(function(r){ return r.json(); });
}
function aP(d) {
  return fetch(API, {method:'POST', body:JSON.stringify(d), headers:{'Content-Type':'text/plain'}}).then(function(r){ return r.json(); });
}
function ai(p, img) {
  if (!CK) { tt('Set API key first','er'); return Promise.reject(new Error('No key')); }
  var msgs = [{role:'user',content:[]}];
  if (img) { msgs[0].content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:img.split(',')[1]}}); }
  msgs[0].content.push({type:'text',text:p});
  return fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':CK,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:msgs})
  }).then(function(r){ return r.json(); }).then(function(d){
    if (d.error) throw new Error(d.error.message);
    return d.content[0].text;
  });
}

function setCK() {
  var k = prompt('Paste your Claude API key (starts with sk-ant-):');
  if (k && k.indexOf('sk-ant') === 0) { CK=k; sessionStorage.setItem('neon_ck',k); tt('Key saved','ok'); }
  else if (k) { tt('Invalid key','er'); }
}

function tt(m, t) {
  t = t || 'ok';
  var e = document.getElementById('tt');
  e.textContent = m;
  e.className = 'tt ' + t;
  e.style.display = 'block';
  setTimeout(function(){ e.style.display='none'; }, 3500);
}

// ═══════════════════════════════════════
// LOGIN
// ═══════════════════════════════════════
function initApp() {
  // Check if already logged in
  try { CU = JSON.parse(sessionStorage.getItem('neon_user')); } catch(e) { CU = null; }
  if (CU) {
    document.getElementById('loginOv').style.display = 'none';
    updateUserUI();
    load();
  }
  // If not logged in, login screen is already visible
}

function doLogin() {
  var name = document.getElementById('loginName').value;
  var pin = document.getElementById('loginPin').value;
  if (!name) { document.getElementById('loginErr').textContent='Select your name'; return; }
  if (!pin) { document.getElementById('loginErr').textContent='Enter your PIN'; return; }
  var pins = {'Dane':'1234','Jeff':'1234','Tyler':'1234','Valentina':'1234'};
  if (pins[name] && pins[name] === pin) {
    CU = {name:name, email:name.toLowerCase()+'@neongiantmoving.com', role: name==='Dane'?'Owner':name==='Jeff'?'Co-Owner':'Sales'};
    sessionStorage.setItem('neon_user', JSON.stringify(CU));
    document.getElementById('loginOv').style.display = 'none';
    updateUserUI();
    load();
  } else {
    document.getElementById('loginErr').textContent = 'Invalid PIN';
  }
}

function logout() {
  sessionStorage.removeItem('neon_user');
  sessionStorage.removeItem('neon_ck');
  CU = null;
  document.getElementById('loginOv').style.display = 'flex';
  document.getElementById('loginPin').value = '';
  document.getElementById('loginErr').textContent = '';
}

function updateUserUI() {
  var badge = document.getElementById('userBadge');
  if (badge && CU) {
    badge.textContent = '\u{1F464} ' + CU.name;
    badge.title = 'Click to logout';
    badge.style.display = 'inline';
    badge.onclick = function(){ if(confirm('Log out?')) logout(); };
  }
}

// ═══════════════════════════════════════
// DATA LOADING
// ═══════════════════════════════════════
function load() {
  document.getElementById('mc').innerHTML = '<div class="ld"><div class="sp"></div></div>';
  aG('getAll').then(function(d) {
    D = d.contacts || [];
    V = d.visits || [];
    R = (d.reminders || []).filter(function(r){ return r.status === 'active'; });
    JR = d.referrals || [];
    ok = true;
    return aG('getReferrals');
  }).then(function(refs) {
    JR = refs || JR;
    ren();
  }).catch(function(e) {
    console.log('Load error:', e);
    if (ok) { ren(); return; }
    document.getElementById('mc').innerHTML = '<div class="ld"><div style="color:var(--r)">Failed to connect</div><button class="bs" style="max-width:200px;margin:16px auto" onclick="load()">Retry</button></div>';
  });
}

// ═══════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════
function ds(d) { if(!d) return 999; return Math.floor((new Date()-new Date(d))/864e5); }
function uc(d) { return d<=14?'var(--gn)':d<=30?'var(--b)':d<=60?'var(--o)':'var(--r)'; }
function uh(d) { return d<=14?'#33cc66':d<=30?'#22aee4':d<=60?'#ff9933':'#ff3366'; }
function fd(d) { if(!d) return '\u2014'; return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function gR(i) { return R.filter(function(r){ return +r.contactId===+i; }); }
function tmOpts(sel) { return TM.map(function(t){ return '<option'+(CU&&CU.name===t?' selected':'')+'>'+t+'</option>'; }).join(''); }

function sT(t, el) {
  tb = t;
  document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('on'); });
  el.classList.add('on');
  ren();
}

function ren() {
  if (!ok) return;
  rS();
  var mc = document.getElementById('mc');
  if (tb==='d') rD(mc);
  else if (tb==='m') rM(mc);

function gF() {

    '<div class="fg"><label>Business</label><input id="eBz" value="'+(c.business||'')+'"></div>' +
    '<div class="fr"><div class="fg"><label>Phone</label><input id="ePh" value="'+(c.phone||'')+'"></div><div class="fg"><label>Email</label><input id="eEm" value="'+(c.email||'')+'"></div></div>' +
    '<div class="fr"><div class="fg"><label>Territory</label><select id="eTr">'+TR.slice(1).map(function(t){return '<option'+(c.territory===t?' selected':'')+'>'+t+'</option>';}).join('')+'</select></div><div class="fg"><label>Type</label><select id="eTy">'+TY.map(function(t){return '<option'+(c.type===t?' selected':'')+'>'+t+'</option>';}).join('')+'</select></div></div>' +
    '<div class="fr"><div class="fg"><label>Handler</label><select id="eBy">'+TM.map(function(t){return '<option'+(c.handler===t?' selected':'')+'>'+t+'</option>';}).join('')+'</select></div><div class="fg"><label>Score</label><select id="eSc">'+SC.map(function(s,i){return '<option value="'+i+'"'+(+c.score===i?' selected':'')+'>'+s.e+' '+s.l+'</option>';}).join('')+'</select></div></div>' +
    '<div class="fr"><div class="fg"><label>Tier</label><select id="eTi">'+TI.map(function(t){return '<option'+(c.tier===t?' selected':'')+'>'+t+'</option>';}).join('')+'</select></div><div class="fg"><label>Referrals</label><input id="eRef" type="number" value="'+(c.referrals||0)+'"></div></div>' +
    '<button class="bs" onclick="saveEdit('+c.id+')">Save Changes</button><button class="bc" onclick="document.getElementById(\'editArea\').innerHTML=\'\'">Cancel</button></div>';
}

function saveEdit(id) {
  tt('Saving...','ok');
  aP({action:'updateContact',contact:{id:id,name:document.getElementById('eNm').value,role:document.getElementById('eRl').value,business:document.getElementById('eBz').value,phone:document.getElementById('ePh').value,email:document.getElementById('eEm').value,territory:document.getElementById('eTr').value,type:document.getElementById('eTy').value,handler:document.getElementById('eBy').value,score:+document.getElementById('eSc').value,tier:document.getElementById('eTi').value,referrals:+document.getElementById('eRef').value}}).then(function(){
    tt('Updated!','ok'); cP(); load();
  }).catch(function(){tt('Error','er');});
}

function delContact(id) {
  tt('Deleting...','ok');
  aP({action:'deleteContact',id:id}).then(function(){
    tt('Deleted','ok'); cP(); load();
  }).catch(function(){tt('Error','er');});
}

// ═══════════════════════════════════════
// LOG IT (New Contact + Visit)
// ═══════════════════════════════════════
var lMI = null;

function openLog() {
  document.getElementById('lO').style.display = 'flex';
  lMI = null;
  rL();
}
function cL() {
  document.getElementById('lO').style.display = 'none';
}

function rL() {
  var lTd = new Date().toISOString().split('T')[0];
  document.getElementById('lB').innerHTML =
    '<div style="text-align:center;margin-bottom:4px;color:var(--g);font-size:13px">Type your notes or fill the form</div>' +
    '<div class="fg"><label>Notes / Transcript</label><textarea id="lN" rows="3" placeholder="Type visit notes..."></textarea></div>' +
    '<div class="fg"><label>Contact Name</label><input id="lNm" placeholder="e.g. Steve" oninput="chk()"></div>' +
    '<div id="mA"></div>' +
    '<div class="fg"><label>Business</label><input id="lBz" placeholder="e.g. Money Saver"></div>' +
    '<div class="fr"><div class="fg"><label>Role</label><input id="lRl" placeholder="e.g. Manager"></div><div class="fg"><label>Phone</label><input id="lPh" placeholder="360-555-0000"></div></div>' +
    '<div class="fr"><div class="fg"><label>Email</label><input id="lEm" placeholder="email"></div><div class="fg"><label>Territory</label><select id="lTr">'+TR.slice(1).map(function(t){return '<option>'+t+'</option>';}).join('')+'</select></div></div>' +
    '<div class="fr"><div class="fg"><label>Type</label><select id="lTy">'+TY.map(function(t){return '<option>'+t+'</option>';}).join('')+'</select></div><div class="fg"><label>Score</label><select id="lSc"><option value="3">New</option><option value="2">Cool</option><option value="1">Warm</option><option value="0">Hot</option></select></div></div>' +
    '<div class="fr"><div class="fg"><label>Visit Date</label><input id="lDt" type="date" value="'+lTd+'"></div><div class="fg"><label>By</label><select id="lBy">'+tmOpts()+'</select></div><div class="fg"><label>Tier</label><select id="lTi">'+TI.map(function(t){return '<option>'+t+'</option>';}).join('')+'</select></div></div>' +
    '<div class="fg"><label>Reminder</label><input id="lRm" placeholder="Optional"></div>' +
    '<button class="bs" id="lSB" onclick="sL()">Save New Contact + Visit</button>' +
    '<button class="bc" onclick="cL()">Cancel</button>';
}

function chk() {
  var nm = (document.getElementById('lNm').value||'').toLowerCase().trim();
  var bz = (document.getElementById('lBz').value||'').toLowerCase().trim();
  var a = document.getElementById('mA');
  if (nm.length<2 && bz.length<2) { a.innerHTML=''; lMI=null; document.getElementById('lSB').textContent='Save New Contact + Visit'; return; }
  var mt = D.filter(function(c){ var cn=(c.name||'').toLowerCase(),cb=(c.business||'').toLowerCase(); return (nm.length>=2&&cn.indexOf(nm)>=0)||(bz.length>=2&&cb.indexOf(bz)>=0); });
  if (!mt.length) { a.innerHTML=''; lMI=null; document.getElementById('lSB').textContent='Save New Contact + Visit'; return; }
  var h = '<div style="font-size:11px;color:var(--b);margin-bottom:6px">Existing match \u2014 tap to log visit:</div>';
  mt.slice(0,5).forEach(function(c){
    h += '<div class="mc'+(lMI===c.id?' sl':'')+'" onclick="sM('+c.id+')"><div style="font-weight:700">'+c.name+'</div><div style="color:var(--g);font-size:11px">'+(c.role||'')+' at '+(c.business||'')+' \u00B7 '+(c.territory||'')+'</div></div>';
  });
  a.innerHTML = h;
}

function sM(id) { lMI = lMI===id ? null : id; document.getElementById('lSB').textContent = lMI ? 'Save Visit to Existing' : 'Save New Contact + Visit'; chk(); }

function sL() {
  var n = document.getElementById('lN').value;
  var rm = document.getElementById('lRm').value;
  var by = document.getElementById('lBy').value;
  var dt = document.getElementById('lDt') ? document.getElementById('lDt').value : null;

  if (lMI) {
    if(!n){tt('Add notes','er');return;}
    tt('Saving...','ok');
    aP({action:'addVisit',visit:{contactId:lMI,handler:by,date:dt||new Date().toISOString().split('T')[0],notes:n}}).then(function(){
      if(rm) return aP({action:'addReminder',reminder:{contactId:lMI,text:rm}});
    }).then(function(){
      tt('Visit saved!','ok'); cL(); load();
    }).catch(function(){tt('Error','er');});
  } else {
    var nm = document.getElementById('lNm').value;
    if(!nm){tt('Enter name','er');return;}
    var c = {name:nm,business:document.getElementById('lBz').value,role:document.getElementById('lRl').value,phone:document.getElementById('lPh').value,email:document.getElementById('lEm').value,territory:document.getElementById('lTr').value,type:document.getElementById('lTy').value,score:+document.getElementById('lSc').value,handler:by,referrals:0,notes:'',tier:document.getElementById('lTi').value};
    tt('Saving...','ok');
    aP({action:'addContact',contact:c}).then(function(r){
      var promises = [];
      if(n&&r.id) promises.push(aP({action:'addVisit',visit:{contactId:r.id,handler:by,date:dt||new Date().toISOString().split('T')[0],notes:n}}));
      if(rm&&r.id) promises.push(aP({action:'addReminder',reminder:{contactId:r.id,text:rm}}));
      return Promise.all(promises);
    }).then(function(){
      tt('Saved!','ok'); cL(); load();
    }).catch(function(){tt('Error','er');});
  }
}

// ═══════════════════════════════════════
// STARTUP
// ═══════════════════════════════════════
initApp();
</script>
