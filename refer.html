<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Refer a Move | Neon Giant Moving</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
  margin: 0;
  background: linear-gradient(135deg, #1a0033 0%, #4a0080 50%, #ff0080 100%);
  min-height: 100vh;
  color: #fff;
  padding: 16px 12px;
}
.card {
  max-width: 540px;
  margin: 20px auto;
  background: #0a0a0a;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 16px 48px rgba(0,0,0,0.5);
}
.hdr {
  background: linear-gradient(135deg, #1a0033 0%, #4a0080 50%, #ff0080 100%);
  padding: 24px;
  text-align: center;
}
.hdr img { width: 64px; height: 64px; border-radius: 12px; background: #000; padding: 4px; object-fit: contain; }
.hdr h1 { margin: 12px 0 4px; font-size: 22px; font-weight: 800; letter-spacing: 0.5px; }
.hdr .sub { font-size: 11px; opacity: 0.85; letter-spacing: 2px; text-transform: uppercase; }
.hdr .greet { margin-top: 14px; font-size: 16px; font-weight: 500; }
.body { padding: 22px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; letter-spacing: 1px; color: #ff0080; text-transform: uppercase; margin-bottom: 5px; font-weight: 600; }
.field input, .field select, .field textarea {
  width: 100%;
  padding: 12px 14px;
  background: #1a1a1a;
  color: #fff;
  border: 1px solid #333;
  border-radius: 8px;
  font-size: 15px;
  font-family: inherit;
  -webkit-appearance: none;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none;
  border-color: #ff0080;
  box-shadow: 0 0 0 2px rgba(255,0,128,0.3);
}
.field textarea { min-height: 80px; resize: vertical; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 460px) { .row { grid-template-columns: 1fr; } }
.reward {
  background: linear-gradient(135deg, #4a0080, #ff0080);
  padding: 14px;
  border-radius: 10px;
  margin: 0 0 18px;
  text-align: center;
  font-size: 13px;
  line-height: 1.5;
}
.reward b { font-size: 18px; display: block; margin-bottom: 4px; }
.submit {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, #ff0080, #ff8000);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
  font-family: inherit;
}
.submit:disabled { opacity: 0.5; cursor: not-allowed; }
.err { color: #ff6b6b; font-size: 13px; padding: 10px; background: rgba(255,107,107,0.1); border-radius: 6px; margin-top: 10px; border: 1px solid rgba(255,107,107,0.3); }
.thank-you { text-align: center; padding: 30px 10px; }
.thank-you .check { font-size: 60px; margin-bottom: 14px; }
.thank-you h2 { font-size: 22px; margin: 0 0 8px; }
.thank-you p { color: #aaa; font-size: 14px; line-height: 1.6; margin: 10px 0; }
.thank-you b { color: #fff; }
.footer { text-align: center; padding: 14px; color: rgba(255,255,255,0.6); font-size: 11px; }
</style>
</head>
<body>
<div class="card">
  <div class="hdr">
    <img src="logo.jpg" alt="Neon Giant" onerror="this.style.display='none'">
    <div class="sub">Refer a Move</div>
    <h1>Neon Giant Moving &amp; Junk Removal</h1>
    <div class="greet" id="greet">Loading&hellip;</div>
  </div>
  <div class="body" id="body">
    <div class="reward">
      <b>$50 / $50</b>
      $50 gift card to you after the move completes &middot; $50 off the customer's bill
    </div>
    <form id="referForm" onsubmit="return submitForm(event)">
      <div class="field">
        <label>Customer name *</label>
        <input id="fName" required autocomplete="name">
      </div>
      <div class="row">
        <div class="field"><label>Phone *</label><input id="fPhone" required type="tel" autocomplete="tel"></div>
        <div class="field"><label>Email</label><input id="fEmail" type="email" autocomplete="email"></div>
      </div>
      <div class="field"><label>From address</label><input id="fFrom" placeholder="123 Main St, Bellingham"></div>
      <div class="field"><label>To address</label><input id="fTo" placeholder="456 Pine Ave, Mt Vernon"></div>
      <div class="row">
        <div class="field"><label>Target move date</label><input id="fDate" type="date"></div>
        <div class="field">
          <label>Move size</label>
          <select id="fSize">
            <option value="">&mdash; select &mdash;</option>
            <option>Studio</option>
            <option>1 BR</option>
            <option>2 BR</option>
            <option>3 BR</option>
            <option>4 BR+</option>
            <option>Junk removal</option>
            <option>Packing only</option>
          </select>
        </div>
      </div>
      <div class="field"><label>Anything else?</label><textarea id="fNotes" placeholder="Stairs, piano, timing notes&hellip;"></textarea></div>
      <button class="submit" type="submit" id="submitBtn">Send referral &rarr;</button>
      <div id="err" class="err" style="display:none"></div>
    </form>
  </div>
</div>
<div class="footer">Neon Giant Moving &amp; Junk Removal &middot; Skagit Valley, WA</div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbxh1ec9k_uwCmgqRsBeMEtZ9OdjxsINY-ngzgPGBoyD9pe4-Df2YsEQWrYwRYkP7GW4jw/exec';
let realtor = null;

function getSlug(){
  const p = new URLSearchParams(location.search);
  return p.get('r') || '';
}

async function api(action, payload){
  payload = payload || {};
  payload.action = action;
  const r = await fetch(API, {
    method: 'POST',
    body: JSON.stringify(payload),
    headers: { 'Content-Type': 'text/plain' }
  });
  return r.json();
}

async function loadRealtor(){
  const slug = getSlug();
  if(!slug){
    document.getElementById('greet').textContent = 'Send us a referral';
    return;
  }
  try {
    const r = await api('getRealtorBySlug', { slug });
    if(r.ok){
      realtor = r.realtor;
      document.getElementById('greet').textContent = 'Hey ' + realtor.firstName + ' — send us a referral';
    } else {
      document.getElementById('greet').textContent = 'Send us a referral';
    }
  } catch(e){
    document.getElementById('greet').textContent = 'Send us a referral';
  }
}

async function submitForm(e){
  e.preventDefault();
  const err = document.getElementById('err');
  err.style.display = 'none';
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Sending…';
  try {
    const customer = {
      name: document.getElementById('fName').value.trim(),
      phone: document.getElementById('fPhone').value.trim(),
      email: document.getElementById('fEmail').value.trim(),
      fromAddress: document.getElementById('fFrom').value.trim(),
      toAddress: document.getElementById('fTo').value.trim(),
      moveDate: document.getElementById('fDate').value,
      moveSize: document.getElementById('fSize').value,
      notes: document.getElementById('fNotes').value.trim()
    };
    const r = await api('submitReferralLead', { realtorId: realtor ? realtor.id : 0, customer });
    if(r.ok){
      document.getElementById('body').innerHTML =
        '<div class="thank-you">' +
          '<div class="check">✅</div>' +
          '<h2>Got it' + (realtor ? ', ' + realtor.firstName : '') + '!</h2>' +
          '<p>We received your referral for <b>' + customer.name + '</b>. The Neon Giant team will reach out within 24 hours.</p>' +
          (realtor ? '<p>Your <b>$50 gift card</b> will be sent at the end of the month after the move completes.</p>' : '<p>A team member will reach out within 24 hours.</p>') +
          '<button class="submit" onclick="location.reload()" style="margin-top:20px;max-width:280px">Send another referral</button>' +
        '</div>';
    } else {
      err.textContent = r.error || 'Something went wrong';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Send referral →';
    }
  } catch(ex){
    err.textContent = 'Network error: ' + ex.message;
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Send referral →';
  }
  return false;
}

loadRealtor();
</script>
</body>
</html>
