<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>API Key Test</title>
<style>body{background:#0a0a0f;color:#fff;font-family:system-ui;padding:20px}button{background:#e33b93;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-size:16px;margin:10px 0;cursor:pointer}pre{background:#111;padding:12px;border-radius:8px;font-size:12px;white-space:pre-wrap;margin:10px 0;max-height:300px;overflow:auto}input{width:100%;background:#111;border:1px solid #333;color:#fff;padding:10px;border-radius:6px;font-size:14px;margin:6px 0;font-family:monospace}</style>
</head>
<body>
<h2 style="color:#e33b93">API Key Tester</h2>
<p>Paste your API key below and test it:</p>
<input id="key" placeholder="sk-ant-api03-..." value="">
<br>
<button onclick="testKey()">Test This Key</button>
<pre id="log">Paste your key above and click test...</pre>
<script>
async function testKey(){
  const key=document.getElementById('key').value.trim();
  const log=document.getElementById('log');
  if(!key){log.textContent='Enter a key first';return}
  log.textContent='Testing key: '+key.substring(0,20)+'...\n\n';
  log.textContent+='Key length: '+key.length+' characters\n';
  log.textContent+='Starts with sk-ant: '+(key.startsWith('sk-ant')?'YES':'NO')+'\n\n';
  log.textContent+='Sending request to Claude API...\n';
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':key,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:100,
        messages:[{role:'user',content:'Say hello in 5 words'}]
      })
    });
    log.textContent+='Status: '+r.status+'\n';
    const d=await r.json();
    log.textContent+='Response: '+JSON.stringify(d,null,2)+'\n';
    if(d.content){log.textContent+='\n✅ KEY WORKS! Claude said: '+d.content[0].text}
    if(d.error){log.textContent+='\n❌ Error: '+d.error.message}
  }catch(e){
    log.textContent+='❌ Failed: '+e.message+'\n';
  }
}
</script>
</body>
</html>
