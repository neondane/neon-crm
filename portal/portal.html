<style>
  :root { --neon-cyan:#22BFE7; --neon-cyan-2:#00E5FF; --neon-pink:#FF1493; --neon-pink-2:#FF4FB6; --neon-yellow:#FFD23F; --neon-green:#3CFFA2; --bg-0:#050008; --bg-1:#0d0014; --text:#f4f4ff; --muted:#8a8aa3; }
  *,*::before,*::after { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { font-family:'Space Grotesk',-apple-system,sans-serif; background:var(--bg-0); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; overflow-x:hidden; position:relative; }
  .bg-grid { position:fixed; inset:0; z-index:0; pointer-events:none; background: radial-gradient(ellipse 90% 60% at 50% 100%, rgba(255,20,147,0.30), transparent 60%), radial-gradient(ellipse 80% 60% at 50% 0%, rgba(34,191,231,0.22), transparent 65%), linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 60%, var(--bg-0) 100%); }

  .hero .brand { font-family:'Audiowide',cursive; font-size:12px; letter-spacing:5px; text-transform:uppercase; color:var(--neon-cyan); text-shadow:0 0 8px rgba(34,191,231,0.55), 0 0 16px rgba(34,191,231,0.3); margin-bottom:2px; }

  .tier .dot { width:6px; height:6px; border-radius:50%; background:var(--neon-pink); box-shadow:0 0 8px var(--neon-pink); animation:pulse-dot 1.4s ease-in-out infinite; }

  .h { font-family:'Audiowide',cursive; font-size:13px; letter-spacing:3px; text-transform:uppercase; color:var(--neon-cyan); text-shadow:0 0 8px rgba(34,191,231,0.4); margin:22px 0 10px; }
  .cta { display:block; width:100%; padding:16px; background:linear-gradient(135deg, var(--neon-pink) 0%, #ff5da7 100%); color:#fff; border:0; border-radius:12px; font-family:'Audiowide',cursive; font-size:15px; letter-spacing:3px; text-transform:uppercase; cursor:pointer; text-decoration:none; text-align:center; margin-top:4px; box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset, 0 0 22px rgba(255,20,147,0.55), 0 8px 26px rgba(255,20,147,0.35); animation:cta-pulse 2.6s ease-in-out infinite; transition:transform 0.06s; }

  .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(120px); background:linear-gradient(135deg, var(--neon-cyan), var(--neon-pink)); color:#fff; padding:11px 22px; border-radius:999px; font-family:'Audiowide',cursive; font-size:12px; letter-spacing:1.5px; box-shadow:0 12px 32px rgba(255,20,147,0.5), 0 0 22px rgba(34,191,231,0.4); z-index:100; transition:transform 0.3s cubic-bezier(.16,1.15,.3,1); }
  .toast.show { transform:translateX(-50%) translateY(0); }

  /* ============ SOCIAL CTA ============ */

  .social-section{margin-top:22px;padding:22px 18px;border-radius:16px;position:relative;overflow:hidden;text-align:center;background:linear-gradient(135deg,rgba(34,191,231,0.10) 0%,rgba(255,20,147,0.10) 100%),rgba(13,0,20,0.7);border:1px solid rgba(34,191,231,0.35);animation:social-pulse 5s ease-in-out infinite}

</style>

<script>
'use strict';
async function api(action, payload) {
  const resp = await fetch('/api/' + encodeURIComponent(action), { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload||{}) });
  if (!resp.ok) {
    let body = null;
    try { body = await resp.json(); } catch(_) {}
    const msg = (body && body.error) || ('HTTP ' + resp.status);
    throw new Error(msg);
  }
  return resp.json();
}
function getSlug() { return new URLSearchParams(location.search).get('r') || ''; }
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}
function timeAgo(iso) {
  if (!iso) return '';
  var t = new Date(iso).getTime();
  if (isNaN(t)) return '';
  var mins = Math.floor((Date.now() - t) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  var hrs = Math.floor(mins/60);
  if (hrs < 24) return hrs + 'h ago';
  var days = Math.floor(hrs/24);
  if (days < 30) return days + 'd ago';
  var months = Math.floor(days/30);
  if (months < 12) return months + 'mo ago';
  return Math.floor(months/12) + 'y ago';
}
function fmtDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 1900);
}
var STATUS = {
  'new':       { color:'var(--neon-cyan)',   label:'NEW' },
  'contacted': { color:'var(--neon-pink)',   label:'CONTACTED' },
  'booked':    { color:'var(--neon-green)',  label:'BOOKED' },
  'completed': { color:'var(--neon-yellow)', label:'COMPLETED' }
};
function statusBadge(s) {
  var key = String(s||'new').toLowerCase();
  var c = STATUS[key] || STATUS['new'];
  return '<span class="badge" style="background:rgba(255,255,255,0.06);color:' + c.color + ';border:1px solid ' + c.color + ';text-shadow:0 0 6px ' + c.color + '">' + c.label + '</span>';
}
function tierFor(totals) {
  var t = (totals && totals.total) || 0;
  if (t >= 10) return { label:'DIAMOND PARTNER', color:'var(--neon-cyan)' };
  if (t >= 5)  return { label:'GOLD PARTNER',    color:'var(--neon-yellow)' };
  if (t >= 2)  return { label:'SILVER PARTNER',  color:'#cfd1e0' };
  if (t >= 1)  return { label:'BRONZE PARTNER',  color:'#d18a5b' };
  return                 { label:'NEW PARTNER',     color:'var(--neon-pink)' };
}
function countUp(el, target, prefix) {
  prefix = prefix || '';
  target = Number(target) || 0;
  if (target === 0) { el.textContent = prefix + '0'; return; }
  var start = performance.now();
  var dur = 900;
  function tick(now) {
    var p = Math.min(1, (now - start) / dur);
    p = 1 - Math.pow(1 - p, 3);
    el.textContent = prefix + Math.round(target * p);
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function renderError(msg) {
  document.getElementById('greet').textContent = 'Hmm...';
  document.getElementById('sub').textContent = '';
  document.getElementById('body').innerHTML = '<div class="err">' + escapeHtml(msg) + '</div>';
}
function render(view) {
  var r      = view.realtor || {};
  var leads  = Array.isArray(view.leads) ? view.leads : [];
  var totals = view.totals || {};
  var referrals = totals.total != null ? totals.total : leads.length;
  var pending   = totals.earnedPending != null ? totals.earnedPending : 0;
  var paid      = totals.earnedPaid != null  ? totals.earnedPaid  : 0;
  var firstName = (r.firstName || (String(r.name||'').split(' ')[0]) || 'partner');
  var tier = tierFor(totals);
  document.getElementById('greet').textContent = firstName.toUpperCase();
  document.getElementById('sub').innerHTML =
    'Your referral dashboard ' +
    '<span class="tier" style="margin-left:8px;border-color:' + tier.color + ';color:' + tier.color + ';text-shadow:0 0 8px ' + tier.color + '">' +
      '<span class="dot" style="background:' + tier.color + ';box-shadow:0 0 8px ' + tier.color + '"></span>' + tier.label +
    '</span>';
  var justParam = new URLSearchParams(location.search).get('just') || '';
  var justLeadId = '';
  if (justParam && justParam !== '1') justLeadId = String(justParam);
  else if (justParam === '1' && leads.length) {
    var newest = leads[0];
    for (var i = 1; i < leads.length; i++) {
      if (new Date(leads[i].submittedAt) > new Date(newest.submittedAt)) newest = leads[i];
    }
    justLeadId = String(newest.id || '');
  }
  var slug = getSlug();
  var referUrl = '/refer?r=' + encodeURIComponent(slug);
  var portalLink = location.origin + '/?r=' + encodeURIComponent(slug);
  var h = '';
  if (justParam) {
    h += '<div class="just-banner">Referral submitted - see it below</div>';
  }
  h += '<div class="stats">';
  h += '<div class="stat referrals"><div class="num" data-target="' + referrals + '">0</div><div class="lbl">Referrals</div></div>';
  h += '<div class="stat pending"><div class="num" data-target="' + pending + '" data-prefix="$">$0</div><div class="lbl">Pending</div></div>';
  h += '<div class="stat paid"><div class="num" data-target="' + paid + '" data-prefix="$">$0</div><div class="lbl">Paid</div></div>';
  h += '</div>';
  h += '<a class="cta" href="' + referUrl + '">Refer Someone New &nbsp;&rarr;</a>';
  h += '<div class="h">Your Pipeline</div>';
  if (!leads.length) {
    h += '<div class="empty"><div class="icon">.</div>No referrals yet. Share your link below to send your first one.</div>';
  } else {
    leads.forEach(function(l){
      var status = String(l.status || 'new').toLowerCase();
      var isJust = justLeadId && String(l.id) === justLeadId;
      h += '<div class="ref' + (isJust ? ' just-submitted' : '') + '" data-lead-id="' + escapeHtml(String(l.id||'')) + '">';
      h += '<div style="flex:1;min-width:0">';
      h += '<div class="name">' + escapeHtml(l.customerName || 'Unknown') + '</div>';
      var meta = [];
      if (l.moveSize) meta.push(escapeHtml(l.moveSize));
      if (l.moveDate) meta.push('Target: ' + escapeHtml(fmtDate(l.moveDate) || l.moveDate));
      if (meta.length) h += '<div class="meta">' + meta.join(' &middot; ') + '</div>';
      h += '</div>';
      h += '<div class="right">' + statusBadge(status) + '<span class="when">' + escapeHtml(timeAgo(l.submittedAt)) + '</span></div>';
      h += '</div>';
    });
  }
  h += '<div class="linkcard">';
  h += '<h3>Your referral link</h3>';
  h += '<div class="url" id="urlBox">' + escapeHtml(portalLink) + '</div>';
  h += '<button onclick="copyLink()">Copy link</button>';
  h += '<button onclick="shareLink()">Share</button>';
  h += '</div>';
  h += '<details class="how"><summary>How it works</summary><div class="howbody">';
  h += '<div class="step"><b>1.</b> Share your link with anyone moving in the Skagit Valley.</div>';
  h += '<div class="step"><b>2.</b> They submit their info on your page. They get <b>$50 off</b> their move.</div>';
  h += '<div class="step"><b>3.</b> Once their move completes (moves over $1,000), you get a <b>$50 gift card</b> at month end.</div>';
  h += '<div class="step" style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(34,191,231,0.15);color:#888">';
  h += 'Status legend: <b style="color:var(--neon-cyan)">New</b> just submitted &middot; ';
  h += '<b style="color:var(--neon-pink)">Contacted</b> we\'ve reached out &middot; ';
  h += '<b style="color:var(--neon-green)">Booked</b> on the schedule &middot; ';
  h += '<b style="color:var(--neon-yellow)">Completed</b> gift card coming.</div>';
  h += '</div></details>';
  document.getElementById('body').innerHTML = h;
  document.querySelectorAll('.stat .num').forEach(function(el){
    var t = Number(el.getAttribute('data-target')) || 0;
    var p = el.getAttribute('data-prefix') || '';
    countUp(el, t, p);
  });
  if (justLeadId) {
    setTimeout(function(){
      var row = document.querySelector('.ref.just-submitted');
      if (row && row.scrollIntoView) row.scrollIntoView({ behavior:'smooth', block:'center' });
      if (history.replaceState) {
        var clean = location.pathname + (getSlug() ? '?r=' + encodeURIComponent(getSlug()) : '');
        history.replaceState({}, '', clean);
      }
    }, 350);
  }
}
async function load() {
  var slug = getSlug();
  if (!slug) {
    renderError('Your portal link is missing the realtor ID. Please use the link your Neon Giant contact sent you.');
    return;
  }
  var view;
  try { view = await api('getRealtorPortalView', { slug: slug }); }
  catch (err) {
    console.error('load failed', err);
    renderError("We couldn't load your dashboard right now. Please try again, or call us at (360) 588-4700.");
    return;
  }
  if (!view || !view.ok) {
    renderError((view && view.error) || "This referral link isn't recognized. Double-check the URL, or reach out to your Neon Giant contact.");
    return;
  }
  render(view);
}
window.copyLink = async function() {
  var box = document.getElementById('urlBox');
  var url = box ? box.textContent : '';
  try { await navigator.clipboard.writeText(url); showToast('Link copied!'); }
  catch (e) {
    var tmp = document.createElement('input');
    tmp.value = url; document.body.appendChild(tmp); tmp.select();
    try { document.execCommand('copy'); showToast('Link copied!'); }
    catch (_) { showToast('Long-press to copy.'); }
    document.body.removeChild(tmp);
  }
};
window.shareLink = async function() {
  var box = document.getElementById('urlBox');
  var url = box ? box.textContent : '';
  var text = "Here's my referral page for Neon Giant Moving. Use it to get $50 off your move:\n" + url;
  if (navigator.share) {
    try { await navigator.share({ title:'Neon Giant Moving Referral', text:text, url:url }); }
    catch (_) {}
  } else {
    try { await navigator.clipboard.writeText(text); showToast('Share message copied!'); }
    catch (_) { showToast('Long-press to copy.'); }
  }
};
load();
</script>
