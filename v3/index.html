<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon CRM v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Audiowide&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --pink:#FF1493; --pink2:#FF4FB6; --cyan:#22BFE7; --cyan2:#00E5FF;
  --grad:linear-gradient(110deg,#FF1493,#FF4FB6 38%,#22BFE7 78%,#00E5FF);
  --radius:14px; --radius-sm:10px; --shadow:0 10px 30px rgba(20,30,60,.10);
  --font:'Outfit',system-ui,-apple-system,Arial,sans-serif;
  --display:'Audiowide','Outfit',sans-serif;
}
:root[data-theme="light"]{
  --bg:#eef1f8; --bg2:#f7f9fd; --surface:#ffffff; --surface2:#f3f6fc;
  --text:#101830; --text-muted:#5f6b85; --border:rgba(20,30,60,.10);
  --row-hover:rgba(34,191,231,.08); --row-active:rgba(255,20,147,.08); --nav:#0e1830;
}
:root[data-theme="dark"]{
  --bg:#070b16; --bg2:#0b1020; --surface:#101a30; --surface2:#152138;
  --text:#eef2ff; --text-muted:#9aa6c4; --border:rgba(140,170,230,.14);
  --row-hover:rgba(34,191,231,.10); --row-active:rgba(255,20,147,.12); --nav:#070b16;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex:none;z-index:5}
.brandwrap{display:flex;align-items:center;gap:14px}
.logo{width:58px;height:58px;flex:none;border-radius:14px;padding:5px;background:var(--surface2);border:1px solid var(--border);filter:drop-shadow(0 0 7px rgba(255,20,147,.5)) drop-shadow(0 0 16px rgba(34,191,231,.35))}
.brand{font-family:var(--display);font-weight:400;letter-spacing:1.5px;font-size:23px;text-transform:uppercase;line-height:1.05}
.brand .n{color:var(--pink)}.brand .g{color:var(--cyan)}
.brand .sub{display:block;font-family:var(--font);font-size:9.5px;letter-spacing:3.5px;color:var(--text-muted);font-weight:700;margin-top:5px}
.search{flex:1;max-width:520px;margin:0 auto}
.search input{width:100%;height:40px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);color:var(--text);padding:0 18px;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,191,231,.18)}
.search input::placeholder{color:var(--text-muted)}
.toggle{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:18px;cursor:pointer;display:grid;place-items:center;transition:background .15s}
.topicons{display:flex;align-items:center;gap:7px;flex:none}
.ticon{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:17px;cursor:pointer;display:grid;place-items:center;transition:background .15s}
.ticon:hover{background:var(--row-hover)}
.ticon .gi{width:21px;height:21px}.paedit .gi{width:17px;height:17px}
.tbadge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--pink);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid var(--surface);font-family:var(--font)}
.tdrop{position:fixed;z-index:9998;background:var(--surface);border:1px solid var(--border);border-radius:13px;box-shadow:0 16px 40px rgba(0,0,0,.28);padding:8px;min-width:272px}
.tdh{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);font-weight:700;padding:6px 10px 8px}
.tdrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;font-family:inherit;font-size:13px;color:var(--text);background:none;border:none;padding:10px 11px;border-radius:9px;cursor:pointer}
.tdrow:hover{background:var(--surface2)}
.tdrow .ti{font-size:16px;flex:none;display:inline-flex}
.tdrow .ti .gi{width:18px;height:18px;color:var(--pink)}
.tdrow b{color:var(--pink)}
.tdhrow{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 2px 10px}
.tdclear{font-family:inherit;font-size:11px;font-weight:700;color:var(--cyan);background:none;border:none;cursor:pointer;padding:6px 9px;border-radius:7px}
.tdclear:hover{background:var(--surface2)}
.tdrow2{display:flex;align-items:center}
.tdrow2 .tdrow{flex:1}
.tddis{flex:none;width:26px;height:26px;border:none;background:none;color:var(--text-muted);cursor:pointer;border-radius:7px;font-size:11px;margin-right:4px}
.tddis:hover{background:var(--surface2);color:var(--pink)}
@media(max-width:680px){.topicons{display:none}}
.toggle:hover{background:var(--row-hover)}
.shell{flex:1;display:flex;min-height:0}
.sidebar{width:212px;flex:none;background:var(--surface);border-right:1px solid var(--border);padding:14px 10px;overflow-y:auto}
.navitem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--text-muted);font-weight:600;font-size:14px;cursor:pointer;margin-bottom:3px;transition:background .12s,color .12s}
.navitem .ic{width:22px;height:22px;flex:none;display:grid;place-items:center;color:inherit}
.navitem .ic svg{width:21px;height:21px;display:block}
.navitem:hover{background:var(--row-hover);color:var(--text)}
.navitem.active{background:linear-gradient(90deg,rgba(255,20,147,.13),rgba(34,191,231,.10));color:var(--text);font-weight:700;box-shadow:inset 3px 0 0 var(--pink)}
.navitem.active .ic{color:var(--pink)}
.view{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
/* contacts two-pane */
.cwrap{flex:1;display:flex;min-height:0}
.list{width:360px;flex:none;border-right:1px solid var(--border);background:var(--bg2);overflow-y:auto}
.count{padding:10px 18px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);font-weight:700;position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);z-index:1}
.row{display:flex;align-items:center;gap:12px;padding:11px 18px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .12s}
.row:hover{background:var(--row-hover)}
.row.active{background:var(--row-active);box-shadow:inset 3px 0 0 var(--pink)}
.avatar{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;background:var(--grad);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.row .info{min-width:0;flex:1}
.row .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .bz{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:6px;flex:none;color:var(--cyan);background:rgba(34,191,231,.12);border:1px solid rgba(34,191,231,.35)}
.tag.realtor{color:var(--pink);background:rgba(255,20,147,.10);border-color:rgba(255,20,147,.35)}
.detail{flex:1;overflow-y:auto}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-top:4px}
.ccard{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,box-shadow .15s,border-color .15s}
.ccard:hover{transform:translateY(-2px);border-color:var(--cyan);box-shadow:0 12px 28px rgba(20,30,60,.12)}
.ccard .info{min-width:0;flex:1}
.ccard .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard .bz{font-size:12.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pback{padding:14px 30px 0}
.clist{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.crow2{display:flex;align-items:center;gap:15px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 20px;cursor:pointer;box-shadow:var(--shadow);transition:transform .1s,border-color .15s,box-shadow .15s}
.crow2:hover{border-color:var(--cyan);box-shadow:0 10px 26px rgba(20,30,60,.10);transform:translateY(-1px)}
.crow2 .av{width:50px;height:50px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;background:var(--grad)}
.crow2 .av img{width:100%;height:100%;object-fit:cover}
.crow2 .meta{flex:1;min-width:0}
.crow2 .nm{font-weight:700;font-size:16px;display:flex;align-items:center;gap:9px}
.crow2 .sub{font-size:13px;color:var(--text-muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow2 .right{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px;min-width:46px}
.crow2 .days{font-family:var(--display);font-size:17px;color:var(--cyan)}
.crow2 .days.stale{color:var(--pink)}
.crow2 .cnt{font-size:11px;font-weight:700;background:rgba(255,20,147,.10);color:var(--pink);border:1px solid rgba(255,20,147,.3);border-radius:999px;padding:1px 8px;min-width:22px;text-align:center}
.temp{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:2px 8px;border-radius:5px}
.temp.hot{color:var(--pink);background:rgba(255,20,147,.12)}
.temp.warm{color:#e08600;background:rgba(224,134,0,.12)}
.temp.cool{color:var(--cyan);background:rgba(34,191,231,.12)}
.temp.new{color:var(--text-muted);background:var(--surface2)}
.empty{height:100%;display:grid;place-items:center;color:var(--text-muted);text-align:center;padding:40px}
.phero{position:relative;padding:36px 44px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:34px;min-height:188px}
.pawrap{position:relative;flex:none}
.phero .pa{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:400;font-size:44px;color:#fff;background:var(--grad);box-shadow:0 0 0 4px var(--surface),0 0 0 7px var(--cyan),0 10px 30px rgba(34,191,231,.32);overflow:hidden}
.phero .pa img{width:100%;height:100%;object-fit:cover}
.paedit{position:absolute;right:4px;bottom:6px;width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);background:var(--grad);color:#fff;cursor:pointer;display:grid;place-items:center;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.25);transition:transform .1s}
.paedit:hover{transform:scale(1.08)}
.phero h1{font-family:var(--display);font-weight:400;font-size:50px;line-height:1.02;letter-spacing:.5px;background:linear-gradient(120deg,var(--pink),var(--pink2) 55%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.phero .pbiz{color:var(--text-muted);font-size:18px;margin-top:10px;font-weight:600}
.phero .pbiz b{color:var(--pink)}
.phero .pmeta{margin-top:15px;display:flex;gap:8px;flex-wrap:wrap}
.phero .pmeta .pill{font-size:12.5px;padding:6px 14px}
.tierhead{display:flex;align-items:center;justify-content:space-between;padding:11px 18px;border-radius:11px;margin:20px 0 9px;font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.5px;color:#fff;box-shadow:var(--shadow)}
.tierhead .tc{font-size:12.5px;font-weight:700;font-family:var(--font);background:rgba(255,255,255,.28);padding:2px 12px;border-radius:999px}
.tierhead.tier1{background:linear-gradient(120deg,#FFB300,#FF8A00)}
.tierhead.tier2{background:linear-gradient(120deg,#FF1493,#FF5FB0)}
.tierhead.tier3{background:linear-gradient(120deg,#22BFE7,#00B4D8)}
.tierhead.tier4{background:linear-gradient(120deg,#9B5DE5,#C77DFF)}
.tierhead.tier5{background:linear-gradient(120deg,#00C2A8,#28E0B0)}
.tierhead.tier0{background:linear-gradient(120deg,#8a94a6,#aab2c0)}
.tierdot{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;color:#fff;font-size:10px;font-weight:800;margin-right:8px;vertical-align:middle;flex:none}
.efield select.esel{width:100%;font-family:inherit;font-size:14px;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;outline:none;cursor:pointer}
.efield select.esel:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,191,231,.16)}
.dcharts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.chartcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.chartcard.wide{grid-column:1/-1}
.chartcard h4{font-family:var(--display);font-weight:400;font-size:14px;margin:0 0 13px;color:var(--text);display:flex;align-items:center;gap:8px}
.chartcard h4 .sm{margin-left:auto;font-family:var(--font);font-size:11px;color:var(--text-muted);font-weight:600;letter-spacing:.3px}
.lbrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.lbn{width:118px;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.lbbar{flex:1;height:9px;background:var(--surface2);border-radius:999px;overflow:hidden}
.lbfill{height:100%;background:linear-gradient(90deg,var(--pink),var(--cyan));border-radius:999px}
.lbv{font-size:11.5px;color:var(--text-muted);white-space:nowrap;min-width:70px;text-align:right;flex:none}
.pipebar{display:flex;height:26px;border-radius:8px;overflow:hidden;background:var(--surface2)}
.pipelegs{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}
.pipeleg{font-size:11.5px;color:var(--text-muted);display:flex;align-items:center;gap:6px;font-weight:600}
.pipeleg i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.owed{display:flex;gap:14px;margin-top:15px}
.owed .ob{flex:1;background:var(--surface2);border-radius:10px;padding:11px 14px}
.owed .ob .v{font-family:var(--display);font-size:20px}
.owed .ob .l{font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--text-muted);font-weight:700;margin-top:3px}
@media(max-width:900px){.dcharts{grid-template-columns:1fr}}
.avmodal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9999}
.avbox{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;width:360px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.avbox h3{font-family:var(--display);font-weight:400;font-size:18px;margin:0 0 4px;color:var(--text)}
.avbox .sub{font-size:12.5px;color:var(--text-muted);margin-bottom:14px}
.avstage{position:relative;width:300px;height:300px;max-width:100%;margin:0 auto;border-radius:50%;overflow:hidden;background:var(--surface2);cursor:grab;touch-action:none;box-shadow:inset 0 0 0 2px var(--border)}
.avstage.drag{cursor:grabbing}
.avstage img{position:absolute;left:0;top:0;user-select:none;-webkit-user-drag:none;pointer-events:none}
.avzoom{width:100%;margin:16px 0 4px;accent-color:var(--pink)}
.avact{display:flex;gap:10px;margin-top:12px}
.avact .btn{flex:1;margin-left:0}
.avmenu{position:fixed;z-index:9998;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.28);padding:6px;min-width:210px}
.avmenu button{display:block;width:100%;text-align:left;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--text);background:none;border:none;padding:10px 12px;border-radius:8px;cursor:pointer}
.avmenu button:hover{background:var(--surface2)}
.pill{font-size:11px;font-weight:700;padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);color:var(--text-muted)}
.pill.hot{color:var(--pink);background:rgba(255,20,147,.10);border-color:rgba(255,20,147,.3)}
.pill.tier{color:var(--cyan);background:rgba(34,191,231,.10);border-color:rgba(34,191,231,.3)}
.pill.star{color:#e08600;background:rgba(224,134,0,.10);border-color:rgba(224,134,0,.3)}
.pcontact{margin-left:auto;display:flex;flex-direction:column;gap:8px;flex:none}
.cbtn{display:flex;align-items:center;justify-content:center;min-width:108px;font-family:inherit;font-size:13px;font-weight:700;padding:9px 16px;border-radius:11px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;text-decoration:none;transition:background .15s,box-shadow .15s}
.cbtn:hover{background:var(--row-hover);box-shadow:var(--shadow)}
.cbtn.call{color:#1d9e75}.cbtn.text{color:var(--cyan)}.cbtn.email{color:var(--pink)}
.pbody{display:flex;gap:18px;padding:20px 30px;align-items:flex-start}
.pleft{width:296px;flex:none;display:flex;flex-direction:column;gap:14px}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.pcard h3{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-muted);margin-bottom:12px}
.pcard .ln{display:flex;align-items:center;gap:9px;font-size:14px;padding:5px 0}
.pcard .ln a{color:var(--text);text-decoration:none}
.portalcard{background:linear-gradient(135deg,rgba(255,20,147,.07),rgba(34,191,231,.07));border-color:rgba(255,20,147,.25)}
.portalcard .url{font-family:var(--font);font-size:11px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;word-break:break-all;color:var(--text-muted);margin-bottom:10px}
.prow{display:flex;gap:8px}.prow .btn{flex:1;text-align:center;padding:8px 6px}
.actbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px;transition:background .12s}
.actbtn:hover{background:var(--row-hover)}
.ptabs{display:flex;gap:2px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.ptab{padding:11px 16px;font-weight:700;font-size:14px;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent}
.ptab.active{color:var(--text);border-bottom-color:var(--pink)}
.composer{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.csub{display:flex;border-bottom:1px solid var(--border)}
.csub div{flex:1;text-align:center;padding:12px;font-weight:700;font-size:13px;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent}
.csub div.active{color:var(--text);border-bottom-color:var(--cyan)}
.cbody{padding:14px}
.cbody .cto{font-size:12px;color:var(--text-muted);margin-bottom:8px}
.cbody textarea{width:100%;min-height:88px;font-family:inherit;font-size:14px;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px;outline:none;resize:vertical}
.crow{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px}
.actlog .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.actlog .hd h3{font-family:var(--display);font-weight:400;font-size:16px}
.actlog .filt{display:flex;gap:13px;font-size:12px;color:var(--text-muted);flex-wrap:wrap}
.actlog .filt span{cursor:pointer}.actlog .filt span.on{color:var(--pink);font-weight:700}
.actitem{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 14px;margin-bottom:8px;font-size:13px}
.actitem .k{font-weight:700;color:var(--cyan);text-transform:uppercase;font-size:10px;letter-spacing:.5px}
.noact{text-align:center;color:var(--text-muted);padding:34px}
.dwrap{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
@media(max-width:1000px){.dwrap{grid-template-columns:1fr}}
.dsection{margin-top:6px;margin-bottom:18px}
.dsection h3{font-family:var(--display);font-weight:400;font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.caldow{font-size:11px;font-weight:700;color:var(--text-muted);text-align:center;text-transform:uppercase;letter-spacing:.5px;padding:4px}
.calcell{min-height:86px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px 7px}
.calcell.empty{background:transparent;border:none}
.calcell .dn{font-weight:700;color:var(--text-muted);font-size:12px}
.calcell.today{border-color:var(--pink);box-shadow:0 0 0 2px rgba(255,20,147,.18)}
.calev{font-size:10px;background:rgba(34,191,231,.14);color:var(--cyan);border-radius:5px;padding:2px 5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calev.move{background:rgba(255,20,147,.12);color:var(--pink)}
.calnav{display:flex;align-items:center;gap:10px}.calnav .btn{padding:6px 12px;font-size:16px}
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.bcol{flex:1;min-width:230px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:12px}
.bcol h4{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;display:flex;justify-content:space-between}

.bcard .bn{font-weight:700;font-size:14px}.bcard .bs{font-size:12px;color:var(--text-muted);margin-top:2px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:10px;margin-top:8px}
.chip{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;min-height:56px;padding:12px 30px 12px 16px;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;line-height:1.3;cursor:pointer;color:var(--text-muted);transition:border-color .14s,background .14s,color .14s;user-select:none}
.chip:hover{border-color:var(--cyan);color:var(--text)}
.chip input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.chip:has(input:checked){border-color:var(--pink);background:linear-gradient(135deg,rgba(255,20,147,.12),rgba(34,191,231,.07));color:var(--text)}

.dpsel{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:7px}

.pact{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.cards{padding:24px 34px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.card h3{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:12px}
.field{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14px;border-bottom:1px solid var(--border)}
.field:last-child{border-bottom:none}.field .k{color:var(--text-muted)}
.field .v{font-weight:600;text-align:right;word-break:break-word}.field .v a{color:var(--cyan);text-decoration:none}
.notes{white-space:pre-wrap;font-size:14px;line-height:1.6}
.btn{font-family:inherit;font-size:13px;font-weight:700;padding:8px 16px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;transition:background .15s}

.efield textarea{resize:vertical}

:root[data-theme="dark"] .banner{color:#ffd479}
.ro{display:inline-block;margin-left:10px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);border:1px solid var(--border);border-radius:6px;padding:2px 7px;vertical-align:middle}
/* generic scroll page for portal/stub views */
.page{flex:1;overflow-y:auto;padding:26px 30px}

.mclu{position:relative;display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:800;font-family:var(--display);border:2px solid rgba(255,255,255,.55);box-shadow:0 2px 10px rgba(0,0,0,.4);cursor:pointer}

.mfilterlbl{font-size:12.5px;color:var(--text-muted);margin:6px 2px 10px;font-weight:600}

.rbtable td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle}
.rbtable tr:last-child td{border-bottom:none}
.rbtable tbody tr{transition:background .1s}
.rbtable tbody tr.known{cursor:pointer}
.rbtable tbody tr.known:hover{background:var(--surface2)}
.rbrank{font-family:var(--display);color:var(--pink);font-size:15px;width:54px}
.rbname{font-weight:800}
.rbbrk{color:var(--text-muted);font-size:12.5px}
.rbtxn,.rbvol{font-variant-numeric:tabular-nums;white-space:nowrap}
.rbvol{font-weight:700}
.rbst{font-size:9.5px;font-weight:800;letter-spacing:.5px;padding:4px 10px;border-radius:6px;white-space:nowrap}
.rbst.partner{color:var(--pink);background:rgba(255,20,147,.12);border:1px solid rgba(255,20,147,.4)}
.rbst.crm{color:var(--cyan);background:rgba(34,191,231,.12);border:1px solid rgba(34,191,231,.4)}

.rbst.stage{color:var(--cyan);background:rgba(34,191,231,.12);border:1px solid rgba(34,191,231,.4)}
.strikechip{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:800;letter-spacing:.3px;padding:2px 8px;border-radius:6px;color:#fff;background:linear-gradient(120deg,#FF1493,#FF7A00);vertical-align:middle;margin-left:5px;white-space:nowrap}
.strikechip .gi{width:12px;height:12px;color:#fff}
.tdrow .ti .gi{color:var(--pink)}
.pbhero{display:flex;gap:22px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:var(--shadow)}

.dombadge{font-weight:800;font-size:12px}

}

function gi(name){return '<span class="gi">'+(ICONS[name]||"")+'</span>';}
var NAV=[
  ["dashboard","Dashboard"],["contacts","Contacts"],["portal","Referral Portal"],
  ["inbox","Inbox"],["calendar","Calendar"],["dayplan","Day Plan"],
  ["topleads","Top Leads"],["map","Map"],["recruit","Recruit Board"],["radar","Listing Radar"]
];
var view="contacts", profileFrom="contacts";
function viewLabel(v){ var m={}; NAV.forEach(function(n){m[n[0]]=n[1];}); return m[v]||"Back"; }
function renderNav(){
  document.getElementById("sidebar").innerHTML=NAV.map(function(n){
    return '<div class="navitem'+(n[0]===view?" active":"")+'" data-v="'+n[0]+'"><span class="ic">'+(ICONS[n[0]]||"")+'</span><span class="lbl">'+esc(n[1])+'</span></div>';
  }).join("");
  [].forEach.call(document.querySelectorAll(".navitem"),function(el){el.onclick=function(){go(el.getAttribute("data-v"));};});
}
function go(v){
  view=v; renderNav();
  try{ if(v==="inbox")crmSeenSet("inbox"); else if(v==="portal")crmSeenSet("leads"); }catch(e){}
  try{localStorage.setItem("crmNav",v);}catch(e){}
  var q=document.getElementById("q"); q.value="";
  q.placeholder = v==="contacts"?"Search contacts…":(v==="portal"?"Search leads & partners…":(v==="inbox"?"Search messages…":"Search…"));
  try{
    if(v==="contacts") renderContacts("");
    else if(v==="portal") renderPortal();
    else if(v==="dashboard") renderDashboard();
    else if(v==="inbox") renderInbox();
    else if(v==="calendar") renderCalendar();
    else if(v==="dayplan") renderDayPlan();
    else if(v==="topleads") renderTopLeads();
    else if(v==="map") renderMap();
    else if(v==="recruit") renderRecruit();
    else if(v==="radar") renderRadar();
    else stub(v);
  }catch(e){ viewError(e); }
}
function viewError(e){
  try{ document.getElementById("view").innerHTML='<div class="page"><div class="noact" style="text-align:left;max-width:560px"><b style="color:var(--pink)">This view hit a snag loading.</b><div class="muted" style="margin-top:8px;font-size:12.5px;white-space:pre-wrap">'+esc(String((e&&e.message)||e))+'</div><div class="muted" style="margin-top:8px;font-size:12px">Try another tab or reload. Your data is safe.</div></div></div>'; }catch(_){}
}
function stub(v){
  var names={dashboard:"Dashboard",inbox:"Inbox",calendar:"Calendar",dayplan:"Day Plan",topleads:"Top Leads",map:"Map",recruit:"Recruit Board"};
  document.getElementById("view").innerHTML='<div class="stub"><div><div class="big">'+esc(names[v]||v)+'</div><div>This view is being rebuilt next. Contacts and the Referral Portal are live now.</div></div></div>';
}

var ALL=[], activeId=null, PHOTOS={};
var FALLBACK=[
 {id:58,name:"Kelli Lang",business:"Team Kelli Lang - RE/MAX Gateway",type:"Realtor",phone:"",email:"",territory:"Skagit"},
 {id:255,name:"Jay Kiesser",business:"Team Kelli Lang - RE/MAX Gateway",type:"Realtor",phone:"(360) 540-0676",email:"jay@teamkellilang.com",territory:"Skagit"}
];
async function loadContacts(){
  try{ ALL=await sb("contacts?select=id,name,business,type,phone,email,role,territory,score,tier,lastVisit,address,lat,lon,unitCount,bedCount,googleRating,reviewCount,dateAdded,portalActivatedAt,enrichmentNotes,profilePic&order=name.asc"); }
  catch(e){ ALL=FALLBACK; banner("Showing sample data — couldn't reach the live database from a local file (it connects live once deployed)."); }
  loadPhotos(); loadInteractions();
}
var LASTSEEN={}, ICOUNT={}, REFCOUNT={}, REFREV={}, REFBOOKED={};
async function loadInteractions(){
  try{var s=await sb("sms_messages?select=contact_id,created_at");s.forEach(function(m){var id=m.contact_id;if(id==null)return;ICOUNT[id]=(ICOUNT[id]||0)+1;var t=m.created_at||"";if(!LASTSEEN[id]||t>LASTSEEN[id])LASTSEEN[id]=t;});}catch(e){}
  try{var em=await sb("email_messages?select=contact_id,created_at");em.forEach(function(m){var id=m.contact_id;if(id==null)return;ICOUNT[id]=(ICOUNT[id]||0)+1;var t=m.created_at||"";if(!LASTSEEN[id]||t>LASTSEEN[id])LASTSEEN[id]=t;});}catch(e){}
  try{var rf=await sb("referrals?select=contactId,status,amount");rf.forEach(function(r){var id=r.contactId;if(id==null)return;REFCOUNT[id]=(REFCOUNT[id]||0)+1;REFREV[id]=(REFREV[id]||0)+(+r.amount||0);var st=String(r.status||"").toLowerCase();if(st==="booked"||st==="completed")REFBOOKED[id]=(REFBOOKED[id]||0)+1;});}catch(e){}
  if(view==="contacts") renderContacts(document.getElementById("q").value||"");
}
function banner(msg){var b=document.getElementById("banner");if(!b)return;clearTimeout(window.__bnT);b.style.display="block";b.style.position="relative";b.innerHTML='<span>'+esc(msg)+'</span><span id="bnX" title="Dismiss" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;font-weight:700;opacity:.55;font-size:14px">&#10005;</span>';var x=document.getElementById("bnX");if(x)x.onclick=function(){clearTimeout(window.__bnT);b.style.display="none";};window.__bnT=setTimeout(function(){b.style.display="none";},8000);}
async function loadPhotos(){
  try{var a=await sb("contacts?profilePic=not.is.null&select=id,profilePic");a.forEach(function(r){if(r.profilePic)PHOTOS[r.id]=r.profilePic;});}catch(e){}
  try{var b=await sb("contacts?type=eq.Realtor&profilePic=is.null&cardImage=not.is.null&select=id,cardImage");b.forEach(function(r){if(r.cardImage&&!PHOTOS[r.id])PHOTOS[r.id]=r.cardImage;});}catch(e){}
  if(view==="contacts") paintAvatars();
}
function paintAvatars(){
  [].forEach.call(document.querySelectorAll(".crow2[data-id]"),function(el){var id=+el.getAttribute("data-id");if(PHOTOS[id]){var av=el.querySelector(".av");if(av&&!av.querySelector("img"))av.innerHTML='<img src="'+esc(PHOTOS[id])+'" alt="">';}});
}
var cTab="all";
function daysSince(c){
  var ds=[]; if(c.lastVisit)ds.push(String(c.lastVisit).slice(0,10)); if(LASTSEEN[c.id])ds.push(String(LASTSEEN[c.id]).slice(0,10));
  if(!ds.length) return null; var latest=ds.sort().pop();
  var d=Math.floor((Date.now()-new Date(latest+"T00:00:00").getTime())/86400000); return d<0?0:d;
}
function tempOf(d){ if(d===null)return["new","New"]; if(d<=3)return["hot","Hot"]; if(d<=14)return["warm","Warm"]; if(d<=45)return["cool","Cool"]; return["new","Cold"]; }
// Facility-first display name: realtors/people show their name; storage/senior/apartment/etc. show the FACILITY (business) as the headline, person becomes the contact.
function cName(c){ return placeName(c)||"Unnamed"; }
function cPerson(c){ if(/realtor/i.test((c&&c.type)||"")) return ""; var biz=(c&&c.business)||"", nm=(c&&c.name)||""; if(placeName(c)===biz && nm && nm!==biz) return "Contact: "+nm; return ""; }
function fmtDate(d){ if(!d) return "—"; var dt=new Date(d); if(isNaN(dt.getTime())) return String(d).slice(0,10); return dt.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }
function daysSinceDate(d){ if(!d) return null; var dt=new Date(d); if(isNaN(dt.getTime())) return null; var n=Math.floor((Date.now()-dt.getTime())/86400000); return n<0?0:n; }
function profileStatsStrip(c){
  var refs=REFCOUNT[c.id]||0, booked=REFBOOKED[c.id]||0, rev=REFREV[c.id]||0;
  var ds=daysSinceDate(c.lastVisit), lvTxt=fmtDate(c.lastVisit);
  var lvBig=lvTxt+(ds!=null?' <span style="font-size:12px;color:var(--text-muted);font-weight:600">('+ds+'d ago)</span>':'');
  return '<div class="stats" style="margin:0 0 14px">'
    +stat(refs,"Referrals","var(--pink)")
    +stat(booked,"Booked","#00C2A8")
    +stat(money(rev),"Referred $","#e08600")
    +stat(lvBig,"Last visit","")+'</div>';
}
function rowHtml(c){
  var d=daysSince(c), tp=tempOf(d), cnt=ICOUNT[c.id]||0;
  var person=cPerson(c);
  var sub=(person?[person,c.role,c.territory]:[c.business,c.role,c.territory]).filter(Boolean).map(esc).join(" · ");
  var tc=tierColor(c.tier), tn=tierNum(c.tier);
  var tstyle=tc?(' style="border-left:5px solid '+tc+'"'):'';
  var tdot=(tn>=1&&tn<=5)?'<span class="tierdot" style="background:'+tc+'" title="Tier '+tn+'">'+tn+'</span>':'';
  return '<div class="crow2" data-id="'+c.id+'"'+tstyle+'><div class="av">'+(PHOTOS[c.id]?'<img src="'+esc(PHOTOS[c.id])+'" alt="">':esc(initials(cName(c)).toUpperCase()))+'</div>'
    +'<div class="meta"><div class="nm">'+tdot+esc(cName(c))+'<span class="temp '+tp[0]+'">'+tp[1]+'</span></div><div class="sub">'+(sub||"—")+'</div></div>'
    +'<div class="right"><div class="days'+(d!==null&&d>14?" stale":"")+'">'+(d===null?"—":d+"d")+'</div>'+(cnt?'<div class="cnt">'+cnt+'</div>':"")+'</div></div>';
}
function rowList(rows){ return rows.length?('<div class="clist">'+rows.map(rowHtml).join("")+'</div>'):'<div class="noact">No contacts.</div>'; }
var TIER_COLORS={1:"#FFB300",2:"#FF1493",3:"#22BFE7",4:"#9B5DE5",5:"#00C2A8"};
function tierNum(t){var m=/(\d+)/.exec(String(t||""));return m?+m[1]:99;}
function tierColor(t){return TIER_COLORS[tierNum(t)]||"";}
function tierView(rows){
  var g={}; rows.forEach(function(c){var t=c.tier||"No tier";(g[t]=g[t]||[]).push(c);});
  return Object.keys(g).sort(function(a,b){return tierNum(a)-tierNum(b)||a.localeCompare(b);}).map(function(k){
    var tn=tierNum(k); var cls=(tn>=1&&tn<=5)?("tier"+tn):"tier0";
    return '<div class="tierhead '+cls+'"><span>'+esc(k)+'</span><span class="tc">'+g[k].length+'</span></div>'+rowList(g[k]);
  }).join("");
}
var rbSortMode="referrals";
function referralBoard(rows){
  var rs=rows.filter(function(c){return /realtor/i.test(c.type||"");});
  var metric=function(c){return rbSortMode==="revenue"?(REFREV[c.id]||0):rbSortMode==="booked"?(REFBOOKED[c.id]||0):(REFCOUNT[c.id]||0);};
  rs.sort(function(a,b){return metric(b)-metric(a)||String(a.name||"").localeCompare(String(b.name||""));});
  var sel='<div class="cfilters"><select id="rbSortSel">'+[["referrals","Total referrals"],["revenue","Revenue referred"],["booked","Booked jobs"]].map(function(o){return '<option value="'+o[0]+'"'+(rbSortMode===o[0]?" selected":"")+'>'+o[1]+'</option>';}).join("")+'</select></div>';
  if(!rs.length) return sel+'<div class="noact">No realtors.</div>';
  return sel+'<div class="clist">'+rs.map(function(c){
    var sub=[c.business,c.territory].filter(Boolean).map(esc).join(" · ");
    var val=rbSortMode==="revenue"?money(REFREV[c.id]||0):metric(c);
    var lbl=rbSortMode==="revenue"?"referred":rbSortMode==="booked"?"booked":"referrals";
    return '<div class="crow2" data-id="'+c.id+'"><div class="av">'+(PHOTOS[c.id]?'<img src="'+esc(PHOTOS[c.id])+'" alt="">':esc(initials(c.name).toUpperCase()))+'</div>'
      +'<div class="meta"><div class="nm">'+esc(c.name||"Unnamed")+(c.portalActivatedAt?'<span class="temp cool">Active</span>':'<span class="temp new">Not active</span>')+'</div><div class="sub">'+(sub||"—")+'</div></div>'
      +'<div class="right"><div class="days" style="color:var(--pink)">'+val+'</div><div class="muted" style="font-size:10px">'+lbl+'</div></div></div>';
  }).join("")+'</div>';
}
var cSort="recent", cTypeF="", cTerrF="";
function applyCSF(rows){
  var rs=rows.slice();
  if(cTypeF) rs=rs.filter(function(c){return typeMatches(c.type,[cTypeF]);});
  if(cTerrF) rs=rs.filter(function(c){return (c.territory||"")===cTerrF;});
  rs.sort(function(a,b){
    if(cSort==="name") return String(a.name||"").localeCompare(String(b.name||""));
    if(cSort==="tier") return (tierNum(a.tier)-tierNum(b.tier))||String(a.name||"").localeCompare(String(b.name||""));
    if(cSort==="refs") return (REFCOUNT[b.id]||0)-(REFCOUNT[a.id]||0);
    var da=daysSince(a),db=daysSince(b),va=(da===null?1e9:da),vb=(db===null?1e9:db);
    return cSort==="stale"?(vb-va):(va-vb);
  });
  return rs;
}
function contactsTab(rows){ if(cTab==="tier")return tierView(rows); if(cTab==="referral")return referralBoard(rows); return rowList(applyCSF(rows)); }
function csfControls(){
  var sortOpts=[["recent","Recently visited"],["stale","Longest since contact"],["name","Name A–Z"],["tier","Tier (1→5)"],["refs","Most referrals"]];
  var s='<select id="cSortSel">'+sortOpts.map(function(o){return '<option value="'+o[0]+'"'+(cSort===o[0]?" selected":"")+'>'+o[1]+'</option>';}).join("")+'</select>';
  s+='<select id="cTypeSel"><option value="">All types</option>'+DP_TY.map(function(t){return '<option'+(cTypeF===t?" selected":"")+'>'+esc(t)+'</option>';}).join("")+'</select>';
  s+='<select id="cTerrSel"><option value="">All territories</option>'+DP_TR.map(function(t){return '<option'+(cTerrF===t?" selected":"")+'>'+esc(t)+'</option>';}).join("")+'</select>';
  return '<div class="cfilters">'+s+'</div>';
}
function renderContacts(filter){
  var f=(filter||"").toLowerCase().trim();
  var rows=ALL.filter(function(c){ if(!f) return true; return ((c.name||"")+" "+(c.business||"")+" "+(c.phone||"")+" "+(c.email||"")).toLowerCase().indexOf(f)>=0; });
  var html='<div class="page"><div class="ph"><h2>'+gi("contacts")+' Contacts</h2><span class="muted" style="margin-left:auto;font-weight:600">'+rows.length+' total</span><button class="btn grad" id="addContactBtn" style="margin-left:14px">+ New Contact</button></div>'
    +'<div class="tabs"><div class="tab'+(cTab==="all"?" active":"")+'" data-ct="all">All Contacts</div><div class="tab'+(cTab==="tier"?" active":"")+'" data-ct="tier">Tier View</div><div class="tab'+(cTab==="referral"?" active":"")+'" data-ct="referral">Referral Board</div></div>'
    +(cTab==="all"?csfControls():"")

function lpAreas(c){
  var t=((c.territory||"")+" "+(c.business||"")).toLowerCase();

  var list=/whatcom|bellingham|ferndale|lynden|blaine/.test(t)?whatcom.slice():skagit.slice();
  if(spec && list.map(function(x){return x.toLowerCase();}).indexOf(spec.toLowerCase())<0) list=[spec].concat(list);
  var seen={},out=[]; list.forEach(function(x){var k=x.toLowerCase(); if(x&&!seen[k]){seen[k]=1;out.push(x);}});

async function lpDo(c,action,status){

    var r=await fetch(NEON_API+"/api/publishPartnerPage",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(x){return x.json();});

  inp.click();

function avCrop(src,mode){
  var img=new Image();
  img.onload=function(){
    var ov=document.createElement("div");ov.className="avmodal";ov.id="avModal";
    ov.innerHTML='<div class="avbox"><h3>'+(mode==="card"?"Frame the headshot":"Position your photo")+'</h3>'
      +'<div class="sub">'+(mode==="card"?"Drag and zoom to frame the face on the card.":"Drag to reposition, slider to zoom.")+'</div>'
      +'<div class="avstage" id="avStage"><img id="avImg" src="'+src+'"></div>'
      +'<input type="range" class="avzoom" id="avZoom" min="1" max="3.5" step="0.01" value="1">'
      +'<div class="avact"><button class="btn grad" id="avSaveBtn">Save photo</button><button class="btn" id="avCancel">Cancel</button></div></div>';
    document.body.appendChild(ov);
    var S=300, nw=img.naturalWidth, nh=img.naturalHeight, cover=Math.max(S/nw,S/nh);
    var st={z:1,ox:0,oy:0};
    var el=document.getElementById("avImg"), stage=document.getElementById("avStage");
    function apply(){
      var ds=cover*st.z, dw=nw*ds, dh=nh*ds, maxX=(dw-S)/2, maxY=(dh-S)/2;
      st.ox=Math.max(-maxX,Math.min(maxX,st.ox)); st.oy=Math.max(-maxY,Math.min(maxY,st.oy));
      el.style.width=dw+"px"; el.style.height=dh+"px"; el.style.left=((S-dw)/2+st.ox)+"px"; el.style.top=((S-dh)/2+st.oy)+"px";
    }
    apply();
    el.onerror=function(){avCloseModal();alert("That image couldn't be displayed — try a different file.");};
    document.getElementById("avZoom").oninput=function(){st.z=+this.value;apply();};
    var drag=false,lx,ly;
    function pt(e){var t=e.touches&&e.touches[0];return t?{x:t.clientX,y:t.clientY}:{x:e.clientX,y:e.clientY};}
    function down(e){drag=true;var p=pt(e);lx=p.x;ly=p.y;stage.classList.add("drag");e.preventDefault();}
    function move(e){if(!drag)return;var p=pt(e);st.ox+=p.x-lx;st.oy+=p.y-ly;lx=p.x;ly=p.y;apply();if(e.touches)e.preventDefault();}
    function up(){drag=false;stage.classList.remove("drag");}
    stage.onmousedown=down; document.onmousemove=move; document.onmouseup=up;
    stage.ontouchstart=down; document.ontouchmove=move; document.ontouchend=up;
    document.getElementById("avCancel").onclick=avCloseModal;
    document.getElementById("avSaveBtn").onclick=function(){
      var out=320, cv=document.createElement("canvas");cv.width=out;cv.height=out;var ctx=cv.getContext("2d");
      var ds=cover*st.z, imgLeft=(S-nw*ds)/2+st.ox, imgTop=(S-nh*ds)/2+st.oy;
      var sx=(0-imgLeft)/ds, sy=(0-imgTop)/ds, sS=S/ds;
      ctx.drawImage(img,sx,sy,sS,sS,0,0,out,out);
      var avatar=cv.toDataURL("image/jpeg",0.85);
      var card=mode==="card"?avDownscale(img,1200):null;
      avSave(avatar,card);
    };
  };
  img.onerror=function(){alert("That image couldn't be loaded — try a different photo.");};

async function skipPayout(key,qid,partner,customer){
  if(!key) return;
  if(!confirm("Remove this as a payout?\n\n"+(customer||"This referral")+" stays on "+(partner||"the partner")+"'s record as a referral. It just will not show in Payouts Due, and nothing is paid.\n\n(To undo, delete its row in the payout_skips table.)")) return;
  // optimistic: drop it locally so the row disappears immediately
  if(!PORTAL.skips) PORTAL.skips=[];
  PORTAL.skips.push({key:key,partner:partner||"",customer:customer||""});
  if(qid && PORTAL.queue) PORTAL.queue=PORTAL.queue.filter(function(q){return String(q.id)!==String(qid);});
  drawPortal();
  banner('"'+(customer||"Referral")+'" removed from Payouts Due — still recorded as a referral.');
  // persist the skip
  try{ var r=await fetch(SB_URL+"/rest/v1/payout_skips",{method:"POST",headers:Object.assign({},H,{"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify({key:key,partner:partner||"",customer:customer||"",skipped_at:new Date().toISOString()})}); if(!r.ok&&r.status!==409)throw new Error("SB "+r.status); }
  catch(e){ /* leave the local skip; it'll re-persist on next attempt */ }
  // if it was also a manually-queued row, clear that too so it can't re-appear
  if(qid){ try{ await fetch(SB_URL+"/rest/v1/payout_queue?id=eq."+encodeURIComponent(qid),{method:"DELETE",headers:H}); }catch(e){} }
}

function typeMatches(ct,sel){

  if(!confirm("Add "+a.name+" to your CRM as a realtor prospect?"))return;
  var ids=ALL.map(function(c){return +c.id;}).filter(function(n){return !isNaN(n);});
  var nid=(ids.length?Math.max.apply(null,ids):0)+1;
  var rec={id:nid,name:a.name,business:a.office||"",phone:a.phone||"",email:a.email||"",type:"Realtor",role:"Realtor",territory:a.areas||"",notes:"Added from Recruit Board (Now Listing) — "+a.listing_count+" active listings."};
  ALL.push(rec);
  try{ await sbWrite("POST","contacts",rec); banner(a.name+" added to your CRM as a prospect."); }
  catch(e){ banner("Added on screen — couldn't reach the database."); }
  if(view==="recruit")drawRecruit();
}
function rbStatus(name){ var n=String(name||"").toLowerCase().trim(); var c=ALL.filter(function(x){return String(x.name||"").toLowerCase().trim()===n;})[0]; if(!c)return{s:"TARGET",cls:"target",id:null}; return c.portalActivatedAt?{s:"PARTNER",cls:"partner",id:c.id}:{s:"IN CRM",cls:"crm",id:c.id}; }
function recCounty(b){b=String(b||"").toLowerCase(); if(b.indexOf("western realty")>=0||b.indexOf("keller williams western")>=0||b.indexOf("bellingham")>=0||b.indexOf("whatcom")>=0||b.indexOf("muljat")>=0||b.indexOf("lynden")>=0||b.indexOf("ferndale")>=0) return "Whatcom"; return "Skagit"; }
function recruitList(){
  // Whatcom production report first so its real numbers win over Skagit-list / CRM duplicates.
  var base=WHATCOM75.map(function(r){return {name:r.name,brokerage:r.brokerage,txns:r.txns,vol:r.vol,county:"Whatcom"};});
  var have={}; base.forEach(function(r){have[String(r.name).toLowerCase().trim()]=1;});
  RECRUIT.forEach(function(r){ var k=String(r.name).toLowerCase().trim(); if(have[k])return; base.push({name:r.name,brokerage:r.brokerage,txns:r.txns,vol:r.vol,county:recCounty(r.brokerage)}); have[k]=1; });
  (ALL||[]).forEach(function(c){
    if(String(c.type||"").toLowerCase().indexOf("realtor")<0) return;
    var key=String(c.name||"").toLowerCase().trim(); if(!key||have[key]) return;
    var terr=String(c.territory||"").toLowerCase();
    var county=terr.indexOf("whatcom")>=0?"Whatcom":terr.indexOf("skagit")>=0?"Skagit":recCounty(c.business||c.brokerage);
    base.push({name:c.name,brokerage:c.business||c.brokerage||"—",txns:"—",vol:0,county:county});
    have[key]=1;
  });
  return base;
}

  var totVol=fullList.reduce(function(s,r){return s+(r.vol||0);},0);

  if(rbRegion!=="all") rows=rows.filter(function(x){return x.r.county===rbRegion;});

    return;
  }

function ngBeep(seq){
  try{
    var Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx)return;
    var ac=window.__ngAC||(window.__ngAC=new Ctx()); if(ac.state==="suspended"){try{ac.resume();}catch(e){}}
    seq.forEach(function(n){
      var o=ac.createOscillator(), g=ac.createGain(); o.type=n.type||"sine"; o.frequency.value=n.f; o.connect(g); g.connect(ac.destination);
      var t0=ac.currentTime+(n.t||0); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(n.v||0.6,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+(n.d||0.25));
      o.start(t0); o.stop(t0+(n.d||0.25)+0.03);
    });
  }catch(e){}
}

function mRenderMap(){
  var box=document.getElementById("mRouteMap"); if(!box||typeof L==="undefined")return;

  function add(name,lat,lon){ if(lat==null||lon==null||isNaN(lat)||isNaN(lon))return; var k=(+lat).toFixed(4)+","+(+lon).toFixed(4); if(seen[k])return; seen[k]=1; pts.push({name:name||"Stop",lat:+lat,lon:+lon}); }
  if(mRouteOpt&&mRouteOpt.order&&mRouteOpt.order.length) mRouteOpt.order.forEach(function(s){ add(s.name,s.lat,s.lon); });
  else if(mRoutePlan&&mRoutePlan.stops) mRoutePlan.stops.forEach(function(s){ add(s.name,s.lat,s.lon); });
  mRouteIds().forEach(function(id){ var c=(ALL||[]).filter(function(x){return x.id===id;})[0]; if(c) add(cName(c),c.lat,c.lon); });
  if(!pts.length){ box.style.display="none"; return; }

  try{
    mMapObj=L.map(box,{zoomControl:true,attributionControl:false});
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(mMapObj);
    var bounds=[];
    pts.forEach(function(p,i){
      var icon=L.divIcon({className:"",html:'<div style="background:var(--pink,#ff2d9b);color:#fff;width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.45);font-weight:700;font-size:12px"><span style="transform:rotate(45deg)">'+(i+1)+'</span></div>',iconSize:[26,26],iconAnchor:[13,26]});
      L.marker([p.lat,p.lon],{icon:icon}).addTo(mMapObj).bindPopup((i+1)+". "+p.name);
      bounds.push([p.lat,p.lon]);

async function mLoadProfileRefs(c,boxId){
  var box=document.getElementById(boxId); if(!box)return;
  var refs=[],leads=[];
  try{ refs=await sb("referrals?contactId=eq."+c.id+"&select=id,jobName,status,date,amount,contactName&order=date.desc"); }catch(e){}
  if(/realtor/i.test(c.type||"")||c.portalActivatedAt){ try{ leads=await sb("portal_leads?realtorId=eq."+encodeURIComponent(c.id)+"&select=id,customerName,status,moveDate&order=id.desc"); }catch(e){} }
  var norm=function(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");};
  var seen={},merged=[];
  (refs||[]).forEach(function(r){var k=norm(r.jobName);if(k)seen[k]=1;merged.push({jobName:r.jobName,status:r.status,date:r.date,amount:r.amount,source:"referral"});});
  (leads||[]).forEach(function(l){var k=norm(l.customerName);if(k&&seen[k])return;if(k)seen[k]=1;merged.push({jobName:l.customerName,status:l.status,date:l.moveDate,amount:null,source:"portal"});});
  merged.sort(function(a,b){var da=String(a.date||""),db=String(b.date||"");return db<da?-1:db>da?1:0;});
  if(!box)return;
  if(!merged.length){ box.innerHTML='<div class="m-meta">No referrals yet.</div>'; return; }
  var tot=merged.length,bk=0,rev=0; merged.forEach(function(r){var s=String(r.status||"").toLowerCase();if(s==="booked"||s==="completed")bk++;rev+=(+r.amount||0);});
  var html='<div style="display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden">'
    +'<div style="flex:1;text-align:center;padding:8px"><div style="font-size:19px;font-weight:800">'+tot+'</div><div class="m-meta" style="font-size:10px">TOTAL</div></div>'
    +'<div style="flex:1;text-align:center;padding:8px"><div style="font-size:19px;font-weight:800;color:var(--pink)">'+bk+'</div><div class="m-meta" style="font-size:10px">BOOKED</div></div>'
    +'<div style="flex:1;text-align:center;padding:8px"><div style="font-size:19px;font-weight:800;color:#00C2A8">'+((typeof money==="function")?money(rev):"$"+rev)+'</div><div class="m-meta" style="font-size:10px">REFERRED $</div></div></div>';
  html+=merged.slice(0,12).map(function(r){var amt=(+r.amount)?(" · $"+(+r.amount).toLocaleString()):""; return '<div style="padding:7px 0;border-top:1px solid var(--border)"><div class="m-nm" style="font-size:13px">'+esc(r.jobName||"—")+'</div><div class="m-meta" style="font-size:11px">'+esc(String(r.status||"")).toUpperCase()+' · '+esc(String(r.date||"").slice(0,10))+amt+(r.source==="portal"?' · via portal':'')+'</div></div>';}).join("");
  box.innerHTML=html;
}

  ov.addEventListener("click",function(e){if(e.target===ov){ if(_dictRec){try{_dictRec.stop();}catch(_){}} cImg=null; ov.remove();}});
  document.getElementById("mCcancel").onclick=function(){ if(_dictRec){try{_dictRec.stop();}catch(_){}} cImg=null; ov.remove();};
  var tk=document.getElementById("mTalk"); if(tk)tk.onclick=function(){aiDictate("mMsg",tk);};
  var im=document.getElementById("mImprove"); if(im)im.onclick=function(){aiImprove("mMsg",im,"mCmsg");};
  var mph=document.getElementById("mPhoto"), mpf=document.getElementById("mPhotoFile");
  if(mph&&mpf){ mph.onclick=function(){mpf.click();}; mpf.onchange=function(){ var f=mpf.files&&mpf.files[0]; if(!f)return; var rd=new FileReader(); rd.onload=function(){ var im2=new Image(); im2.onload=function(){ cImg=avDownscale(im2,1280); var p=document.getElementById("mPhotoPrev"); if(p)p.innerHTML='<img src="'+cImg+'" style="max-width:100%;border-radius:12px;border:1px solid var(--border)">'; mph.textContent="Photo attached — tap Send text"; }; im2.src=rd.result; }; rd.readAsDataURL(f); }; }
  document.getElementById("mSend").onclick=async function(){
    var t=((document.getElementById("mMsg")||{}).value||""); var m=document.getElementById("mCmsg"); if(!t.trim()&&!(kind==="text"&&cImg))return;
    if(_dictRec){try{_dictRec.stop();}catch(_){}}
    var btn=this; btn.disabled=true; btn.textContent="Working…";
    if(kind==="note"||kind==="visit"){
      var stamp=(kind==="visit"?"[Visit ":"[")+new Date().toISOString().slice(0,10)+"] "+t;
      var nn=(c.notes?c.notes+"\n":"")+stamp; c.notes=nn;
      var patch={notes:nn}; if(kind==="visit"){ var iso=new Date().toISOString(); c.lastVisit=iso; patch.lastVisit=iso; }
      var c2=(ALL||[]).filter(function(x){return x.id===c.id;})[0]; if(c2){c2.notes=nn; if(kind==="visit")c2.lastVisit=c.lastVisit;}
      try{await sbWrite("PATCH","contacts?id=eq."+c.id,patch);}catch(e){}
      ov.remove(); var s1=document.getElementById("mSheetMsg"); if(s1)s1.innerHTML='<span style="color:var(--pink);font-weight:700">✓ '+(kind==="visit"?"Visit logged.":"Note saved.")+'</span>'; return;
    }
    var hadImg=!!cImg;
    var sent = hadImg ? await sendPhoto({to:c.phone,body:t,contactId:c.id,kind:"manual",imageBase64:cImg}) : await sendText({to:c.phone,body:t,contactId:c.id,kind:"manual"});
    if(sent.ok){ var mediaUrl=hadImg?(sent.mediaUrl||null):null; cImg=null; var logBody=(t||(hadImg?"Photo":"")); var row={contact_id:c.id,direction:"out",to_number:String(c.phone).replace(/[^0-9+]/g,""),from_number:"+13605885228",body:logBody,kind:"manual",status:"sent",sent_at:new Date().toISOString()}; if(mediaUrl)row.media_url=mediaUrl; try{ await sbWrite("POST","sms_messages",row); }catch(e){} ov.remove(); var s2=document.getElementById("mSheetMsg"); if(s2)s2.innerHTML='<span style="color:var(--pink);font-weight:700">✓ '+(hadImg?"Photo sent.":"Text sent.")+'</span>'; }
    else { if(m)m.textContent="Not sent: "+sent.msg; btn.disabled=false; btn.textContent="Send text"; }
  };
}
async function mTogglePortal(c){
  var on=!!c.portalActivatedAt; var now=new Date().toISOString();
  if(!on && !confirm("Activate "+c.name+"'s referral portal? They start earning $50 per completed referral.")) return;
  if(on && !confirm("Deactivate "+c.name+"'s referral portal?")) return;
  c.portalActivatedAt=on?null:now; var c2=(ALL||[]).filter(function(x){return x.id===c.id;})[0]; if(c2)c2.portalActivatedAt=c.portalActivatedAt; PORTAL=null;
  try{ await sbWrite("PATCH","contacts?id=eq."+c.id,{portalActivatedAt:c.portalActivatedAt}); }catch(e){}
  var sh=document.getElementById("mSheetMsg"); if(sh)sh.innerHTML='<span style="color:var(--pink);font-weight:700">✓ '+(on?"Deactivated":"Activated")+'.</span>';
  var pb=document.getElementById("mPortalBtn"); if(pb)pb.innerHTML=gi("portal")+' '+(c.portalActivatedAt?"Deactivate portal":"Activate portal ($50 referrals)");
}
