<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Portal | Neon Giant Moving</title>
<meta name="description" content="Your Neon Giant Moving referral dashboard.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Audiowide&display=swap" rel="stylesheet">
<style>
  :root { --neon-cyan:#22BFE7; --neon-cyan-2:#00E5FF; --neon-pink:#FF1493; --neon-pink-2:#FF4FB6; --neon-yellow:#FFD23F; --neon-green:#3CFFA2; --bg-0:#050008; --bg-1:#0d0014; --text:#f4f4ff; --muted:#8a8aa3; }
  *,*::before,*::after { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { font-family:'Space Grotesk',-apple-system,sans-serif; background:var(--bg-0); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; overflow-x:hidden; position:relative; }
  .bg-grid { position:fixed; inset:0; z-index:0; pointer-events:none; background: radial-gradient(ellipse 90% 60% at 50% 100%, rgba(255,20,147,0.30), transparent 60%), radial-gradient(ellipse 80% 60% at 50% 0%, rgba(34,191,231,0.22), transparent 65%), linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 60%, var(--bg-0) 100%); }
  .bg-grid::after { content:''; position:absolute; inset:0; background-image: linear-gradient(0deg, rgba(34,191,231,0.10) 1px, transparent 1px), linear-gradient(90deg, rgba(34,191,231,0.10) 1px, transparent 1px); background-size:64px 64px; mask-image:linear-gradient(180deg, transparent 0%, transparent 50%, black 100%); -webkit-mask-image:linear-gradient(180deg, transparent 0%, transparent 50%, black 100%); transform:perspective(600px) rotateX(60deg) translateY(20%); transform-origin:50% 100%; opacity:0.65; }
  .scanlines { position:fixed; inset:0; z-index:1; pointer-events:none; background:repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px); mix-blend-mode:overlay; }
  .wrap { position:relative; z-index:2; max-width:580px; margin:0 auto; padding:24px 16px 80px; }
  .hero { text-align:center; margin-bottom:18px; position:relative; }
  .hero .mark { width:96px; height:116px; margin:0 auto 8px; background:url('/bigfoot-mark.png') center/contain no-repeat; filter: drop-shadow(0 0 14px rgba(255,20,147,0.55)) drop-shadow(0 0 28px rgba(34,191,231,0.35)); animation:gentle-float 6s ease-in-out infinite; }
  @keyframes gentle-float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
  .hero .brand { font-family:'Audiowide',cursive; font-size:12px; letter-spacing:5px; text-transform:uppercase; color:var(--neon-cyan); text-shadow:0 0 8px rgba(34,191,231,0.55), 0 0 16px rgba(34,191,231,0.3); margin-bottom:2px; }
  .hero .biz { font-size:11px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; }
  .hero h1 { font-family:'Audiowide',cursive; font-size:clamp(38px, 11vw, 56px); margin:14px 0 0; line-height:1; background:linear-gradient(135deg, var(--neon-cyan-2) 0%, #ffffff 50%, var(--neon-pink-2) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 26px rgba(255,20,147,0.4)); text-transform:uppercase; letter-spacing:-1px; }
  .hero .sub { margin-top:6px; font-size:14px; color:var(--muted); }
  .rheadshot { width:84px; height:84px; border-radius:50%; margin:14px auto 0; background-size:cover; background-position:center; box-shadow:0 0 0 2px rgba(255,20,147,0.55), 0 0 22px rgba(34,191,231,0.35); }
  .tier { display:inline-flex; align-items:center; gap:6px; margin-top:10px; padding:6px 12px; border-radius:999px; background:linear-gradient(135deg, rgba(255,20,147,0.15), rgba(34,191,231,0.15)); border:1px solid rgba(255,20,147,0.4); font-family:'Audiowide',cursive; font-size:11px; letter-spacing:2px; color:#fff; text-shadow:0 0 8px rgba(255,20,147,0.6); }
  .tier .dot { width:6px; height:6px; border-radius:50%; background:var(--neon-pink); box-shadow:0 0 8px var(--neon-pink); animation:pulse-dot 1.4s ease-in-out infinite; }
  @keyframes pulse-dot { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.5; transform:scale(0.9); } }
  .stats { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-bottom:18px; }
  .stat { position:relative; background:rgba(13,0,20,0.65); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); padding:14px 8px; border-radius:14px; border:1px solid rgba(34,191,231,0.18); text-align:center; overflow:hidden; transition:transform 0.15s, box-shadow 0.2s; }
  .stat:hover { transform:translateY(-2px); box-shadow:0 12px 28px rgba(0,0,0,0.5); }
  .stat .num { font-family:'Audiowide',cursive; font-size:32px; line-height:1.05; font-weight:400; letter-spacing:-0.5px; }
  .stat .lbl { font-size:9px; color:var(--muted); letter-spacing:2px; margin-top:4px; text-transform:uppercase; font-weight:600; }
  .stat.referrals .num { color:var(--neon-cyan); text-shadow:0 0 12px rgba(34,191,231,0.65); }
  .stat.pending .num { color:var(--neon-pink); text-shadow:0 0 12px rgba(255,20,147,0.6); }
  .stat.paid .num { color:var(--neon-yellow); text-shadow:0 0 12px rgba(255,210,63,0.55); }
  .stat.moves .num { color:var(--neon-green); text-shadow:0 0 12px rgba(60,255,162,0.5); }
  .h { font-family:'Audiowide',cursive; font-size:13px; letter-spacing:3px; text-transform:uppercase; color:var(--neon-cyan); text-shadow:0 0 8px rgba(34,191,231,0.4); margin:22px 0 10px; }
  .cta { display:block; width:100%; padding:16px; background:linear-gradient(135deg, var(--neon-pink) 0%, #ff5da7 100%); color:#fff; border:0; border-radius:12px; font-family:'Audiowide',cursive; font-size:15px; letter-spacing:3px; text-transform:uppercase; cursor:pointer; text-decoration:none; text-align:center; margin-top:4px; box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset, 0 0 22px rgba(255,20,147,0.55), 0 8px 26px rgba(255,20,147,0.35); animation:cta-pulse 2.6s ease-in-out infinite; transition:transform 0.06s; }
  @keyframes cta-pulse { 0%,100% { box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset, 0 0 22px rgba(255,20,147,0.55), 0 8px 26px rgba(255,20,147,0.35); } 50% { box-shadow:0 0 0 1px rgba(255,255,255,0.10) inset, 0 0 38px rgba(255,20,147,0.85), 0 10px 32px rgba(255,20,147,0.55); } }
  .cta:active { transform:translateY(1px) scale(0.99); }
  .ref { background:rgba(13,0,20,0.55); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); padding:12px 14px; border-radius:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:10px; border:1px solid rgba(34,191,231,0.12); transition:transform 0.15s, border-color 0.2s; }
  .ref:hover { transform:translateX(2px); border-color:rgba(34,191,231,0.30); }
  .ref .name { font-weight:600; font-size:14px; color:#fff; }
  .ref .meta { font-size:11px; color:var(--muted); margin-top:2px; letter-spacing:0.3px; }
  .ref .right { display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  .ref.just-submitted { background:linear-gradient(135deg, rgba(34,191,231,0.18), rgba(34,191,231,0.06)); border:1px solid rgba(34,191,231,0.55); animation:just-flash 1s ease-in-out 3; }
  @keyframes just-flash { 0%,100% { box-shadow:0 0 0 0 rgba(34,191,231,0); } 50% { box-shadow:0 0 0 8px rgba(34,191,231,0.20); } }
  .badge { padding:3px 9px; border-radius:4px; font-size:9px; font-family:'Audiowide',cursive; letter-spacing:1.5px; }
  .when { font-size:10px; color:#666; letter-spacing:0.3px; }
  .just-banner { padding:12px 14px; border-radius:12px; margin-bottom:12px; font-size:13px; text-align:center; background:linear-gradient(135deg, rgba(34,191,231,0.22), rgba(34,191,231,0.06)); border:1px solid rgba(34,191,231,0.55); color:var(--neon-cyan); text-shadow:0 0 8px rgba(34,191,231,0.5); font-family:'Audiowide',cursive; letter-spacing:1.5px; }
  .linkcard { background:linear-gradient(135deg, rgba(255,20,147,0.10), rgba(34,191,231,0.08)), rgba(13,0,20,0.55); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); padding:14px; border-radius:14px; margin-top:12px; border:1px solid rgba(255,20,147,0.30); box-shadow:0 0 0 1px rgba(34,191,231,0.06) inset; }
  .linkcard h3 { margin:0 0 8px; font-family:'Audiowide',cursive; font-size:11px; letter-spacing:3px; color:#fff; text-transform:uppercase; text-shadow:0 0 8px rgba(255,20,147,0.55); }
  .linkcard .url { font-family:'Space Grotesk',monospace; font-size:11px; color:#fff; word-break:break-all; background:rgba(0,0,0,0.55); padding:9px 10px; border-radius:7px; margin-bottom:10px; border:1px solid rgba(34,191,231,0.15); }
  .linkcard button { background:#fff; color:#1a0033; border:0; border-radius:7px; padding:8px 14px; font-size:11px; font-family:'Audiowide',cursive; letter-spacing:1.5px; cursor:pointer; transition:transform 0.06s, box-shadow 0.2s; }
  .linkcard button:hover { box-shadow:0 0 16px rgba(255,255,255,0.4); }
  .linkcard button:active { transform:translateY(1px); }
  .linkcard button + button { margin-left:8px; background:rgba(255,255,255,0.16); color:#fff; }
  details.how { margin-top:16px; background:rgba(13,0,20,0.55); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-radius:12px; border:1px solid rgba(34,191,231,0.12); padding:0; }
  details.how summary { padding:12px 14px; cursor:pointer; font-family:'Audiowide',cursive; font-size:11px; color:#ccc; letter-spacing:2px; text-transform:uppercase; list-style:none; }
  details.how summary::-webkit-details-marker { display:none; }
  details.how summary::after { content:'+'; float:right; color:var(--neon-pink); font-size:18px; text-shadow:0 0 6px rgba(255,20,147,0.6); }
  details.how[open] summary::after { content:'\2212'; }
  details.how .howbody { padding:0 14px 14px; font-size:13px; color:#aaa; line-height:1.6; }
  details.how .step { padding:6px 0; }
  details.how .step b { color:#fff; }
  .empty { text-align:center; padding:30px 20px; background:rgba(13,0,20,0.55); border-radius:12px; color:var(--muted); font-size:13px; line-height:1.6; border:1px solid rgba(34,191,231,0.12); }
  .empty .icon { font-size:40px; margin-bottom:10px; opacity:0.6; }
  .err { text-align:center; padding:30px 20px; color:#ff8a8a; font-size:14px; background:rgba(255,40,80,0.10); border:1px solid rgba(255,40,80,0.4); border-radius:12px; }
  .skel { display:inline-block; background:linear-gradient(90deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.18) 50%, rgba(255,255,255,0.05) 100%); background-size:200% 100%; animation:shimmer 1.4s ease-in-out infinite; border-radius:4px; }
  @keyframes shimmer { from { background-position:100% 0; } to { background-position:-100% 0; } }
  .footer { text-align:center; margin-top:28px; padding:14px; color:rgba(255,255,255,0.45); font-size:11px; }
  .footer a { color:rgba(34,191,231,0.85); text-decoration:none; }
  .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(120px); background:linear-gradient(135deg, var(--neon-cyan), var(--neon-pink)); color:#fff; padding:11px 22px; border-radius:999px; font-family:'Audiowide',cursive; font-size:12px; letter-spacing:1.5px; box-shadow:0 12px 32px rgba(255,20,147,0.5), 0 0 22px rgba(34,191,231,0.4); z-index:100; transition:transform 0.3s cubic-bezier(.16,1.15,.3,1); }
  .toast.show { transform:translateX(-50%) translateY(0); }

  /* ============ SOCIAL CTA ============ */
  @keyframes social-hue{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  @keyframes social-pulse{0%,100%{box-shadow:0 0 28px rgba(34,191,231,0.15)}50%{box-shadow:0 0 44px rgba(255,20,147,0.22)}}
  .social-section{margin-top:22px;padding:22px 18px;border-radius:16px;position:relative;overflow:hidden;text-align:center;background:linear-gradient(135deg,rgba(34,191,231,0.10) 0%,rgba(255,20,147,0.10) 100%),rgba(13,0,20,0.7);border:1px solid rgba(34,191,231,0.35);animation:social-pulse 5s ease-in-out infinite}
  .social-eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#22BFE7;font-weight:800;text-shadow:0 0 10px rgba(34,191,231,0.5)}
  .social-title{font-size:22px;font-weight:900;margin-top:6px;background:linear-gradient(110deg,#00E5FF 0%,#fff 35%,#FF4FB6 70%,#00E5FF 100%);background-size:280% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:social-hue 6s linear infinite;text-transform:uppercase;letter-spacing:.5px}
  .social-sub{font-size:12px;color:#9999b3;margin:8px auto 16px;line-height:1.55;max-width:320px}
  .social-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .sbtn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:9px;font-size:13px;font-weight:700;text-decoration:none;color:#fff;transition:all .25s ease;cursor:pointer;border:1px solid transparent;min-width:130px;justify-content:center}
  .sbtn svg{flex-shrink:0;transition:transform .3s}
  .sbtn:hover svg{transform:scale(1.15) rotate(-5deg)}
  .sbtn-ig{background:linear-gradient(135deg,#f09433 0%,#dc2743 50%,#bc1888 100%);box-shadow:0 4px 14px rgba(220,39,67,0.4)}
  .sbtn-ig:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(220,39,67,0.6)}
  .sbtn-fb{background:linear-gradient(135deg,#1877f2,#0a5cc7);box-shadow:0 4px 14px rgba(24,119,242,0.4)}
  .sbtn-fb:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(24,119,242,0.6)}
  @media (prefers-reduced-motion:reduce){.social-section,.social-title{animation:none}.sbtn:hover{transform:none}}

  /* ============ MOVE TRACKER ============ */
  .mt-card{background:rgba(13,0,20,0.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(34,191,231,0.12);border-radius:14px;margin-bottom:10px;overflow:hidden;transition:border-color .25s,box-shadow .25s}
  .mt-card:hover{border-color:rgba(34,191,231,0.30)}
  .mt-card.open{border-color:rgba(34,191,231,0.5);box-shadow:0 14px 40px rgba(0,0,0,0.45)}
  .mt-card.just-submitted{border-color:rgba(34,191,231,0.55);animation:just-flash 1s ease-in-out 3}
  .mt-row{display:flex;align-items:center;gap:13px;padding:13px 14px;cursor:pointer}
  .mt-av{width:42px;height:42px;flex:none;border-radius:50%;background:linear-gradient(135deg,var(--neon-pink),var(--neon-cyan));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-family:'Audiowide',cursive;font-size:14px}
  .mt-main{flex:1;min-width:0}
  .mt-main .name{font-weight:600;font-size:14px;color:#fff}
  .mt-main .meta{font-size:11px;color:var(--muted);margin-top:2px}
  .mt-right{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
  .mt-chev{color:var(--muted);font-size:15px;line-height:1;transition:transform .2s}
  .mt-card.open .mt-chev{color:var(--neon-cyan);transform:rotate(180deg)}
  .mt-badge{display:inline-block;font-family:'Audiowide',cursive;font-size:9px;letter-spacing:1.2px;padding:4px 10px;border-radius:30px;white-space:nowrap}
  .mt-badge.live{background:rgba(255,20,147,0.14);color:var(--neon-pink-2);border:1px solid rgba(255,20,147,0.4)}
  .mt-badge.done{background:rgba(34,191,231,0.14);color:var(--neon-cyan-2);border:1px solid rgba(34,191,231,0.4)}
  .mt-badge.book{background:rgba(60,255,162,0.12);color:var(--neon-green);border:1px solid rgba(60,255,162,0.4)}
  .mt-badge.early{background:rgba(255,255,255,0.05);color:var(--muted);border:1px solid rgba(255,255,255,0.14)}
  .mt-road{position:relative;height:46px;margin:6px 18px 14px;display:none}
  .mt-card.open .mt-road{display:block}
  .mt-line{position:absolute;left:8px;right:8px;top:22px;height:4px;border-radius:3px;background:repeating-linear-gradient(90deg,#2a2336 0 10px,transparent 10px 20px)}
  .mt-fill{position:absolute;left:8px;top:22px;height:4px;border-radius:3px;background:linear-gradient(90deg,var(--neon-cyan),var(--neon-pink));width:8px;transition:width 1.3s cubic-bezier(.34,.7,.3,1)}
  .mt-tick{position:absolute;top:19px;width:9px;height:9px;border-radius:50%;background:var(--bg-1);border:2px solid #2a2336;transform:translateX(-50%);z-index:2}
  .mt-tick.done{background:var(--neon-cyan);border-color:var(--neon-cyan);box-shadow:0 0 6px rgba(34,191,231,0.55)}
  .mt-home{position:absolute;right:-3px;top:15px;color:var(--muted);font-size:17px}
  .mt-home.lit{color:var(--neon-cyan);text-shadow:0 0 8px rgba(34,191,231,0.6)}
  .mt-truck{position:absolute;top:-2px;left:8px;width:38px;transform:translateX(-50%);transition:left 1.3s cubic-bezier(.34,.7,.3,1);z-index:3;filter:drop-shadow(0 4px 7px rgba(0,0,0,0.5))}
  .mt-stagelabel{position:absolute;bottom:-3px;left:0;right:0;text-align:center;font-family:'Audiowide',cursive;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
  .mt-detail{display:none;border-top:1px solid rgba(34,191,231,0.12);padding:8px 18px 18px}
  .mt-card.open .mt-detail{display:block}
  .mt-tl{position:relative;margin-top:14px;padding-left:30px}
  .mt-tl::before{content:'';position:absolute;left:12px;top:6px;bottom:6px;width:2px;background:rgba(255,255,255,0.1)}
  .mt-step{position:relative;padding:0 0 16px}.mt-step:last-child{padding-bottom:0}
  .mt-tdot{position:absolute;left:-30px;top:0;width:26px;height:26px;border-radius:50%;background:var(--bg-1);border:2px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;z-index:2}
  .mt-step.done .mt-tdot{background:linear-gradient(135deg,var(--neon-cyan),var(--neon-pink));border-color:transparent;color:#fff}
  .mt-step.cur .mt-tdot{background:var(--bg-1);border-color:var(--neon-pink);color:var(--neon-pink);box-shadow:0 0 0 4px rgba(255,20,147,0.18)}
  .mt-stitle{color:#fff;font-weight:600;font-size:14px}
  .mt-step.future .mt-stitle{color:var(--muted);font-weight:500}
  .mt-step.cur .mt-stitle::after{content:'IN PROGRESS';font-family:'Audiowide',cursive;font-size:8px;letter-spacing:1px;color:var(--neon-pink);background:rgba(255,20,147,0.12);border:1px solid rgba(255,20,147,0.4);padding:2px 7px;border-radius:20px;margin-left:8px;vertical-align:1px;white-space:nowrap}
  .mt-sdesc{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5}
  .mt-stime{font-size:10.5px;color:var(--neon-cyan);font-family:'Audiowide',cursive;margin-top:3px;letter-spacing:.3px}
  .mt-review{margin-top:14px;border:1px solid rgba(34,191,231,0.14);border-radius:12px;overflow:hidden}
  .mt-rh{display:flex;align-items:center;gap:7px;padding:10px 13px;background:rgba(255,255,255,0.03);font-family:'Audiowide',cursive;font-size:11px;letter-spacing:1px;color:#fff}
  .mt-star{color:var(--neon-yellow)}
  .mt-rh-side{color:var(--muted);margin-left:auto;font-size:9px;letter-spacing:.5px}
  .mt-shot{position:relative;padding:12px;background:rgba(0,0,0,0.25)}
  .mt-shot img{display:block;width:100%;border-radius:8px}
  .mt-rev-rm{position:absolute;top:18px;right:18px;background:rgba(0,0,0,0.65);color:#fff;border:1px solid rgba(255,255,255,0.3);border-radius:6px;font-size:11px;padding:5px 9px;cursor:pointer}
  .mt-rev-empty{padding:18px 14px;text-align:center;color:var(--muted);font-size:12px;background:repeating-linear-gradient(45deg,rgba(255,255,255,0.025) 0 10px,transparent 10px 20px)}
  .mt-rev-empty b{display:block;color:var(--text);font-weight:600;margin-bottom:3px;font-size:13px}
  .mt-rev-actions{margin-top:10px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
  .mt-rev-add{background:linear-gradient(135deg,var(--neon-pink),#ff5da7);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-family:'Audiowide',cursive;font-size:10px;letter-spacing:1px;cursor:pointer}
  .mt-rev-or{font-size:11px;color:var(--muted)}
  .mt-optin{margin-top:14px;display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid rgba(255,20,147,0.25);border-radius:12px;background:linear-gradient(135deg,rgba(255,20,147,0.06),rgba(34,191,231,0.05));cursor:pointer}
  .mt-optin-txt{flex:1;min-width:0}
  .mt-optin-txt b{display:block;color:#fff;font-size:13px;font-weight:600}

<script>
'use strict';
async function api(action, payload) {
  const resp = await fetch('/api/' + encodeURIComponent(action), { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload||{}) });
  if (!resp.ok) {
    let body = null;
    try { body = await resp.json(); } catch(_) {}
    const msg = (body && body.error) || ('HTTP ' + resp.status);
    throw new Error(msg);
  }
  return resp.json();
}
function getSlug() { return new URLSearchParams(location.search).get('r') || ''; }
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}
function timeAgo(iso) {
  if (!iso) return '';
  var t = new Date(iso).getTime();
  if (isNaN(t)) return '';
  var mins = Math.floor((Date.now() - t) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  var hrs = Math.floor(mins/60);
  if (hrs < 24) return hrs + 'h ago';
  var days = Math.floor(hrs/24);
  if (days < 30) return days + 'd ago';
  var months = Math.floor(days/30);
  if (months < 12) return months + 'mo ago';
  return Math.floor(months/12) + 'y ago';
}
function fmtDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 1900);
}
var STATUS = {
  'new':       { color:'var(--neon-cyan)',   label:'UNBOOKED' },
  'contacted': { color:'var(--neon-pink)',   label:'CONTACTED' },
  'booked':    { color:'var(--neon-green)',  label:'BOOKED' },
  'completed': { color:'var(--neon-yellow)', label:'COMPLETED' }
};
function statusBadge(s) {
  var key = String(s||'new').toLowerCase();
  var c = STATUS[key] || STATUS['new'];
  return '<span class="badge" style="background:rgba(255,255,255,0.06);color:' + c.color + ';border:1px solid ' + c.color + ';text-shadow:0 0 6px ' + c.color + '">' + c.label + '</span>';
}
function tierFor(totals) {
  var t = (totals && totals.total) || 0;
  if (t >= 8)  return { label:'DIAMOND PARTNER',  color:'var(--neon-cyan)' };
  if (t >= 5)  return { label:'PLATINUM PARTNER', color:'#d6e4ff' };
  if (t >= 3)  return { label:'GOLD PARTNER',     color:'var(--neon-yellow)' };
  if (t >= 2)  return { label:'SILVER PARTNER',   color:'#cfd1e0' };
  if (t >= 1)  return { label:'BRONZE PARTNER',   color:'#d18a5b' };
  return                 { label:'NEW PARTNER',      color:'var(--neon-pink)' };
}
function countUp(el, target, prefix) {
  prefix = prefix || '';
  target = Number(target) || 0;
  if (target === 0) { el.textContent = prefix + '0'; return; }
  var start = performance.now();
  var dur = 900;
  function tick(now) {
    var p = Math.min(1, (now - start) / dur);
    p = 1 - Math.pow(1 - p, 3);
    el.textContent = prefix + Math.round(target * p);
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function renderError(msg) {
  document.getElementById('greet').textContent = 'Hmm...';
  document.getElementById('sub').textContent = '';
  document.getElementById('body').innerHTML = '<div class="err">' + escapeHtml(msg) + '</div>';
}
function render(view) {
  var r      = view.realtor || {};
  var leads  = Array.isArray(view.leads) ? view.leads : [];
  var totals = view.totals || {};
  var referrals = totals.total != null ? totals.total : leads.length;
  var pending   = totals.earnedPending != null ? totals.earnedPending : 0;
  var paid      = totals.earnedPaid != null  ? totals.earnedPaid  : 0;
  var moves     = totals.completed != null ? totals.completed : 0;
  var displayName = (String(r.name||'').trim() || r.firstName || 'partner');
  var tier = tierFor(totals);
  document.getElementById('greet').textContent = displayName.toUpperCase();
  var hs = document.getElementById('rheadshot');
  if (hs) {
    if (r.profilePic) { hs.style.backgroundImage = 'url("' + r.profilePic + '")'; hs.style.display = 'block'; }
    else { hs.style.display = 'none'; }
  }
  document.getElementById('sub').innerHTML =
    'Your referral dashboard ' +
    '<span class="tier" style="margin-left:8px;border-color:' + tier.color + ';color:' + tier.color + ';text-shadow:0 0 8px ' + tier.color + '">' +
      '<span class="dot" style="background:' + tier.color + ';box-shadow:0 0 8px ' + tier.color + '"></span>' + tier.label +
    '</span>';
  var justParam = new URLSearchParams(location.search).get('just') || '';
  var justLeadId = '';
  if (justParam && justParam !== '1') justLeadId = String(justParam);
  else if (justParam === '1' && leads.length) {
    var newest = leads[0];
    for (var i = 1; i < leads.length; i++) {
      if (new Date(leads[i].submittedAt) > new Date(newest.submittedAt)) newest = leads[i];
    }
    justLeadId = String(newest.id || '');
  }
  var slug = getSlug();
  var referUrl = '/refer?r=' + encodeURIComponent(slug);
  var portalLink = location.origin + '/move?r=' + encodeURIComponent(slug);
  var h = '';
  if (justParam) {
    h += '<div class="just-banner">Referral submitted - see it below</div>';
  }
  h += '<div class="stats">';
  h += '<div class="stat referrals"><div class="num" data-target="' + referrals + '">0</div><div class="lbl">Referrals</div></div>';
  h += '<div class="stat moves"><div class="num" data-target="' + moves + '">0</div><div class="lbl">Moved In</div></div>';
  h += '<div class="stat pending"><div class="num" data-target="' + pending + '" data-prefix="$">$0</div><div class="lbl">Pending</div></div>';
  h += '<div class="stat paid"><div class="num" data-target="' + paid + '" data-prefix="$">$0</div><div class="lbl">Paid</div></div>';
  h += '</div>';
  h += '<a class="cta" href="' + referUrl + '">Refer Someone New &nbsp;&rarr;</a>';
  h += '<div class="h">Your Pipeline</div>';
  if (!leads.length) {
    h += '<div class="empty"><div class="icon">.</div>No referrals yet. Share your link below to send your first one.</div>';
  } else {
    h += '<div class="mt-hint">Tap any client to follow their move, every step of the way.</div>';
    leads.forEach(function(l){
      try {
        h += mtCard(l, justLeadId);
      } catch (e) {
        var status = String(l.status || 'new').toLowerCase();
        var isJust = justLeadId && String(l.id) === justLeadId;
        h += '<div class="ref' + (isJust ? ' just-submitted' : '') + '" data-lead-id="' + escapeHtml(String(l.id||'')) + '">';
        h += '<div style="flex:1;min-width:0">';
        h += '<div class="name">' + escapeHtml(l.customerName || 'Unknown') + '</div>';
        var meta = [];
        if (l.moveSize) meta.push(escapeHtml(l.moveSize));
        if (l.moveDate) meta.push('Target: ' + escapeHtml(fmtDate(l.moveDate) || l.moveDate));
        if (meta.length) h += '<div class="meta">' + meta.join(' &middot; ') + '</div>';
        h += '</div>';
        h += '<div class="right">' + statusBadge(status) + '<span class="when">' + escapeHtml(timeAgo(l.submittedAt)) + '</span></div>';
        h += '</div>';
      }
    });
  }
  h += '<div class="linkcard">';
  h += '<h3>Your client referral link</h3>';
  h += '<div style="font-size:12px;color:#9aa0c8;margin:-6px 0 9px;line-height:1.5">Share with your buyers and sellers. They land on a page that shows <b>you</b> referred them, and you get the credit automatically.</div>';
  h += '<div class="url" id="urlBox">' + escapeHtml(portalLink) + '</div>';
  h += '<button onclick="copyLink()">Copy link</button>';
  h += '<button onclick="shareLink()">Share</button>';
  h += '</div>';
  h += '<details class="how"><summary>How it works</summary><div class="howbody">';
  h += '<div class="step"><b>1.</b> Share your link with anyone moving in the Skagit Valley.</div>';
  h += '<div class="step"><b>2.</b> They submit their info on your page. They get <b>$50 off</b> their move.</div>';
  h += '<div class="step"><b>3.</b> Once their move completes (moves over $1,000), you get a <b>$50 gift card</b> at month end.</div>';
  h += '<div class="step" style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(34,191,231,0.15);color:#888">';
  h += 'Status legend: <b style="color:var(--neon-cyan)">New</b> just submitted &middot; ';
  h += '<b style="color:var(--neon-pink)">Contacted</b> we\'ve reached out &middot; ';
  h += '<b style="color:var(--neon-green)">Booked</b> on the schedule &middot; ';
  h += '<b style="color:var(--neon-yellow)">Completed</b> gift card coming.</div>';
  h += '</div></details>';
  document.getElementById('body').innerHTML = h;
  document.querySelectorAll('.stat .num').forEach(function(el){
    var t = Number(el.getAttribute('data-target')) || 0;
    var p = el.getAttribute('data-prefix') || '';
    countUp(el, t, p);
  });
  try { mtInit(); } catch (e) { console.warn('move tracker init failed', e); }
  if (justLeadId) {
    setTimeout(function(){
      var row = document.querySelector('.mt-card.just-submitted, .ref.just-submitted');
      if (row && row.scrollIntoView) row.scrollIntoView({ behavior:'smooth', block:'center' });
      if (history.replaceState) {
        var clean = location.pathname + (getSlug() ? '?r=' + encodeURIComponent(getSlug()) : '');
        history.replaceState({}, '', clean);
      }
    }, 350);
  }
}
/* ===== Move Tracker (additive, self-contained, guarded) ===== */
var MT_TRUCK = '<svg viewBox="0 0 62 34" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="7" width="34" height="19" rx="2.5" fill="#f4f4ff" stroke="#FF1493" stroke-width="2"/><rect x="6" y="12" width="26" height="4" rx="1" fill="#FF1493"/><rect x="6" y="18" width="20" height="3" rx="1" fill="#22BFE7"/><path d="M36 13 h9 l7 8 v5 h-16 z" fill="#22BFE7" stroke="#0aa5d6" stroke-width="1.5"/><rect x="40" y="15.5" width="7" height="5" rx="1" fill="#bdeaff"/><circle cx="14" cy="28" r="4.4" fill="#0b0e12" stroke="#7a828c" stroke-width="1.6"/><circle cx="45" cy="28" r="4.4" fill="#0b0e12" stroke="#7a828c" stroke-width="1.6"/></svg>';
var MT_STAGES = ['Referral received','Contacted','Booked','Getting ready','Move day','Moved in'];
var MT_DESCS = [
  'We\'ve got your client — our team reaches out right away.',
  'We\'re in touch and putting their estimate together.',
  'Move date locked in. We\'ll keep you posted as it gets closer.',
  'Crew assigned, confirmation call, materials ready to go.',
  'On the truck and moving — your client is in great hands today.',
  'All settled in. Smooth, on time, taken care of.'
];
var MT_OFFICE = /[?&]office=1/i.test(location.search);
function mtInitials(name){
  var p = String(name||'').trim().split(/\s+/).filter(Boolean);
  if(!p.length) return '?';
  return ((p[0][0]||'') + (p.length>1 ? p[p.length-1][0] : '')).toUpperCase();
}
function mtStageData(l, status){
  var total=6, stage=1, label, badge='early';
  if(/^(lost|dead|cancel|declin|unqualif|not.?book|junk|no.?go)/.test(status)){
    return { stage:0, total:total, label:'Didn’t book this time — thanks for the intro!', badgeClass:'lost', badgeHtml:'<span class="mt-badge lost">Didn’t book</span>', lost:true };
  }
  if(status==='completed'){ stage=6; label='All moved in' + (l.moveDate ? ' · ' + (fmtDate(l.moveDate)||'') : ''); badge='done'; }
  else if(status==='booked'){
    stage=3; label='Booked' + (l.moveDate ? ' · move ' + (fmtDate(l.moveDate)||'') : ' — date locked'); badge='book';
    var md = l.moveDate ? new Date(l.moveDate) : null;
    if(md && !isNaN(md.getTime())){
      var today=new Date(); today.setHours(0,0,0,0);
      var d0=new Date(md.getFullYear(),md.getMonth(),md.getDate());
      var diff=Math.round((d0 - today)/86400000);
      if(diff<=0 && diff>-2){ stage=5; label='Move day — on the truck now'; badge='live'; }
      else if(diff>0 && diff<=3){ stage=4; label='Getting ready · move ' + (fmtDate(l.moveDate)||''); badge='live'; }
    }
  }
  else if(status==='contacted'){ stage=2; label='In touch — quoting their move'; badge='live'; }
  else { stage=1; label='Referral received — we\'re on it'; badge='early'; }
  var btxt = { early:'Unbooked', live:'In progress', book:'Booked', done:'★ Moved in' }[badge];
  return { stage:stage, total:total, label:label, badgeClass:badge, badgeHtml:'<span class="mt-badge '+badge+'">'+btxt+'</span>' };
}
function mtTimes(l, completed){
  var t=['','','','','',''];
  if(l.submittedAt) t[0]=fmtDate(l.submittedAt)||'';
  if(l.moveDate){ var d=fmtDate(l.moveDate)||''; t[4]=d; if(completed) t[5]=d; }
  return t;
}
function mtTimeline(sd, l){
  if(sd.lost){
    var t0=(l.submittedAt?(fmtDate(l.submittedAt)||''):'');
    return '<div class="mt-tl">'
      + '<div class="mt-step done"><div class="mt-tdot">✓</div><div class="mt-stitle">Referral received</div><div class="mt-sdesc">Thanks for sending them our way — we reached out.</div>'+(t0?'<div class="mt-stime">'+escapeHtml(t0)+'</div>':'')+'</div>'
      + '<div class="mt-step lost"><div class="mt-tdot">—</div><div class="mt-stitle">Didn’t book this time</div><div class="mt-sdesc">This one didn’t end up moving with us — it happens. We appreciate the introduction and we’re ready for the next one.</div></div>'
      + '</div>';
  }
  var cur=sd.stage, done=(sd.badgeClass==='done'), times=mtTimes(l, done);
  var html='<div class="mt-tl">';
  MT_STAGES.forEach(function(name,i){
    var n=i+1, st = done ? 'done' : (n<cur ? 'done' : (n===cur ? 'cur' : 'future'));
    html+='<div class="mt-step '+st+'"><div class="mt-tdot">'+(st==='done'?'✓':(st==='cur'?'●':'·'))+'</div>';
    html+='<div class="mt-stitle">'+escapeHtml(name)+'</div>';
    html+='<div class="mt-sdesc">'+MT_DESCS[i]+'</div>';
    if(times[i]) html+='<div class="mt-stime">'+escapeHtml(times[i])+'</div>';
    html+='</div>';
  });
  return html+'</div>';
}
function mtReviewSlotHtml(id){
  return '<div class="mt-review"><div class="mt-rh"><span class="mt-star">★</span> Customer review <span class="mt-rh-side">added by Neon Giant</span></div>'
    + '<div class="mt-rev-body" data-rev-body="'+escapeHtml(id)+'"></div></div>';
}
function mtOptInHtml(id){
  return '<label class="mt-optin"><span class="mt-optin-txt"><b>📲 Keep me posted on this move</b>'
    + '<span>Get a quick text as your client moves through each step — so you can check in and look like a hero. (Your client isn’t texted.)</span></span>'
    + '<span class="mt-switch"><input type="checkbox" data-optin-cb="'+escapeHtml(id)+'"><span class="mt-slider"></span></span></label>';
}
function mtCard(l, justLeadId){
  var status = String(l.status||'new').toLowerCase();
  var sd = mtStageData(l, status);
  var id = String(l.id||'');
  var idA = escapeHtml(id);
  var isJust = justLeadId && id === String(justLeadId);
  var openCls = '';
  var lostCls = sd.lost ? ' lost' : '';
  var meta=[];
  if(l.moveSize) meta.push(escapeHtml(l.moveSize));
  if(l.moveDate) meta.push('Move ' + escapeHtml(fmtDate(l.moveDate)||l.moveDate));
  var metaHtml = meta.length ? '<div class="meta">'+meta.join(' · ')+'</div>' : '';
  var h = '<div class="mt-card'+(isJust?' just-submitted':'')+openCls+lostCls+'" data-lead-id="'+idA+'">';
  h += '<div class="mt-row" data-mt-toggle><div class="mt-av">'+escapeHtml(mtInitials(l.customerName))+'</div>';
  h += '<div class="mt-main"><div class="name">'+escapeHtml(l.customerName||'Unknown')+'</div>'+metaHtml+'</div>';
  h += '<div class="mt-right">'+sd.badgeHtml+'<div class="mt-chev">▾</div></div></div>';
  var ticks='';
  for(var ti=1; ti<sd.total; ti++){ var tp=ti/sd.total; ticks += '<div class="mt-tick'+(ti<=sd.stage?' done':'')+'" style="left:calc(8px + '+(tp*100)+'% - '+(tp*16)+'px)"></div>'; }
  h += '<div class="mt-road" data-stage="'+sd.stage+'" data-total="'+sd.total+'"><div class="mt-line"></div><div class="mt-fill"></div>'+ticks
     + '<div class="mt-home'+(sd.stage>=sd.total?' lit':'')+'">⌂</div><div class="mt-truck"></div>'
     + '<div class="mt-stagelabel">'+escapeHtml(sd.label)+'</div></div>';
  var detail = mtTimeline(sd,l);
  if(status==='completed') detail += mtReviewSlotHtml(id);
  if(!sd.lost && status!=='completed') detail += mtOptInHtml(id);
  h += '<div class="mt-detail">'+detail+'</div>';
  h += '</div>';
  return h;
}
function mtGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function mtSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function mtDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function mtEsc(id){ return (window.CSS && CSS.escape) ? CSS.escape(id) : String(id).replace(/"/g,''); }
function mtRenderReview(id){
  var body = document.querySelector('[data-rev-body="'+mtEsc(id)+'"]'); if(!body) return;
  var data = mtGet('ngmt_rev_'+id);
  if(data){
    body.innerHTML = '<div class="mt-shot"><img src="'+data+'" alt="Customer review">'+(MT_OFFICE?'<button class="mt-rev-rm" data-rev-rm="'+escapeHtml(id)+'">Remove</button>':'')+'</div>';
  } else if(MT_OFFICE){
    body.innerHTML = '<div class="mt-rev-empty"><b>No review yet</b><span>Office only — drop your client’s review screenshot here.</span>'
      + '<div class="mt-rev-actions"><button class="mt-rev-add" data-rev-add="'+escapeHtml(id)+'">+ Add screenshot</button>'
      + '<span class="mt-rev-or">or click here &amp; paste (Ctrl/Cmd+V)</span></div>'
      + '<input type="file" accept="image/*" data-rev-file="'+escapeHtml(id)+'" style="display:none"></div>';
  } else {
    body.innerHTML = '<div class="mt-rev-empty"><b>Review coming soon</b><span>Once your client leaves a review, it’ll show up right here.</span></div>';
  }
}
function mtSaveImage(dataUrl, id){
  if(!mtSet('ngmt_rev_'+id, dataUrl)){ showToast('Image too large to store'); return; }
  mtRenderReview(id); showToast('Review added');
}
function mtReadFile(file, id){
  if(!file || String(file.type).indexOf('image')!==0){ showToast('Please choose an image'); return; }
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      try{
        var maxW=900, scale=Math.min(1, maxW/img.width);
        var w=Math.round(img.width*scale), hgt=Math.round(img.height*scale);
        var c=document.createElement('canvas'); c.width=w; c.height=hgt;
        c.getContext('2d').drawImage(img,0,0,w,hgt);
        mtSaveImage(c.toDataURL('image/jpeg',0.85), id);
      }catch(e){ mtSaveImage(fr.result, id); }
    };
    img.onerror=function(){ mtSaveImage(fr.result, id); };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function mtBind(){
  if(window.__mtBound) return; window.__mtBound=true;
  var body=document.getElementById('body'); if(!body) return;
  body.addEventListener('click', function(e){
    var add=e.target.closest('[data-rev-add]');
    if(add){ var fa=body.querySelector('[data-rev-file="'+mtEsc(add.getAttribute('data-rev-add'))+'"]'); if(fa) fa.click(); return; }
    var rm=e.target.closest('[data-rev-rm]');
    if(rm){ mtDel('ngmt_rev_'+rm.getAttribute('data-rev-rm')); mtRenderReview(rm.getAttribute('data-rev-rm')); return; }
    var rev=e.target.closest('.mt-review');
    if(rev){ var b=rev.querySelector('[data-rev-body]'); if(b) window.__mtActiveRev=b.getAttribute('data-rev-body'); return; }
    if(e.target.closest('.mt-optin')) return;
    var row=e.target.closest('[data-mt-toggle]');
    if(row){ var card=row.closest('.mt-card'); if(card){ var op=card.classList.toggle('open'); if(op){ mtDrive(card.querySelector('.mt-road')); } } }
  });
  body.addEventListener('change', function(e){
    var f=e.target.closest('[data-rev-file]');
    if(f && f.files && f.files[0]){ mtReadFile(f.files[0], f.getAttribute('data-rev-file')); return; }
    var cb=e.target.closest('[data-optin-cb]');
    if(cb){ mtSet('ngmt_sms_'+cb.getAttribute('data-optin-cb'), cb.checked?'1':'0'); showToast(cb.checked?'You’ll get text updates on this move':'Text updates off'); }
  });
  document.addEventListener('paste', function(e){
    var id=window.__mtActiveRev; if(!id || mtGet('ngmt_rev_'+id)) return;
    var items=(e.clipboardData && e.clipboardData.items) || [];
    for(var i=0;i<items.length;i++){ if(items[i].type && items[i].type.indexOf('image')===0){ var blob=items[i].getAsFile(); if(blob){ mtReadFile(blob, id); e.preventDefault(); break; } } }
  });
}
function mtRestore(){
  document.querySelectorAll('[data-optin-cb]').forEach(function(cb){ if(mtGet('ngmt_sms_'+cb.getAttribute('data-optin-cb'))==='1') cb.checked=true; });
  document.querySelectorAll('[data-rev-body]').forEach(function(b){ mtRenderReview(b.getAttribute('data-rev-body')); });
}
function mtPlace(){
  document.querySelectorAll('.mt-truck').forEach(function(t){ t.innerHTML=MT_TRUCK; });
  document.querySelectorAll('.mt-road').forEach(function(r){ var tk=r.querySelector('.mt-truck'), fl=r.querySelector('.mt-fill'); if(tk) tk.style.left='8px'; if(fl) fl.style.width='8px'; });
  setTimeout(function(){
    document.querySelectorAll('.mt-road').forEach(function(r){
      var s=+r.getAttribute('data-stage'), tot=+r.getAttribute('data-total')||6;
      var pct=Math.max(0,Math.min(1, s/tot));
      var tk=r.querySelector('.mt-truck'), fl=r.querySelector('.mt-fill');
      if(tk) tk.style.left='calc(8px + '+(pct*100)+'% - '+(pct*16)+'px)';
      if(fl) fl.style.width='calc('+(pct*100)+'% - '+(pct*16)+'px)';
    });
  }, 260);
}
function mtDrive(road){
  if(!road) return;
  var s=+road.getAttribute('data-stage'), tot=+road.getAttribute('data-total')||6;
  var pct=Math.max(0,Math.min(1, s/tot));
  var tk=road.querySelector('.mt-truck'), fl=road.querySelector('.mt-fill');
  if(tk){ tk.innerHTML=MT_TRUCK; tk.style.left='8px'; }
  if(fl) fl.style.width='8px';
  setTimeout(function(){
    if(tk) tk.style.left='calc(8px + '+(pct*100)+'% - '+(pct*16)+'px)';
    if(fl) fl.style.width='calc('+(pct*100)+'% - '+(pct*16)+'px)';
  }, 60);
}
function mtInit(){ mtBind(); mtRestore(); mtPlace(); }

async function load() {
  var slug = getSlug();
  if (!slug) {
    renderError('Your portal link is missing the realtor ID. Please use the link your Neon Giant contact sent you.');
    return;
  }
  var view;
  try { view = await api('getRealtorPortalView', { slug: slug }); }
  catch (err) {
    console.error('load failed', err);
    renderError("We couldn't load your dashboard right now. Please try again, or call us at (360) 588-4700.");
    return;
  }
  if (!view || !view.ok) {
    renderError((view && view.error) || "This referral link isn't recognized. Double-check the URL, or reach out to your Neon Giant contact.");
    return;
  }
  render(view);
}
window.copyLink = async function() {
  var box = document.getElementById('urlBox');
  var url = box ? box.textContent : '';
  try { await navigator.clipboard.writeText(url); showToast('Link copied!'); }
  catch (e) {
    var tmp = document.createElement('input');
    tmp.value = url; document.body.appendChild(tmp); tmp.select();
    try { document.execCommand('copy'); showToast('Link copied!'); }
    catch (_) { showToast('Long-press to copy.'); }
    document.body.removeChild(tmp);
  }
};
window.shareLink = async function() {
  var box = document.getElementById('urlBox');
  var url = box ? box.textContent : '';
  var text = "Here's my referral page for Neon Giant Moving. Use it to get $50 off your move:\n" + url;
  if (navigator.share) {
    try { await navigator.share({ title:'Neon Giant Moving Referral', text:text, url:url }); }
    catch (_) {}
  } else {
    try { await navigator.clipboard.writeText(text); showToast('Share message copied!'); }
    catch (_) { showToast('Long-press to copy.'); }
  }
};
load();
