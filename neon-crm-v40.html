<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--p:#e33b93;--b:#22aee4;--d:#08080d;--d2:#10101a;--d3:#1a1a28;--d4:#24243a;--g:#8888aa;--w:#f0f0f5;--gn:#33cc66;--o:#ff9933;--r:#ff3366;--gold:#ffd700}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--d);color:var(--w);font-family:'Outfit',system-ui,sans-serif}
[style*="background:#fff"],[style*="background:#fde8e8"],[style*="background:#fff8e1"],[style*="background:#e8f5e9"],[style*="background:#f3e8fd"],[style*="background:#e3f2fd"],[style*="background:#e0f2fe"]{color:#222}
button{font-family:inherit;cursor:pointer}select,input,textarea{font-family:inherit}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--d2)}::-webkit-scrollbar-thumb{background:var(--d3)}
a{color:var(--b);text-decoration:none}
.hdr{padding:10px 16px;display:flex;ahlign-items:center;justify-content:space-between;border-bottom:1px solid var(--d3);position:sticky;top:0;z-index:100;background:rgba(8,8,13,.92);backdrop-filter:blur(16px)}
.hdr-l{display:flex;align-items:center;gap:10px}.logo{height:40px;border-radius:5px}
.brd{font-size:17px;font-weight:800}.brd-s{font-size:9px;color:var(--g);letter-spacing:.1em;text-transform:uppercase}
.hdr-r{display:flex;gap:6px;align-items:center}
.btn-k{background:var(--d3);border:none;color:var(--g);padding:8px 10px;border-radius:8px;font-size:11px}
.btn-log{border:none;color:#fff;padding:11px 20px;border-radius:10px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--p),var(--b));box-shadow:0 3px 16px #e33b9333}
.tabs{display:flex;border-bottom:1px solid var(--d3);padding:0 16px;overflow-x:auto}
.tab{padding:11px 14px;font-size:12px;font-weight:600;color:var(--g);border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--p);border-bottom-color:var(--p)}.tab:hover{color:var(--w)}
.sts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 16px}
.st{background:var(--d2);border-radius:10px;padding:12px;border:1px solid var(--d3)}
.st b{font-size:22px;font-weight:800;display:block}.st small{font-size:10px;color:var(--g);text-transform:uppercase}
.cnt{padding:0 16px 100px;max-width:1100px;margin:0 auto}
.flt{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.flt input,.flt select{background:var(--d2);border:1px solid var(--d3);color:var(--w);padding:9px 12px;border-radius:9px;font-size:12px;outline:none}.flt input{flex:1 1 160px;min-width:120px}
.cr{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
.ch{padding:6px 14px;border-radius:20px;font-size:11px;font-weight:600;background:var(--d2);color:var(--g);border:1px solid var(--d3);cursor:pointer;white-space:nowrap;flex-shrink:0}
.ch.on{background:#e33b9322;color:var(--p);border-color:#e33b9355}
.cd{background:var(--d2);border-radius:11px;padding:13px 15px;border:1px solid var(--d3);margin-bottom:7px;cursor:pointer;border-left:3px solid var(--g)}
.cd:hover{border-color:#22aee433}
.cd-t{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.nm{font-size:14px;font-weight:700}.rl{color:var(--g);font-size:11px;margin-top:1px}.bz{color:#e33b93bb}
.mt{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}.mt span{font-size:10px;color:var(--g)}.rf{color:var(--p)!important}
.dy{text-align:right;flex-shrink:0}.dy b{font-size:17px;font-weight:800;display:block}.dy small{font-size:9px;color:var(--g)}
.bg{display:inline-block;font-size:9px;padding:2px 7px;border-radius:8px;font-weight:600;margin-left:5px}
.tb{display:inline-block;font-size:9px;padding:2px 7px;border-radius:8px;font-weight:700;margin-left:4px;background:#22aee422;color:var(--b);border:1px solid #22aee444}
.rb{display:inline-flex;align-items:center;gap:3px;font-size:9px;padding:2px 7px;border-radius:7px;background:#ff993322;color:var(--o);border:1px solid #ff993344;margin-top:3px}
.tt{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--d2);border:1px solid var(--d3);color:var(--w);padding:10px 20px;border-radius:10px;font-size:13px;z-index:2000;display:none;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.tt.ok{border-color:var(--gn);color:var(--gn)}.tt.er{border-color:var(--r);color:var(--r)}
.ld{text-align:center;padding:60px}.sp{width:40px;height:40px;margin:0 auto 14px;border:3px solid var(--d3);border-top-color:var(--b);border-radius:50%;animation:spin .8s linear infinite}

/* Panel */
.ov{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.75);display:none}.ov.op{display:flex;justify-content:flex-end}
.pn{width:min(520px,100%);background:var(--d);height:100%;overflow-y:auto;border-left:1px solid var(--d3)}
.ph{padding:16px 20px;border-bottom:1px solid var(--d3);display:flex;justify-content:space-between;align-items:flex-start}
.px{background:var(--d3);border:none;color:var(--g);font-size:15px;width:30px;height:30px;border-radius:7px}
.pb{padding:18px 20px}
.ps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.pst{background:var(--d2);border-radius:9px;padding:10px 8px;text-align:center}
.pst b{font-size:18px;font-weight:800;display:block}.pst small{font-size:9px;color:var(--g);display:block;margin-top:2px}

/* Action buttons in profile */
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px}
.act{background:var(--d2);border:1px solid var(--d3);border-radius:10px;padding:10px 6px;text-align:center;font-size:10px;font-weight:600;color:var(--g);display:flex;flex-direction:column;align-items:center;gap:4px}
.act:hover{border-color:var(--b);color:var(--w);background:var(--d3)}
.act svg{opacity:.7}

.pi{background:var(--d2);border-radius:9px;padding:13px 15px;margin-bottom:12px}
.pi h5{font-size:12px;font-weight:600;color:var(--b);margin-bottom:8px}
.pr{display:flex;justify-content:space-between;margin-bottom:5px;font-size:12px}.pr .k{color:var(--g)}.pr a{color:var(--b)}
.vi{background:var(--d2);border-radius:9px;padding:11px 13px;margin-bottom:7px;border-left:3px solid var(--b)}
.vi .vd{color:var(--b);font-size:11px;font-weight:600}.vi .vh{color:var(--g);font-size:11px}
.vi .vn{color:var(--w);font-size:12px;line-height:1.5;margin-top:4px}
.rs{background:var(--d2);border-radius:9px;padding:13px 15px;margin-bottom:12px;border:1px dashed var(--o)}
.rs h5{color:var(--o);font-size:12px;margin-bottom:7px}
.ri{display:flex;align-items:center;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid var(--d3)}.ri:last-child{border:none}
.rdot{width:5px;height:5px;border-radius:50%;background:var(--o);flex-shrink:0}
.ri-x{background:none;border:none;color:var(--r);font-size:10px;padding:2px 6px;border-radius:4px}
.ri-x:hover{background:#ff336622}
.cis{background:var(--d2);border-radius:9px;padding:13px 15px;margin-bottom:12px}
.cis h5{font-size:12px;font-weight:600;color:var(--b);margin-bottom:8px}
.cis img{max-width:100%;border-radius:8px;border:1px solid var(--d3)}

/* Quick visit */
.qf{background:var(--d2);border-radius:9px;padding:14px;margin-bottom:12px;border:1px solid var(--b)}
.qf h5{color:var(--b);font-size:12px;margin-bottom:10px}

/* Edit form */
.ef{background:var(--d2);border-radius:9px;padding:14px;margin-bottom:12px;border:1px solid var(--p)}
.ef h5{color:var(--p);font-size:12px;margin-bottom:10px}

/* Forms */
.fg{margin-bottom:10px}.fg label{display:block;font-size:11px;color:var(--g);margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.fg input,.fg select,.fg textarea{width:100%;background:var(--d2);border:1px solid var(--d3);color:var(--w);padding:9px 11px;border-radius:8px;font-size:13px;outline:none}
.fg textarea{min-height:50px;resize:vertical}.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--b)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bs{width:100%;padding:11px;border:none;border-radius:10px;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--p),var(--b));margin-top:6px}
.bc{width:100%;padding:9px;border:1px solid var(--d3);border-radius:10px;font-size:13px;font-weight:600;color:var(--g);background:none;margin-top:4px}
.bsm{padding:7px 14px;border:none;border-radius:8px;font-size:12px;font-weight:600;color:#fff;background:var(--d3)}
.bdel{background:none;border:1px solid var(--r);color:var(--r);padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600}
.bdel:hover{background:#ff336622}
.mic{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--b));border:none;position:relative;box-shadow:0 0 25px #e33b9333;margin:0 auto;display:block}
.mic svg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.mic.rc{animation:mp 1.5s ease-in-out infinite}
@keyframes mp{0%,100%{box-shadow:0 0 25px #e33b9333}50%{box-shadow:0 0 50px #e33b9388}}
.lb{display:inline-flex;align-items:center;gap:7px;background:#e33b9322;padding:5px 14px;border-radius:14px;border:1px solid #e33b9344}
.ld2{width:8px;height:8px;border-radius:50%;background:var(--p);animation:pulse 1s infinite}
.mc{background:var(--d2);border:2px solid var(--b);border-radius:10px;padding:12px;margin:8px 0;cursor:pointer}.mc:hover{background:var(--d3)}.mc.sl{border-color:var(--p);background:#e33b9311}
.ca{width:100%;max-width:380px;margin:0 auto;border-radius:12px;overflow:hidden;background:var(--d2);border:2px dashed var(--d4)}
.ca video{width:100%;display:block}.ca canvas{display:none}
.cb{width:56px;height:56px;border-radius:50%;background:var(--w);border:4px solid var(--d3);margin:10px auto;display:block;position:relative}
.cb:active{transform:scale(.9)}.cb::after{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--w);border:2px solid var(--d)}

/* Tier tab */
.tier-sec{margin-bottom:20px}
.tier-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:8px 0;border-bottom:1px solid var(--d3)}
.tier-hdr b{font-size:14px}.tier-hdr small{color:var(--g);font-size:11px}
.tier-stars{color:var(--gold)}

/* Map */
#mapBox{width:100%;height:420px;border-radius:11px;overflow:hidden;border:1px solid var(--d3);margin:12px 0}
.leaflet-container{background:var(--d)!important}
.map-lbl{background:transparent;border:none;font-family:'Outfit',sans-serif;white-space:nowrap}.map-lbl div{text-align:center}
.ml-n{font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.9)}.ml-c{font-size:10px;font-weight:800;color:#e33b93;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.ml-s{padding:1px 7px;background:var(--b);border-radius:5px;color:#fff}
.neon-pop .leaflet-popup-content-wrapper{background:var(--d2);color:var(--w);border:1px solid var(--d3);border-radius:9px;font-family:'Outfit',sans-serif}
.neon-pop .leaflet-popup-tip{background:var(--d2)}.neon-pop .leaflet-popup-content{margin:9px 13px;font-size:12px;line-height:1.5}

/* Fullscreen overlay */
.fs{position:fixed;inset:0;z-index:1000;background:var(--d);display:none;flex-direction:column;overflow:auto}
.fs.op{display:flex}
.fsh{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--d3);flex-shrink:0}
.fsx{background:none;border:none;color:var(--g);font-size:13px}
.fsb{flex:1;overflow:auto;padding:18px}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){.sts{grid-template-columns:1fr 1fr}.brd{font-size:14px}#mapBox{height:320px}.ps{grid-template-columns:repeat(2,1fr)}.acts{grid-template-columns:repeat(2,1fr)}}
input[type="date"],input[type="time"]{color-scheme:dark;cursor:pointer}input[type="date"]::-webkit-calendar-picker-indicator,input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(1) brightness(2);cursor:pointer;opacity:0.9}
.vw{display:flex;gap:4px;margin:8px 0;padding:2px;background:var(--d2);border-radius:8px;border:1px solid var(--d3)}
.vb{flex:1;padding:8px;border:none;background:transparent;color:var(--g);font-size:12px;font-weight:600;border-radius:6px;cursor:pointer}
.vb.on{background:var(--p);color:#fff}
.fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:var(--p);color:#fff;font-size:28px;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(227,59,147,0.4);z-index:50;display:flex;align-items:center;justify-content:center}

@media (max-width: 600px) { #dpStickyNext { position: sticky; top: 0; z-index: 100; background: linear-gradient(135deg,#33cc66,#2aa050); color:#fff; padding: 12px 14px; margin: -10px -10px 14px; border-radius: 0 0 12px 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.4); display:block; } .dp-mobile-actionbar a, .dp-mobile-actionbar button { font-size: 16px !important; min-height: 50px; } } @media (min-width: 601px) { #dpStickyNext { display: none; } }
</style>

const GOOGLE_CLIENT_ID='275867918182-o5eu6mthngrgegkesvm68rlsrotvu1qv.apps.googleusercontent.com';
let GMAIL_TOKEN=sessionStorage.getItem('neon_gmail_tok')||'';
let GMAIL_EMAIL=sessionStorage.getItem('neon_gmail_email')||'';
let GMAIL_NAME=sessionStorage.getItem('neon_gmail_name')||'';
let _tokenClient=null;

function initGoogleAuth(){
  if(!window.google||!window.google.accounts){setTimeout(initGoogleAuth,500);return}
  _tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:GOOGLE_CLIENT_ID,
    scope:'https://www.googleapis.com/auth/gmail.send openid email profile',
    callback:async function(resp){
      if(resp.error){tt('Sign-in failed: '+resp.error,'er');return}
      GMAIL_TOKEN=resp.access_token;
      sessionStorage.setItem('neon_gmail_tok',GMAIL_TOKEN);
      try{
        const info=await(await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+GMAIL_TOKEN}})).json();
        GMAIL_EMAIL=info.email;GMAIL_NAME=info.name||info.given_name||info.email.split('@')[0];
        sessionStorage.setItem('neon_gmail_email',info.email);
        sessionStorage.setItem('neon_gmail_name',GMAIL_NAME);
        autoLoginFromEmail(info.email);
      }catch(e){tt('Could not load Google profile: '+e.message,'er')}
    }
  });
}
function signInWithGoogle(){
  if(!_tokenClient){initGoogleAuth();setTimeout(signInWithGoogle,1000);return}
  _tokenClient.requestAccessToken({prompt:''});
}
function autoLoginFromEmail(email){
  const namePart=email.split('@')[0].toLowerCase();
  const allNames=['Dane','Jeff','Tyler','Valentina','Luke','Carlos','Marshall','Samuel','Ryan','William','Charles','Michael'];
  const matched=allNames.find(n=>n.toLowerCase()===namePart);
  if(!matched){tt('Email not recognized: '+email+'. Add to team first.','er');return}
  CU={name:matched,email:email,role:'Member',gmailAuth:true};
  sessionStorage.setItem('neon_user',JSON.stringify(CU));
  document.getElementById('loginOv').style.display='none';
  if(typeof updateUserUI==='function')updateUserUI();
  if(typeof load==='function')load();
  tt('Signed in as '+matched,'ok');
}
const _origAP_email=aP;
window.aP=async function(d){
  if(d&&d.action==='sendEmail'&&GMAIL_TOKEN){
    try{return await sendEmailViaGmail(d)}
    catch(e){
      if(String(e).indexOf('401')>=0||String(e).toLowerCase().indexOf('expired')>=0){
        sessionStorage.removeItem('neon_gmail_tok');GMAIL_TOKEN='';
        tt('Gmail token expired — sign in again','er');
      }
      throw e;
    }
  }
  return _origAP_email(d);
};
async function sendEmailViaGmail(d){
  const fromHeader=GMAIL_NAME?GMAIL_NAME+' <'+GMAIL_EMAIL+'>':GMAIL_EMAIL;
  const lines=['From: '+fromHeader,'To: '+d.to,'Subject: '+d.subject,'MIME-Version: 1.0','Content-Type: text/plain; charset=UTF-8','',d.body];
  const raw=lines.join('\r\n');
  const b64=btoa(unescape(encodeURIComponent(raw))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const r=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{
    method:'POST',
    headers:{Authorization:'Bearer '+GMAIL_TOKEN,'Content-Type':'application/json'},
    body:JSON.stringify({raw:b64})
  });
  const j=await r.json();
  if(j.error){throw new Error(j.error.code+': '+j.error.message)}
  _origAP_email({action:'logSentEmail',to:d.to,subject:d.subject,body:d.body,contactId:d.contactId,sender:GMAIL_EMAIL,gmailMessageId:j.id}).catch(function(){});
  return {ok:true,sender:GMAIL_EMAIL,messageId:j.id};
}

function setLbRange(preset){
  const now=new Date();const y=now.getFullYear();const m=now.getMonth();
  const fmt=(d)=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  if(preset==='thisMonth'){lbFrom=fmt(new Date(y,m,1));lbTo=fmt(now);}
  else if(preset==='lastMonth'){lbFrom=fmt(new Date(y,m-1,1));lbTo=fmt(new Date(y,m,0));}
  else if(preset==='last7'){const a=new Date(now.getTime()-7*86400000);lbFrom=fmt(a);lbTo=fmt(now);}
  else if(preset==='thisYear'){lbFrom=y+'-01-01';lbTo=fmt(now);}
  else if(preset==='lastYear'){lbFrom=(y-1)+'-01-01';lbTo=(y-1)+'-12-31';}
  else if(preset==='all'){lbFrom='2020-01-01';lbTo=fmt(now);}
  ren();
}

async function plDoSendInvite(){

async function sendCompose(cid,channel){
  const c=D.find(x=>+x.id===+cid);if(!c)return;
  const body=(document.getElementById('cmpBody')||{}).value||'';
  if(!body.trim()){tt('Message body empty','er');return}
  if(channel==='sms'){
    if(!c.phone){tt('No phone on file','er');return}
    const num=String(c.phone).replace(/[^\d+]/g,'');
    window.location.href='sms:'+num+(navigator.userAgent.match(/iPhone|iPad/)?'&':'?')+'body='+encodeURIComponent(body);
    tt('Opening messages app...','ok');
    return;
  }
  if(channel==='email'){
    if(!c.email){tt('No email on file','er');return}
    const subj=(document.getElementById('cmpSubj')||{}).value||'(no subject)';
    const sender=(CU&&CU.name)?CU.name:'';
    tt('Sending email...','ok');
    try{
      const r=await aP({action:'sendEmail',to:c.email,subject:subj,body:body,contactId:+cid,sender:sender});

      else{tt('Send failed: '+(r&&r.error?r.error:'unknown'),'er')}
    }catch(e){tt('Send failed: '+e.message,'er')}
  }
}

function gcAiRemix(){
  const msg=document.getElementById('gcMsg');
  const current=msg.value;
  if(!current.trim()){alert('Write or select a template first');return;}
  // Simple AI-style remixing: shuffle sentence structure, swap synonyms
  const greetings=['Hi','Hey','Hello','Good morning','Good afternoon'];
  const closes=['Talk soon','Looking forward to hearing from you','Hope to see you soon','Best','Cheers','Warmly'];
  const connectors=['Just wanted to','Wanted to','Reaching out to','Dropping a note to'];
  const g=greetings[Math.floor(Math.random()*greetings.length)];
  const cl=closes[Math.floor(Math.random()*closes.length)];
  const cn=connectors[Math.floor(Math.random()*connectors.length)];
  let remixed=current;
  remixed=remixed.replace(/^(Hi|Hey|Hello|Good morning|Good afternoon)/,g);
  remixed=remixed.replace(/(Talk soon|Looking forward[^,\n]*|Hope to see you soon|Best|Cheers|Warmly|Gratefully)/,cl);
  remixed=remixed.replace(/(Just wanted to|Wanted to|Reaching out to|Dropping a note to)/,cn);
  // Small word swaps
  const swaps=[['great','awesome'],['love to','really like to'],['stop by','swing by'],['pop in','come by'],['quick','short'],['chat','catch up']];
  swaps.forEach(([a,b])=>{
    if(Math.random()>.5){
      if(remixed.includes(a))remixed=remixed.replace(a,b);
      else if(remixed.includes(b))remixed=remixed.replace(b,a);
    }
  });
  msg.value=remixed;
}

function _resizeImg(dataUrl,maxDim,q){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const orig={w:img.width,h:img.height};let curMax=maxDim||900,curQ=q||0.75;const LIMIT=47000;function attempt(){let w=orig.w,h=orig.h;if(w>curMax||h>curMax){if(w>=h){h=Math.round(h*curMax/w);w=curMax}else{w=Math.round(w*curMax/h);h=curMax}}const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);return cv.toDataURL('image/jpeg',curQ)}let out=attempt();let tries=0;while(out.length>LIMIT&&tries<8){if(curQ>0.4)curQ=Math.max(0.4,curQ-0.1);else curMax=Math.round(curMax*0.85);out=attempt();tries++}res(out)};img.onerror=rej;img.src=dataUrl})}

var _avpE=null;
function pickAvatarFromCardEdit(){
  let cardSrc=(typeof eCardData==='string'&&eCardData)?eCardData:'';
  if(!cardSrc){const cp=document.getElementById('eCardPrev');if(cp&&cp.getAttribute('src'))cardSrc=cp.src;}
  if(!cardSrc){tt('No business card on this contact yet','er');return}
  const ov=document.createElement('div');ov.id='avpEOv';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px';
  ov.innerHTML='<div style="background:#1a1a1a;border-radius:12px;padding:16px;max-width:480px;width:100%;text-align:center"><div style="color:#fff;font-size:14px;margin-bottom:8px;font-weight:600">Pick the face for the avatar</div><canvas id="avpECv" style="border:2px solid var(--b);border-radius:8px;display:block;touch-action:none;max-width:100%;margin:0 auto"></canvas><div style="display:flex;gap:8px;margin-top:10px;justify-content:center;flex-wrap:wrap"><button class="bsm" style="background:#33cc66;color:#fff" onclick="_avatarPickerEditApply()">✓ Use as Avatar</button><button class="bsm" onclick="_avatarPickerEditClose()">Cancel</button></div><div style="font-size:11px;color:var(--g);margin-top:6px">Drag the circle over the face. Drag the corner dot to resize.</div></div>';
  document.body.appendChild(ov);
  const img=new Image();
  img.onload=function(){
    const maxW=Math.min(window.innerWidth-80,440);
    const scale=Math.min(maxW/img.width,1);
    const dw=Math.round(img.width*scale),dh=Math.round(img.height*scale);
    const canvas=document.getElementById('avpECv');canvas.width=dw;canvas.height=dh;
    const ctx=canvas.getContext('2d');
    let size=Math.min(dw,dh)*0.5,bx=(dw-size)/2,by=Math.min(dh*0.08,Math.max(0,dh-size));
    _avpE={img:img,canvas:canvas,ctx:ctx,scale:scale,box:{x:bx,y:by,size:size},mode:'',ox:0,oy:0};
    _drawAvatarOverlayE();
    function getPt(e){const r=canvas.getBoundingClientRect();const sx=canvas.width/r.width,sy=canvas.height/r.height;const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left,cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;return[cx*sx,cy*sy]}
    function down(e){e.preventDefault();const[x,y]=getPt(e);const b=_avpE.box;if(Math.hypot(x-(b.x+b.size),y-(b.y+b.size))<28){_avpE.mode='resize'}else if(x>b.x&&x<b.x+b.size&&y>b.y&&y<b.y+b.size){_avpE.mode='move';_avpE.ox=x-b.x;_avpE.oy=y-b.y}else{_avpE.mode=''}}
    function move(e){if(!_avpE.mode)return;e.preventDefault();const[x,y]=getPt(e);const b=_avpE.box;if(_avpE.mode==='move'){b.x=Math.max(0,Math.min(canvas.width-b.size,x-_avpE.ox));b.y=Math.max(0,Math.min(canvas.height-b.size,y-_avpE.oy))}else if(_avpE.mode==='resize'){let ns=Math.max(30,Math.max(x-b.x,y-b.y));ns=Math.min(ns,canvas.width-b.x,canvas.height-b.y);b.size=ns}_drawAvatarOverlayE()}
    function up(){_avpE.mode=''}
    canvas.addEventListener('mousedown',down);canvas.addEventListener('mousemove',move);window.addEventListener('mouseup',up);
    canvas.addEventListener('touchstart',down,{passive:false});canvas.addEventListener('touchmove',move,{passive:false});canvas.addEventListener('touchend',up);
  };
  img.src=cardSrc;
}
function _drawAvatarOverlayE(){
  const s=_avpE;if(!s)return;const ctx=s.ctx,cw=s.canvas.width,ch=s.canvas.height,b=s.box;
  ctx.clearRect(0,0,cw,ch);ctx.drawImage(s.img,0,0,cw,ch);
  ctx.save();ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,cw,ch);
  ctx.beginPath();ctx.arc(b.x+b.size/2,b.y+b.size/2,b.size/2,0,2*Math.PI);ctx.closePath();
  ctx.globalCompositeOperation='destination-out';ctx.fill();ctx.restore();
  ctx.beginPath();ctx.arc(b.x+b.size/2,b.y+b.size/2,b.size/2,0,2*Math.PI);ctx.strokeStyle='#33cc66';ctx.lineWidth=3;ctx.stroke();
  ctx.beginPath();ctx.arc(b.x+b.size,b.y+b.size,11,0,2*Math.PI);ctx.fillStyle='#33cc66';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
}
function _avatarPickerEditApply(){
  const s=_avpE;if(!s){_avatarPickerEditClose();return}
  const b=s.box,inv=1/s.scale;
  const out=document.createElement('canvas');out.width=256;out.height=256;
  out.getContext('2d').drawImage(s.img,b.x*inv,b.y*inv,b.size*inv,b.size*inv,0,0,256,256);

function rIX(mc){
  const me=(CU&&CU.name)?CU.name:'';
  // My reminders: due/overdue assigned to me
  const today=new Date().toISOString().slice(0,10);

      h+='<div style="margin-top:6px;display:flex;gap:6px"><button class="bsm" style="background:var(--gn);color:#fff" onclick="compRem('+r.id+')">'+String.fromCodePoint(0x2713)+' Complete</button>';
      if(c)h+='<button class="bsm" onclick="oP('+c.id+')">View Contact</button>';
      h+='</div></div>';
    });
    h+='</div>';
  }

  // Due today
  if(dueToday.length){
    h+='<div style="background:#fff8e1;border-radius:10px;padding:12px;margin-bottom:12px">';
    h+='<div style="font-weight:700;color:var(--o);margin-bottom:8px">'+String.fromCodePoint(0x1F4CC)+' Due Today ('+dueToday.length+')</div>';
    dueToday.forEach(r=>{const c=D.find(x=>+x.id===+r.contactId);
      h+='<div style="background:#fff;border-radius:8px;padding:10px;margin-bottom:6px;border-left:4px solid var(--o)">';
      h+='<div style="font-weight:600">'+r.text+'</div>';
      h+='<div style="font-size:11px;color:var(--g);margin-top:3px">'+(r.dueTime?String.fromCodePoint(0x23F0)+' '+r.dueTime+' \u00b7 ':'')+(c?(c.name||c.business):'')+'</div>';
      h+='<div style="margin-top:6px;display:flex;gap:6px"><button class="bsm" style="background:var(--gn);color:#fff" onclick="compRem('+r.id+')">'+String.fromCodePoint(0x2713)+' Complete</button>';
      if(c)h+='<button class="bsm" onclick="oP('+c.id+')">View Contact</button>';
      h+='</div></div>';

  }

  // Upcoming reminders
  if(upcoming.length){

      h+=' <span style="color:var(--g);font-size:11px">\u00b7 '+r.dueDate+(c?' \u00b7 '+(c.name||c.business):'')+'</span>';
      h+='</div>';
    });
    if(upcoming.length>10)h+='<div style="font-size:11px;color:var(--g);margin-top:4px">+'+(upcoming.length-10)+' more</div>';
    h+='</div>';
  }

  // No-date reminders
  if(noDue.length){
    h+='<div style="background:#f3e8fd;border-radius:10px;padding:12px;margin-bottom:12px">';

      h+='</div>';
    });

  // Sent messages

  // ---- Inbound Messages ----
  const _ixKey=(m)=>m.id||m.threadId||m.messageId||(m.fromEmail+'|'+m.date);
  const _q=(ixFilter||'').toLowerCase();
  const visibleIM = IM.filter(m=>{const isHidden=ixHidden[_ixKey(m)];if(isHidden && !ixShowHidden)return false;if(!isHidden && ixShowHidden)return false;if(_q){const blob=((m.contactName||'')+' '+(m.fromEmail||'')+' '+(m.subject||'')+' '+(m.snippet||'')+' '+(m.business||'')).toLowerCase();if(blob.indexOf(_q)===-1)return false;}return true;});
  const hiddenCount = IM.filter(m=>ixHidden[_ixKey(m)]).length;

    const dt=m.date?new Date(m.date):null;

    const nm=m.contactName||m.fromEmail||'Unknown';

    const snip=(m.snippet||'').substring(0,120);
    const cid=m.contactId;
    const key=_ixKey(m);
    const hideBtn=ixShowHidden
      ? '<button onclick="event.stopPropagation();ixUnhide(\''+String(key).replace(/'/g,"\\'")+'\')" style="background:transparent;border:1px solid var(--gn);color:var(--gn);border-radius:5px;padding:2px 8px;font-size:10px;cursor:pointer;margin-left:6px">↩ Restore</button>'

    return '<div style="background:#fff;border-radius:8px;padding:10px 12px;margin-bottom:6px;border-left:4px solid #22aee4">'

      +'<div style="font-size:12px;color:#333;margin-top:4px;font-weight:600;cursor:pointer" onclick="'+(cid?'oP('+cid+')':'')+'">'+subj+'</div>'
      +'<div style="font-size:11px;color:#888;margin-top:2px;cursor:pointer" onclick="'+(cid?'oP('+cid+')':'')+'">'+snip+(snip.length>=120?'...':'')+'</div>'
      +'</div>';
  }).join('') : '<div style="color:#888;font-size:12px;padding:8px">'+(ixShowHidden?'No hidden messages':(ixFilter?'No messages match filter':'Inbox clear \u2014 no inbound messages'))+'</div>';
  const ixToolbar='<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px">'
    +'<input value="'+(ixFilter||'').replace(/"/g,"&quot;")+'" placeholder="Filter inbox..." oninput="ixSetFilter(this.value)" style="flex:1;min-width:120px;padding:5px 8px;border:1px solid #bbd;border-radius:5px;font-size:12px">'
    +'<button onclick="ixToggleHidden()" style="background:'+(ixShowHidden?'var(--gn)':'#fff')+';color:'+(ixShowHidden?'#fff':'#333')+';border:1px solid #bbd;border-radius:5px;padding:5px 10px;font-size:11px;cursor:pointer">'+(ixShowHidden?'← Back to Inbox':('Show Hidden ('+hiddenCount+')'))+'</button>'
    +(IM.length>0&&!ixShowHidden?'<button onclick="ixClearAll()" style="background:#fff;color:#c44;border:1px solid #c44;border-radius:5px;padding:5px 10px;font-size:11px;cursor:pointer">🗑 Hide All</button>':'')
    +'</div>';
  h+='<div style="background:#e0f2fe;border-radius:10px;padding:12px;margin-bottom:12px"><div style="font-weight:700;margin-bottom:8px;color:#222">\u{1F4E8} Inbound Messages <span style="font-size:11px;font-weight:400;color:#666">(last 30 days)</span></div>'+ixToolbar+inboundHtml+'</div>';
  // ---- Group Compose Button ----
  h+='<div style="margin-bottom:12px"><button class="bs" onclick="showGroupCompose()" style="width:100%">\u{1F4E2} Territory Group Email</button></div>';

  // Quick stats
  const myContacts=D.filter(c=>(c.handler||'').toLowerCase()===me.toLowerCase());
  const myVisits=V.filter(v=>(v.handler||'').toLowerCase()===me.toLowerCase());
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">';
  h+='<div style="flex:1;min-width:100px;background:#fff;border-radius:10px;padding:12px;text-align:center"><div style="font-size:22px;font-weight:800;color:var(--p)">'+myContacts.length+'</div><div style="font-size:11px;color:var(--g)">My Contacts</div></div>';
  h+='<div style="flex:1;min-width:100px;background:#fff;border-radius:10px;padding:12px;text-align:center"><div style="font-size:22px;font-weight:800;color:var(--b)">'+myVisits.length+'</div><div style="font-size:11px;color:var(--g)">My Visits</div></div>';
  h+='<div style="flex:1;min-width:100px;background:#fff;border-radius:10px;padding:12px;text-align:center"><div style="font-size:22px;font-weight:800;color:var(--o)">'+myRem.length+'</div><div style="font-size:11px;color:var(--g)">My Tasks</div></div>';
  h+='<div style="flex:1;min-width:100px;background:#fff;border-radius:10px;padding:12px;text-align:center"><div style="font-size:22px;font-weight:800;color:var(--gn)">'+myMsgs.length+'</div><div style="font-size:11px;color:var(--g)">Sent</div></div>';
  h+='</div>';

  h+='</div>';
  mc.innerHTML=h;
}

async function tlLoad(){
  const territories = Array.from(document.querySelectorAll('input[name=tlT]:checked')).map(function(x){return x.value;});
  const types = Array.from(document.querySelectorAll('input[name=tlY]:checked')).map(function(x){return x.value;});
  const result = document.getElementById('tlResult');
  result.innerHTML = '<div style="text-align:center;padding:30px;color:var(--g)">Loading top leads...</div>';
  try {
    const r = await aP({action:'topUncaptured', opts:{limit: 25, territories: territories.length?territories:null, types: types}});
    if(!r.ok) { result.innerHTML='<div style="color:var(--r);padding:20px;background:#311;border-radius:8px">Error: '+(r.error||'?')+'</div>'; return; }
    const items = r.items||[];
    if(!items.length){ result.innerHTML='<div style="padding:20px;color:var(--g);text-align:center">No locations match. Try clearing territory filters.</div>'; return; }
    const rows = items.map(function(it, i){
      const cap = it.unitCount ? it.unitCount+' units' : (it.bedCount ? it.bedCount+' beds' : '');
      const yr = it.yearOpened ? 'opened '+it.yearOpened : '';
      const note = it.enrichmentNotes ? '<div style="color:#aaa;font-size:11px;margin-top:4px">'+String(it.enrichmentNotes).substring(0,180)+'</div>' : '';
      const dayBadge = it.daysSince==null ? '<span style="color:#33cc66">never visited</span>' : (it.daysSince+' days ago');
      const tierBadge = (it.tier && String(it.tier).indexOf('Tier')>=0) ? '<span style="background:#4a0080;padding:2px 6px;border-radius:4px;font-size:10px;margin-left:6px">'+it.tier+'</span>' : '';

async function dpEnhanceWithRoute(plan, stops, baseCoords, stopCoords, summaryId, mapId, stopsId, totalStopMin, lunchMin){
  const summaryEl = document.getElementById(summaryId);
  function setSummary(stopCount, stopMin, driveMin, miles, lunch){
    const dayOverhead = 15; const totalMin = stopMin + driveMin + (lunch||0) + dayOverhead;
    const hours = Math.floor(totalMin/60);
    const mins = Math.round(totalMin) % 60;
    summaryEl.innerHTML =
      '<div style="background:var(--d2);padding:14px;border-radius:8px;text-align:center"><div style="font-size:10px;color:var(--g);letter-spacing:1px">STOPS</div><div style="font-size:24px;font-weight:700">'+stopCount+'</div></div>'+
      '<div style="background:var(--d2);padding:14px;border-radius:8px;text-align:center"><div style="font-size:10px;color:var(--g);letter-spacing:1px">DAY DURATION</div><div style="font-size:24px;font-weight:700">'+hours+'h '+mins+'m</div></div>'+
      '<div style="background:var(--d2);padding:14px;border-radius:8px;text-align:center"><div style="font-size:10px;color:var(--g);letter-spacing:1px">DRIVE TIME</div><div style="font-size:24px;font-weight:700">'+Math.round(driveMin)+' min</div></div>'+
      '<div style="background:var(--d2);padding:14px;border-radius:8px;text-align:center"><div style="font-size:10px;color:var(--g);letter-spacing:1px">DISTANCE</div><div style="font-size:24px;font-weight:700">'+miles+' mi</div></div>';
  }
  // Initial estimate (will be replaced once OSRM responds)
  setSummary(stops.length, totalStopMin, Math.round((stops.length*15+30)*1.15), Math.round(stops.length*8+30), lunchMin);
  const allCoords = [baseCoords].concat(stopCoords);
  const coordStr = allCoords.map(function(c){return c[1]+','+c[0]}).join(';');
  let routeData = null;
  try{
    const resp = await fetch('https://router.project-osrm.org/trip/v1/driving/'+coordStr+'?source=first&roundtrip=true&overview=full&geometries=geojson');
    routeData = await resp.json();
  }catch(e){}
  const mapEl = document.getElementById(mapId);
  if(!mapEl) return;
  if(window.__dpMap){try{window.__dpMap.remove()}catch(e){}}
  const map = L.map(mapId).setView([baseCoords[0]+0.1, baseCoords[1]+0.1], 10);
  window.__dpMap = map;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'OSM', maxZoom: 18}).addTo(map);
  L.marker(baseCoords).bindPopup('<b>BASE</b><br/>23528 Old Day Creek Rd<br/>Sedro Woolley').addTo(map);
  let optimalOrder = stops.map(function(_, i){return i});
  if(routeData && routeData.code === 'Ok' && routeData.waypoints){
    const orderMap = routeData.waypoints.map(function(w, i){return {inputIdx: i, visitOrder: w.waypoint_index}});
    orderMap.sort(function(a,b){return a.visitOrder - b.visitOrder});
    optimalOrder = orderMap.filter(function(o){return o.inputIdx > 0}).map(function(o){return o.inputIdx - 1});
  }
  optimalOrder.forEach(function(stopIdx, displayIdx){
    const c = stopCoords[stopIdx];
    const s = stops[stopIdx];
    const numIcon = L.divIcon({
      className: 'dp-marker',
      html: '<div style="background:#ff0080;color:white;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,.5);font-size:13px">'+(displayIdx+1)+'</div>',
      iconSize: [30,30], iconAnchor: [15,15]
    });
    L.marker(c, {icon:numIcon}).bindPopup('<b>STOP '+(displayIdx+1)+'</b><br/>'+s.name+(s.business&&s.business!==s.name?'<br/>'+s.business:'')+'<br/><i>'+s.territory+'</i>').addTo(map);
  });
  if(routeData && routeData.code === 'Ok' && routeData.trips && routeData.trips[0]){
    const trip = routeData.trips[0];
    const geom = trip.geometry;
    if(geom && geom.coordinates){
      const latlngs = geom.coordinates.map(function(c){return [c[1], c[0]]});
      L.polyline(latlngs, {color:'#ff0080', weight:4, opacity:0.7}).addTo(map);
      // Apply 15% traffic padding to OSRM raw drive time
      const driveMin = (trip.duration / 60) * 1.10;
      const miles = trip.distance / 1609.34;
      setSummary(stops.length, totalStopMin, driveMin, miles.toFixed(1), lunchMin);
      const stopsEl = document.getElementById(stopsId);
      if(stopsEl){
        window.__dpOptimalStops = optimalOrder.map(function(idx){return stops[idx]});
        stopsEl.innerHTML = optimalOrder.map(function(stopIdx, displayIdx){
          return dpRenderStop(stops[stopIdx], displayIdx);
        }).join('');
      }
      setTimeout(function(){
        try{ map.fitBounds(L.polyline(latlngs).getBounds(), {padding: [30,30]}) }catch(e){}
      }, 200);
    }
  } else {
    setTimeout(function(){
      try{
        const fg = L.featureGroup(stopCoords.map(function(c){return L.marker(c)}));
        map.fitBounds(fg.getBounds(), {padding:[30,30]});
      }catch(e){}
    }, 100);
  }
}

async function dpOpenInMaps(){
  const planEl = document.getElementById('dpPlan');
  if(!planEl){tt('Generate a plan first','er');return}
  // Reach into the rendered plan to grab stops in their displayed order
  // Re-derive from the most recent generation: use window.__dpLastPlan
  const plan = window.__dpLastPlan;
  if(!plan){tt('Generate a plan first','er');return}
  const baseLat = 48.504, baseLon = -122.236;
  // Build waypoints in OSRM-optimized order if available, otherwise input order
  const stops = window.__dpOptimalStops || plan.stops;
  const wpoints = stops.map(function(s){
    if(s.lat && s.lon) return s.lat+','+s.lon;
    if(s.addr) return encodeURIComponent(s.addr);
    return encodeURIComponent((s.business||s.name)+' '+s.territory+' WA');
  }).join('|');
  const url = 'https://www.google.com/maps/dir/?api=1'+
    '&origin='+baseLat+','+baseLon+
    '&destination='+baseLat+','+baseLon+
    '&waypoints='+wpoints+
    '&travelmode=driving';
  window.open(url, '_blank');
}

async function dpDownloadPDF(){
  const planEl = document.getElementById('dpPlan');
  if(!planEl){tt('Generate a plan first','er');return}
  if(typeof html2pdf === 'undefined'){
    tt('Loading PDF engine...', 'ok');
    await new Promise(function(resolve){
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
      s.onload = resolve;
      document.head.appendChild(s);
    });
  }
  tt('Generating PDF...', 'ok');
  await html2pdf().set({margin:0.3, filename:'day-plan.pdf', image:{type:'jpeg',quality:0.95}, html2canvas:{scale:2,useCORS:true,allowTaint:true}, jsPDF:{unit:'in',format:'letter',orientation:'portrait'}}).from(planEl).save();
  tt('PDF downloaded','ok');
}

  if (typeof __origDpRender === 'function') { window.dpRender = function (plan) { const html = __origDpRender(plan); setTimeout(function () { try { dpFetchUnifiedAddons(plan).then(dpRenderUnifiedAddons); } catch (e) { console.error('unified addons err', e); } }, 1000); return html; }; }

  // V53 - Outreach Queue + AI drafts modal + geolocation
  window.tlShowOutreachQueue = async function () {
    const result = document.getElementById("tlResult");

      const cards = list.map(function (p, i) { const ratingChip = p.googleRating ? '<span style="font-size:10px;color:#fc6">\u2B50 ' + p.googleRating + '</span>' : ''; const statusChip = '<span style="font-size:10px;background:#444;color:#ccc;padding:2px 6px;border-radius:4px">' + (p.status||'new') + '</span>'; const phoneLink = p.phone ? '<a href="tel:' + p.phone + '" style="font-size:10px;color:#7af">\u260E ' + p.phone + '</a>' : ''; return '<div style="background:#0a1428;border:1px solid #4dc9a3;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:12px"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px"><div style="font-weight:700;font-size:13px;color:#fff">' + (p.name||'') + '</div>' + statusChip + '</div><div style="color:#9fc;font-size:10px">' + (p.type||'') + ' \u00b7 ' + (p.territory||'') + '</div><div style="color:#9fc;font-size:10px">' + (p.address||'') + '</div><div style="display:flex;gap:8px;flex-wrap:wrap">' + ratingChip + phoneLink + '</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px"><button class="bs" onclick="tlDraftOutreachOpen(' + i + ')" style="padding:6px 10px;font-size:11px">\u270D Draft outreach</button><button class="bs" onclick="tlMarkContacted(' + i + ')" style="padding:6px 10px;font-size:11px;background:#444">\u2713 Mark contacted</button><button class="bs" onclick="tlPromoteProspect(' + i + ')" style="padding:6px 10px;font-size:11px;background:#1a6b4d">\u2192 Add to CRM</button></div></div>'; }).join('');
      result.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div style="font-size:14px;color:#9fe"><b>\u{1F4CB} OUTREACH QUEUE</b> \u00b7 ' + list.length + ' prospects</div><button class="bs" onclick="tlLoad()" style="padding:6px 12px;font-size:11px">\u2190 Top Leads</button></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px">' + cards + '</div>';
    } catch (e) { result.innerHTML = '<div style="color:#f88;padding:20px">Error: ' + e.message + '</div>'; }
  };
  window.tlDraftOutreachOpen = function (idx) { const p = (window.__tlProspects || [])[idx]; if (!p) return; let modal = document.getElementById('tlDraftModal'); if (modal) modal.remove(); modal = document.createElement('div'); modal.id = 'tlDraftModal'; modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px'; modal.innerHTML = '<div style="background:#0a1428;border:1px solid #4dc9a3;border-radius:12px;padding:18px;max-width:600px;width:100%;max-height:90vh;overflow:auto"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div style="font-size:14px;color:#9fe"><b>Draft outreach for ' + (p.name||'') + '</b></div><button onclick="document.getElementById(\'tlDraftModal\').remove()" style="background:none;border:none;color:#999;font-size:24px;cursor:pointer">\u00d7</button></div><div style="display:flex;gap:6px;margin-bottom:10px"><button class="bs" onclick="tlDraftOutreachRun(' + idx + ', \'email\')" style="padding:6px 12px;font-size:11px">\u2709 Email</button><button class="bs" onclick="tlDraftOutreachRun(' + idx + ', \'sms\')" style="padding:6px 12px;font-size:11px">\u{1F4F1} Text</button><button class="bs" onclick="tlDraftOutreachRun(' + idx + ', \'cold-call\')" style="padding:6px 12px;font-size:11px">\u260E Cold call</button></div><div id="tlDraftBody" style="background:#000;color:#cfc;padding:12px;border-radius:8px;font-size:12px;font-family:monospace;white-space:pre-wrap;min-height:160px">Pick a channel above\u2026</div><div id="tlDraftActions" style="margin-top:10px;display:none"><button class="bs" id="tlDraftCopyBtn" style="padding:6px 12px;font-size:11px">\u{1F4CB} Copy</button></div></div>'; document.body.appendChild(modal); };
  window.tlDraftOutreachRun = async function (idx, channel) { const p = (window.__tlProspects || [])[idx]; if (!p) return; const body = document.getElementById('tlDraftBody'); const actions = document.getElementById('tlDraftActions'); if (body) body.textContent = 'Generating ' + channel + ' draft\u2026 (~10s)'; if (actions) actions.style.display = 'none'; try { const r = await aP({ action: 'draftOutreach', lead: { name: p.name, type: p.type, address: p.address, googleRating: p.googleRating, reviewCount: p.reviewCount, unitCount: p.unitCount, bedCount: p.bedCount }, channel: channel }); if (!r.ok) { if (body) body.textContent = 'Error: ' + (r.error || 'unknown'); return; } if (body) body.textContent = r.draft; if (actions) { actions.style.display = 'block'; const copyBtn = document.getElementById('tlDraftCopyBtn'); if (copyBtn) copyBtn.onclick = async function () { try { await navigator.clipboard.writeText(r.draft); copyBtn.textContent = '\u2713 Copied'; setTimeout(function () { copyBtn.textContent = '\u{1F4CB} Copy'; }, 1500); } catch (e) {} }; } } catch (e) { if (body) body.textContent = 'Error: ' + e.message; } };
  window.tlMarkContacted = async function (idx) { const p = (window.__tlProspects || [])[idx]; if (!p) return; try { await aP({ action: 'updateProspect', prospect: { id: p.id, status: 'contacted' } }); tlShowOutreachQueue(); } catch (e) { alert('Failed: ' + e.message); } };
  window.tlPromoteProspect = async function (idx) { const p = (window.__tlProspects || [])[idx]; if (!p) return; if (!confirm('Promote ' + p.name + ' to a Location in your CRM?')) return; try { const r = await aP({ action: 'convertProspectToLocation', id: p.id }); alert(r.ok ? ('\u2713 Added as Location id ' + r.locationId) : ('Failed: ' + r.error)); tlShowOutreachQueue(); } catch (e) { alert('Failed: ' + e.message); } };
  const __origTlLoad = window.tlLoad;
  if (typeof __origTlLoad === 'function') { window.tlLoad = async function () { await __origTlLoad(); setTimeout(function () { const result = document.getElementById('tlResult'); if (!result || result.querySelector('#tlOutreachQueueBtn')) return; const btnRow = document.createElement('div'); btnRow.style.cssText = 'margin-bottom:12px;text-align:right'; btnRow.innerHTML = '<button id="tlOutreachQueueBtn" class="bs" onclick="tlShowOutreachQueue()" style="padding:6px 12px;font-size:11px">\u{1F4CB} View outreach queue</button>'; result.insertBefore(btnRow, result.firstChild); }, 300); }; }
  const __origDpToggleStop = window.dpToggleStop;
  window.dpToggleStop = async function (stopId, visited) { if (!visited) return __origDpToggleStop(stopId, visited); if (!navigator.geolocation) return __origDpToggleStop(stopId, visited); const stop = (window.__dpLastPlan && window.__dpLastPlan.stops || []).find(function (s) { return s && s.id === stopId; }); if (!stop || stop.lat == null || stop.lon == null) return __origDpToggleStop(stopId, visited); try { const pos = await new Promise(function (resolve, reject) { navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }); }); const lat1 = pos.coords.latitude, lon1 = pos.coords.longitude; const lat2 = +stop.lat, lon2 = +stop.lon; const R = 6371000; const dLat = (lat2-lat1) * Math.PI / 180, dLon = (lon2-lon1) * Math.PI / 180; const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2; const dist = 2 * R * Math.asin(Math.sqrt(a)); if (dist > 250) { if (!confirm('You appear to be ' + Math.round(dist) + 'm from ' + (stop.name||'this stop') + '. Mark as visited anyway?')) return; } } catch (e) {} return __origDpToggleStop(stopId, visited); };
})();
