<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{background:#0a0a0f;color:#fff;font-family:system-ui;padding:20px}button{background:#e33b93;color:#fff;border:none;padding:12px 20px;border-radius:8px;font-size:14px;margin:6px;cursor:pointer}pre{background:#111;padding:12px;border-radius:8px;font-size:11px;white-space:pre-wrap;margin:10px 0;max-height:300px;overflow:auto}.ok{color:#33cc66}.er{color:#ff3366}</style>
</head><body>
<h2 style="color:#e33b93">Tier Save Test</h2>
<p>This tests saving a tier directly to the API</p>

<button onclick="testRead()">1. Read All Contacts</button>
<button onclick="testUpdateTier()">2. Update Contact ID 2 to Tier 2</button>
<button onclick="testReadAfter()">3. Read Again to Verify</button>

<pre id="log">Click buttons in order...</pre>

<script>
const API='https://script.google.com/macros/s/AKfycbzb6lGzPT0-VSiHRi5pfyhGlWSHqueX6-mlcfrEoCp-kql3d-8jdLi122RFk2T4qPAMEw/exec';

function log(msg,type){
  const el=document.getElementById('log');
  const cls=type==='ok'?'ok':type==='er'?'er':'';
  el.innerHTML+=`<span class="${cls}">${new Date().toLocaleTimeString()}: ${msg}</span>\n`;
  el.scrollTop=el.scrollHeight;
}

async function testRead(){
  log('Reading contacts...','');
  try{
    const r=await fetch(API+'?action=getAll');
    const d=await r.json();
    const contacts=d.contacts||[];
    contacts.forEach(c=>{
      log(`ID ${c.id}: ${c.name} | type="${c.type}" | tier="${c.tier}" | score=${c.score}`,'ok');
    });
    log('Total: '+contacts.length+' contacts','ok');
  }catch(e){log('Failed: '+e.message,'er')}
}

async function testUpdateTier(){
  log('Updating contact ID 2 (Dane) to Tier 2...','');
  const data={action:'updateContact',contact:{id:2,tier:'Tier 2'}};
  log('Sending: '+JSON.stringify(data),'');
  try{
    const r=await fetch(API,{method:'POST',body:JSON.stringify(data),headers:{'Content-Type':'text/plain'}});
    const txt=await r.text();
    log('Status: '+r.status,'');
    log('Response: '+txt,'');
    try{
      const j=JSON.parse(txt);
      if(j.success) log('✅ SUCCESS!','ok');
      else log('Response: '+JSON.stringify(j),'er');
    }catch(e){log('Not JSON: '+txt.substring(0,200),'er')}
  }catch(e){log('Failed: '+e.message,'er')}
}

async function testReadAfter(){
  log('Reading contacts again to verify...','');
  try{
    const r=await fetch(API+'?action=getAll');
    const d=await r.json();
    const dane=(d.contacts||[]).find(c=>+c.id===2);
    if(dane){
      log(`Dane's tier is now: "${dane.tier}"`,dane.tier==='Tier 2'?'ok':'er');
    }else log('Could not find ID 2','er');
  }catch(e){log('Failed: '+e.message,'er')}
}
</script>
</body></html>
