<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Portal | Neon Giant Moving</title>
<meta name="description" content="Your Neon Giant Moving referral dashboard — track referrals, see your earnings.">
<meta name="theme-color" content="#1a0033">
<link rel="icon" href="/logo.jpg">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #1a0033 0%, #4a0080 50%, #ff0080 100%);
    background-attachment: fixed;
    min-height: 100vh;
    color: #fff;
    padding: 16px 12px 48px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    max-width: 560px;
    margin: 20px auto;
    background: #0a0a0a;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 16px 48px rgba(0,0,0,0.5);
  }
  /* ----- header ----- */
  .hdr {
    background: linear-gradient(135deg, #1a0033 0%, #4a0080 50%, #ff0080 100%);
    padding: 26px 22px 22px;
    text-align: center;
    position: relative;
  }
  .hdr img.logo { width: 56px; height: 56px; border-radius: 12px; background: #000; padding: 4px; object-fit: contain; }
  .hdr .brand { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; margin-top: 8px; opacity: 0.85; }
  .hdr .biz { font-size: 18px; font-weight: 800; margin-top: 2px; }
  .hdr .greet { font-size: 22px; font-weight: 800; margin-top: 14px; }
  .hdr .sub { font-size: 13px; opacity: 0.9; margin-top: 4px; }
  /* ----- body ----- */
  .body { padding: 20px 18px 24px; }
  /* ----- stat tiles ----- */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 18px;
  }
  .stat {
    background: #1a1a1a;
    padding: 12px 8px;
    border-radius: 10px;
    text-align: center;
  }
  .stat .num { font-size: 24px; font-weight: 800; line-height: 1.1; }
  .stat .lbl { font-size: 9px; color: #888; letter-spacing: 1px; margin-top: 3px; text-transform: uppercase; }
  .stat.referrals .num { color: #ff0080; }
  .stat.pending  .num { color: #33cc66; }
  .stat.paid     .num { color: #ffaa00; }
  /* ----- section heads ----- */
  .h {
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #ff0080;
    margin: 18px 0 8px;
    font-weight: 700;
  }
  /* ----- referral rows ----- */
  .ref {
    background: #1a1a1a;
    padding: 12px 14px;
    border-radius: 10px;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .ref .name { font-weight: 600; font-size: 14px; color: #fff; }
  .ref .meta { font-size: 11px; color: #888; margin-top: 2px; }
  .ref .right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .badge {
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .when { font-size: 10px; color: #666; }
  /* ----- big CTA ----- */
  .cta {
    display: block;
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #ff0080, #ff8000);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 12px;
    font-family: inherit;
    text-decoration: none;
    text-align: center;
    transition: opacity 0.15s, transform 0.05s;
  }
  .cta:hover { opacity: 0.92; }
  .cta:active { transform: translateY(1px); }
  /* ----- link card ----- */
  .linkcard {
    background: linear-gradient(135deg, rgba(74,0,128,0.4), rgba(255,0,128,0.25));
    padding: 14px;
    border-radius: 10px;
    margin-top: 14px;
    border: 1px solid rgba(255,0,128,0.3);
  }
  .linkcard h3 {
    margin: 0 0 6px;
    font-size: 11px;
    letter-spacing: 1px;
    color: #fff;
    text-transform: uppercase;
    font-weight: 700;
  }
  .linkcard .url {
    font-family: 'SF Mono', Consolas, Monaco, monospace;
    font-size: 11px;
    color: #fff;
    word-break: break-all;
    background: rgba(0,0,0,0.3);
    padding: 8px 10px;
    border-radius: 6px;
    margin-bottom: 8px;
  }
  .linkcard button {
    background: #fff;
    color: #4a0080;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .linkcard button:hover { background: rgba(255,255,255,0.92); }
  /* ----- how it works ----- */
  details.how {
    margin-top: 16px;
    background: #1a1a1a;
    border-radius: 10px;
    padding: 0;
  }
  details.how summary {
    padding: 12px 14px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    color: #ccc;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    list-style: none;
  }
  details.how summary::-webkit-details-marker { display: none; }
  details.how summary::after { content: '+'; float: right; color: #ff0080; font-size: 16px; font-weight: 800; }
  details.how[open] summary::after { content: '−'; }
  details.how .howbody {
    padding: 0 14px 14px;
    font-size: 13px;
    color: #aaa;
    line-height: 1.6;
  }
  details.how .step { padding: 6px 0; }
  details.how .step b { color: #fff; }
  /* ----- empty state ----- */
  .empty {
    text-align: center;
    padding: 30px 20px;
    background: #1a1a1a;
    border-radius: 10px;
    color: #888;
    font-size: 13px;
    line-height: 1.6;
  }
  .empty .icon { font-size: 40px; margin-bottom: 10px; opacity: 0.7; }
  /* ----- error state ----- */
  .err {
    text-align: center;
    padding: 30px 20px;
    color: #ff6b6b;
    font-size: 14px;
    background: rgba(255,107,107,0.1);
    border: 1px solid rgba(255,107,107,0.3);
    border-radius: 10px;
  }
  /* ----- loading skeleton ----- */
  .skel {
    display: inline-block;
    background: linear-gradient(90deg,
      rgba(255,255,255,0.06) 0%,
      rgba(255,255,255,0.18) 50%,
      rgba(255,255,255,0.06) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.4s ease-in-out infinite;
    border-radius: 4px;
  }
  @keyframes shimmer { 0% { background-position: -100% 0; } 100% { background-position: 100% 0; } }
  /* ----- footer ----- */
  .footer { text-align: center; padding: 14px; color: rgba(255,255,255,0.6); font-size: 11px; }
  .footer a { color: rgba(255,255,255,0.85); text-decoration: none; }
  /* ----- toast ----- */
  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #33cc66;
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
</style>
</head>
<body>
<div class="card" id="root">
  <div class="hdr">
    <img class="logo" src="/logo.jpg" alt="Neon Giant" onerror="this.style.display='none'">
    <div class="brand">Referral Portal</div>
    <div class="biz">Neon Giant Moving &amp; Junk Removal</div>
    <div class="greet" id="greet"><span class="skel" style="display:inline-block;width:180px;height:24px"></span></div>
    <div class="sub" id="sub">&nbsp;</div>
  </div>
  <div class="body" id="body">
    <div style="padding:40px 20px;text-align:center;color:#888">Loading your dashboard…</div>
  </div>
</div>

<div class="footer">
  Neon Giant Moving &amp; Junk Removal &middot; Skagit Valley, WA &middot;
  <a href="tel:+13609299723">(360) 929-9723</a> &middot;
  <a href="mailto:dane@neongiantmoving.com">dane@neongiantmoving.com</a>
</div>

<div class="toast" id="toast">Link copied!</div>

<script>
'use strict';

// ----------- API helper ----------------------------------------------------
async function api(action, payload) {
  const resp = await fetch('/api/' + encodeURIComponent(action), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload || {}),
  });
  if (!resp.ok) {
    let body = null;
    try { body = await resp.json(); } catch { /* non-JSON error */ }
    const msg = (body && body.error) || ('HTTP ' + resp.status);
    throw new Error(msg);
  }
  return resp.json();
}

// ----------- Helpers -------------------------------------------------------
function getSlug() {
  return new URLSearchParams(location.search).get('r') || '';
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'})[c];
  });
}
function timeAgo(iso) {
  if (!iso) return '';
  const t = new Date(iso).getTime();
  if (isNaN(t)) return '';
  const mins = Math.floor((Date.now() - t) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  if (days < 30) return days + 'd ago';
  const months = Math.floor(days / 30);
  if (months < 12) return months + 'mo ago';
  return Math.floor(months / 12) + 'y ago';
}
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

// Status configuration (kept in sync with realtor-facing view — Lost is hidden).
const STATUS_CONFIG = {
  'new':       { color: '#22aee4', label: 'NEW' },
  'contacted': { color: '#ff9933', label: 'CONTACTED' },
  'booked':    { color: '#33cc66', label: 'BOOKED' },
  'completed': { color: '#ffaa00', label: 'COMPLETED' },
};
function statusBadge(s) {
  const key = String(s || 'new').toLowerCase();
  const cfg = STATUS_CONFIG[key] || STATUS_CONFIG['new'];
  return '<span class="badge" style="background:' + cfg.color + '33;color:' + cfg.color + '">' +
    cfg.label + '</span>';
}

// ----------- Main load -----------------------------------------------------
async function load() {
  const slug = getSlug();
  if (!slug) {
    renderError(
      'Your portal link is missing the realtor ID. Please use the link your Neon Giant ' +
      'contact sent you.',
    );
    return;
  }

  let view;
  try {
    view = await api('getRealtorPortalView', { slug });
  } catch (err) {
    console.error('load failed', err);
    renderError(
      'We couldn\'t load your dashboard right now. Please try again in a moment, or ' +
      'contact Dane at (360) 929-9723.',
    );
    return;
  }

  if (!view || !view.ok) {
    renderError(
      (view && view.error) ||
      'This referral link isn\'t recognized. Double-check the URL, or reach out to ' +
      'your Neon Giant contact.',
    );
    return;
  }

  render(view);
}

function renderError(msg) {
  document.getElementById('greet').textContent = 'Hmm…';
  document.getElementById('sub').textContent = '';
  document.getElementById('body').innerHTML =
    '<div class="err">' + escapeHtml(msg) + '</div>';
}

function render(view) {
  const r        = view.realtor || {};
  const leads    = Array.isArray(view.leads) ? view.leads : [];
  const totals   = view.totals || {};

  // Stats
  const referrals    = totals.total != null      ? totals.total      : leads.length;
  const pending      = totals.earnedPending != null ? totals.earnedPending : 0;
  const paid         = totals.earnedPaid != null   ? totals.earnedPaid   : 0;
  const firstName    = (r.firstName || (String(r.name || '').split(' ')[0]) || 'there');

  // Header
  document.getElementById('greet').innerHTML = 'Hey ' + escapeHtml(firstName) + '!';
  document.getElementById('sub').innerHTML = 'Your referral dashboard';

  // Body
  const slug = getSlug();
  const referUrl = '/refer?r=' + encodeURIComponent(slug);
  const portalLink = location.origin + '/?r=' + encodeURIComponent(slug);

  let h = '';

  // ----- Stat tiles
  h += '<div class="stats">';
  h += '<div class="stat referrals"><div class="num">' + referrals + '</div><div class="lbl">Referrals</div></div>';
  h += '<div class="stat pending"><div class="num">$' + pending + '</div><div class="lbl">Pending</div></div>';
  h += '<div class="stat paid"><div class="num">$' + paid + '</div><div class="lbl">Paid</div></div>';
  h += '</div>';

  // ----- Send a new referral CTA
  h += '<a class="cta" href="' + referUrl + '">Refer someone new &rarr;</a>';

  // ----- Recent referrals
  h += '<div class="h">Your referrals</div>';
  if (!leads.length) {
    h += '<div class="empty">' +
         '<div class="icon">📭</div>' +
         'No referrals yet. Share your link below to send your first one.' +
         '</div>';
  } else {
    leads.forEach(function(l){
      const status = String(l.status || 'new').toLowerCase();
      h += '<div class="ref">';
      h += '  <div style="flex:1;min-width:0">';
      h += '    <div class="name">' + escapeHtml(l.customerName || 'Unknown') + '</div>';
      const meta = [];
      if (l.moveSize) meta.push(escapeHtml(l.moveSize));
      if (l.moveDate) meta.push('Target: ' + escapeHtml(fmtDate(l.moveDate) || l.moveDate));
      if (meta.length) {
        h += '    <div class="meta">' + meta.join(' · ') + '</div>';
      }
      h += '  </div>';
      h += '  <div class="right">';
      h += '    ' + statusBadge(status);
      h += '    <span class="when">' + escapeHtml(timeAgo(l.submittedAt)) + '</span>';
      h += '  </div>';
      h += '</div>';
    });
  }

  // ----- Your link
  h += '<div class="linkcard">';
  h += '  <h3>🔗 Your referral link</h3>';
  h += '  <div class="url" id="urlBox">' + escapeHtml(portalLink) + '</div>';
  h += '  <button onclick="copyLink()">Copy link</button>';
  h += '  <button onclick="shareLink()" style="margin-left:8px;background:rgba(255,255,255,0.18);color:#fff">Share</button>';
  h += '</div>';

  // ----- How it works
  h += '<details class="how">';
  h += '<summary>How it works</summary>';
  h += '<div class="howbody">';
  h += '<div class="step"><b>1.</b> Share your link with anyone moving in the Skagit Valley.</div>';
  h += '<div class="step"><b>2.</b> They submit their info on your referral page. They get <b>$50 off</b>.</div>';
  h += '<div class="step"><b>3.</b> Once their move is complete, you get a <b>$50 gift card</b>, sent at the end of the month.</div>';
  h += '<div class="step" style="margin-top:8px;padding-top:8px;border-top:1px solid #333;color:#888">' +
       'Status legend: <b style="color:#22aee4">New</b> just submitted · ' +
       '<b style="color:#ff9933">Contacted</b> we\'ve reached out · ' +
       '<b style="color:#33cc66">Booked</b> move is on the schedule · ' +
       '<b style="color:#ffaa00">Completed</b> done, gift card coming.</div>';
  h += '</div>';
  h += '</details>';

  document.getElementById('body').innerHTML = h;
}

// ----------- Copy / Share --------------------------------------------------
window.copyLink = async function() {
  const url = document.getElementById('urlBox')?.textContent || '';
  try {
    await navigator.clipboard.writeText(url);
    showToast('Link copied!');
  } catch (err) {
    // Fallback for older browsers
    const tmp = document.createElement('input');
    tmp.value = url;
    document.body.appendChild(tmp);
    tmp.select();
    try { document.execCommand('copy'); showToast('Link copied!'); }
    catch { showToast('Couldn\'t copy — try long-press to copy.'); }
    document.body.removeChild(tmp);
  }
};

window.shareLink = async function() {
  const url = document.getElementById('urlBox')?.textContent || '';
  const greet = document.getElementById('greet')?.textContent || '';
  const firstName = greet.replace(/Hey |!/g, '').trim() || 'friend';
  const text = 'Hey! Here\'s my referral page for Neon Giant Moving. ' +
               'Use it to get $50 off your move:\n' + url;
  if (navigator.share) {
    try {
      await navigator.share({ title: 'Neon Giant Moving Referral', text: text, url: url });
    } catch (e) {
      // user cancelled — ignore
    }
  } else {
    // Fallback: copy share text
    try {
      await navigator.clipboard.writeText(text);
      showToast('Share message copied!');
    } catch {
      showToast('Couldn\'t copy — try long-press on the link.');
    }
  }
};

// Kick off
load();
</script>
</body>
</html>
